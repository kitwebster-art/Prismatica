<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial rainbow gradient: white-hot core, dispersing through warm to cool to violet rim. -->
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" />
      <stop offset="18%" stop-color="#fff4d6" />
      <stop offset="38%" stop-color="#ffd34d" />
      <stop offset="58%" stop-color="#ff2e88" />
      <stop offset="78%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e0ff" />
    </radialGradient>
    <!-- Soft outer glow so the disc feels luminous, not flat -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="rgba(255,46,136,0)" />
      <stop offset="100%" stop-color="rgba(255,46,136,0.55)" />
    </radialGradient>
  </defs>
  <!-- Dark backdrop matching the app's #0a0a0a UI -->
  <rect width="32" height="32" fill="#0a0a0a" rx="6" />
  <!-- Outer pink halo -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)" />
  <!-- Main lens disc -->
  <circle cx="16" cy="16" r="13" fill="url(#lens)" />
  <!-- Concentric ripple rings (reference the ripple lens) -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="0.6" />
  <circle cx="16" cy="16" r="6"   fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="0.6" />
  <circle cx="16" cy="16" r="2.8" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.6" />
  <!-- Tiny specular highlight for the "lens" feel -->
  <ellipse cx="12" cy="11.5" rx="3" ry="1.6" fill="rgba(255,255,255,0.5)" transform="rotate(-25 12 11.5)" />
</svg>
