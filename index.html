<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prismatica V2 — Lens Playground</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; color:#eee; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #ddd; opacity: 0.8; pointer-events: none;
  }
  #hud b { font-weight: 600; letter-spacing: 0.12em; }
  #hud span { color: #888; }

  /* --- Floating eco-mode toggle in the top-left of the canvas --------------- */
  /* Persistent, always one click away — no scrolling the GUI panel to find it. */
  #ecoBtn {
    position: fixed; top: 44px; left: 14px; z-index: 11;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; user-select: none;
    background: rgba(28, 28, 28, 0.85); color: #aaa; border: 1px solid #333;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  #ecoBtn:hover { color: #fff; border-color: #555; }
  #ecoBtn.on { background: #2bd672; color: #052e15; border-color: #2bd672; font-weight: 600; }
  body.render-mode #ecoBtn { display: none; }

  /* Shape view button — sits next to eco. Toggles a topographic clay render
     of the lens form for sense-checking and fabricator briefs. */
  #shapeBtn {
    position: fixed; top: 44px; left: 86px; z-index: 11;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; user-select: none;
    background: rgba(28, 28, 28, 0.85); color: #aaa; border: 1px solid #333;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  #shapeBtn:hover { color: #fff; border-color: #555; }
  #shapeBtn.on { background: #ff8a3a; color: #1a0a00; border-color: #ff8a3a; font-weight: 600; }
  body.render-mode #shapeBtn { display: none; }

  /* --- Dimension overlay (fabrication-focused) ----------------------------- */
  /* Live readout of the current lens spec — useful when liaising with the
     manufacturer or sense-checking a tweak. Toggled from Actions folder. */
  #dimPanel {
    position: fixed; bottom: 12px; right: 320px; z-index: 10;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10px;
    color: #aaa; background: rgba(20, 20, 20, 0.85);
    border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 10px 14px; letter-spacing: 0.04em;
    min-width: 220px; pointer-events: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none;
  }
  #dimPanel.on { display: block; }
  #dimPanel .heading { color: #555; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  #dimPanel .row { display: flex; justify-content: space-between; gap: 18px; line-height: 1.6; }
  #dimPanel .row span:last-child { color: #fff; font-variant-numeric: tabular-nums; }
  body.render-mode #dimPanel { display: none !important; }
  /* #status hidden — Kit doesn't want the bottom-of-screen "eco mode on" /
     "preset loaded" / "render saved" chatter cluttering the canvas. The element
     stays in the DOM so all the setStatus() calls scattered through the code
     don't need rewriting; it's just visually invisible. */
  #status { display: none; }
  #fps {
    position: fixed; bottom: 12px; left: 14px; z-index: 10;
    font-size: 11px; color: #888; font-family: "SF Mono", ui-monospace, Menlo, monospace;
    pointer-events: none;
  }
  canvas { display: block; }
  .lil-gui { --background-color: #111; --widget-color: #1e1e1e; --focus-color: #333; --hover-color: #2a2a2a; --number-color: #f0a; --string-color: #0af; font-size: 11px; }
  .lil-gui.root { --width: 300px; }
  .lil-gui .title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  /* Active state for toggle-style action buttons (eco mode, pause, record, sequence preview).
     For function-type controllers, lil-gui puts the .name div INSIDE the <button>, so the
     button's background and the label's colour need to contrast directly. */
  .lil-gui .controller.btn-active button { background: #2bd672 !important; box-shadow: inset 0 0 0 1px rgba(43, 214, 114, 0.7); }
  .lil-gui .controller.btn-active button .name { color: #052e15 !important; font-weight: 600; }
  /* Recording uses red instead of green so it's unambiguous at a glance. */
  .lil-gui .controller.btn-active.btn-rec button { background: #ff5050 !important; box-shadow: inset 0 0 0 1px rgba(255, 80, 80, 0.7); }
  .lil-gui .controller.btn-active.btn-rec button .name { color: #2a0000 !important; }
  .fi { position: absolute; left: -9999px; }

  /* --- render mode overlay ------------------------------------------------ */
  /* Shown during offline render. Covers canvas + GUI so the compositor has less
     work to do and the user gets a clean "rendering…" screen. */
  #renderOverlay {
    position: fixed; inset: 0; z-index: 100000; display: none;
    background: #000; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    justify-content: center; align-items: center;
  }
  #renderOverlay.on { display: flex; }
  body.render-mode canvas { display: none !important; }
  body.render-mode .lil-gui { display: none !important; }
  body.render-mode #hud, body.render-mode #fps, body.render-mode #aspectOverlay { display: none !important; }
  body.render-mode #status { display: none !important; }
  #renderOverlay .box {
    text-align: center; max-width: 640px; padding: 0 32px;
  }
  #renderOverlay h1 {
    margin: 0 0 8px 0; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #888; font-weight: 500;
  }
  #renderOverlay .title2 {
    font-size: 32px; font-weight: 300; letter-spacing: 0.02em; margin: 0 0 36px 0;
    background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #renderOverlay .stats {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 13px; color: #aaa; margin-bottom: 20px; line-height: 1.8;
  }
  #renderOverlay .stats .num { color: #fff; }
  #renderOverlay .bar {
    width: 100%; height: 6px; background: #1a1a1a; border-radius: 3px;
    overflow: hidden; margin-bottom: 24px;
  }
  #renderOverlay .barFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3af, #f0a);
    transition: width 120ms linear;
  }
  #renderOverlay .btnRow {
    display: flex; gap: 12px; justify-content: center; align-items: center;
  }
  #renderOverlay .stopBtn, #renderOverlay .pauseBtn {
    appearance: none; background: transparent; color: #888; border: 1px solid #333;
    padding: 10px 28px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    font-family: inherit; cursor: pointer; border-radius: 4px;
    transition: color 120ms, border-color 120ms;
  }
  #renderOverlay .stopBtn:hover, #renderOverlay .pauseBtn:hover { color: #fff; border-color: #666; }
  #renderOverlay .pauseBtn.paused { color: #3af; border-color: #3af; }
  #renderOverlay .pauseBtn.paused:hover { color: #7cf; border-color: #7cf; }
  #renderOverlay .hint { color: #555; font-size: 11px; margin-top: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
  /* In-overlay eco render dropdown — flip throttle level mid-render so the
     laptop can stay usable for other work while the export finishes. */
  #renderOverlay .ecoRow {
    display: flex; align-items: center; gap: 12px;
    margin: 12px auto 18px auto; padding: 10px 16px; max-width: 360px;
    background: rgba(43, 214, 114, 0.06); border: 1px solid rgba(43, 214, 114, 0.18);
    border-radius: 999px;
  }
  #renderOverlay .ecoRow label {
    color: #2bd672; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
  }
  #renderOverlay .ecoRow select {
    appearance: none; background: rgba(20,20,20,0.7); color: #ddd;
    border: 1px solid #333; border-radius: 4px;
    padding: 6px 28px 6px 12px; font-family: inherit; font-size: 11px;
    letter-spacing: 0.05em; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='none' stroke='%23888' stroke-width='1.5' d='M1 1l4 4 4-4'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
  }
  #renderOverlay .ecoRow select:hover { border-color: #555; color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<!-- HUD / floating eco + shape buttons removed at Kit's request. Eco and shape
     toggles now live in the Actions folder; FPS is shown there too. -->

<div id="dimPanel">
  <div class="heading">Dimensions</div>
  <div class="row"><span>footprint</span><span id="dimFoot">—</span></div>
  <div class="row"><span>base thickness</span><span id="dimBase">—</span></div>
  <div class="row"><span>peak height</span><span id="dimPeak">—</span></div>
  <div class="row"><span>total height</span><span id="dimTotal">—</span></div>
  <div class="row"><span>narrowest</span><span id="dimNarrow">—</span></div>
  <div class="row"><span>est. mass (PMMA)</span><span id="dimMass">—</span></div>
</div>
<div id="status">loading…</div>

<div id="renderOverlay">
  <div class="box">
    <h1>Exporting Video</h1>
    <div class="title2" id="roTitle">Rendering…</div>
    <div class="bar"><div class="barFill" id="roBarFill"></div></div>
    <div class="stats" id="roStats">preparing encoder…</div>
    <div class="ecoRow">
      <label for="roEcoSelect">🌱 eco render</label>
      <select id="roEcoSelect">
        <option value="off">off (fastest)</option>
        <option value="light">light · ~75% load</option>
        <option value="half-speed">half-speed · ~50% load</option>
        <option value="gentle">gentle · ~25% load</option>
      </select>
    </div>
    <div class="btnRow">
      <button class="pauseBtn" id="roPauseBtn">⏸ Pause</button>
      <button class="stopBtn" id="roStopBtn">■ Stop</button>
    </div>
    <div class="hint">eco can be changed mid-render · keep this tab in the foreground for fastest render</div>
  </div>
</div>

<input type="file" id="fileImage" class="fi" accept="image/*" />
<input type="file" id="fileVideo" class="fi" accept="video/*" />
<input type="file" id="fileImport" class="fi" accept="application/json" />
<input type="file" id="fileLogo"  class="fi" accept="image/*,.svg" />
<input type="file" id="fileLut"   class="fi" accept=".cube,.CUBE" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import GUI from 'lil-gui';

const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

// -------------------------------------------------------------------------
// Renderer + scene
// -------------------------------------------------------------------------
// preserveDrawingBuffer:true is REQUIRED for reliable canvas → VideoFrame /
// drawImage capture during the offline render. Without it the WebGL back
// buffer can be cleared by the browser between renderFrame() and the encoder
// readback, which manifests as random "flashing" glitches in random parts of
// random frames (stale or empty pixels). Has a small live-perf cost but is
// necessary for clean exports.
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const QUALITY_PRESETS = {
  eco:      { pixelRatio: 1.0, transmissionScale: 0.4 },
  balanced: { pixelRatio: 1.5, transmissionScale: 0.7 },
  high:     { pixelRatio: 2.0, transmissionScale: 1.0 },
  ultra:    { pixelRatio: Math.min(window.devicePixelRatio, 3.0), transmissionScale: 1.0 },
};
// Declared here so applyRenderQuality (called at startup) can check it safely.
// Set true at the start of renderOffline(), false when it completes.
let offlineInProgress = false;

function applyRenderQuality(name) {
  // Never resize during an offline render — renderer.setSize() invalidates
  // the transmission render target and causes the wavy coloured-band glitch.
  if (offlineInProgress) return;
  const q = QUALITY_PRESETS[name] || QUALITY_PRESETS.high;
  renderer.setPixelRatio(q.pixelRatio);
  renderer.transmissionResolutionScale = q.transmissionScale;
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (typeof composer !== 'undefined') {
    composer.setPixelRatio(q.pixelRatio);
    composer.setSize(window.innerWidth, window.innerHeight);
    bloomPass.setSize(window.innerWidth, window.innerHeight);
  }
}
// Transmission rendering is the main cost. Halve its internal render target.
renderer.transmissionResolutionScale = 1.0;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Near plane dropped to 0.1 so geometry doesn't clip when zoomed in for macros.
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 8000);
camera.position.set(0, 220, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
// minDistance was 200; dropped to 10 so the camera can push right up to the lens
// surface for macro shots through individual ripples. maxDistance bumped so wide
// overview shots have headroom too.
controls.minDistance = 10;
controls.maxDistance = 6000;

// While the user drags the camera, auto orbit/zoom/pan step aside so the
// mouse wins. On release, the motion recenters on wherever the camera ended up.
let userInteractingWithCamera = false;
controls.addEventListener('start', () => {
  userInteractingWithCamera = true;
  // Undo any active pan offset so the on-screen camera position matches the
  // real world position (otherwise the drag starts from a stale point).
  if (typeof updateCameraMotion !== 'undefined' && updateCameraMotion._lastPanDy) {
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
  }
});
controls.addEventListener('end', () => {
  userInteractingWithCamera = false;
  // Force auto-motion to recapture "home" from the new camera pose.
  orbitHomeAzimuth = null;
  orbitHomeElevation = null;
  orbitPhase = 0;
  zoomBaseDist = null;
  zoomPhase = 0;
  panPhase = 0;
});

// -------------------------------------------------------------------------
// Post-processing (bloom)
// -------------------------------------------------------------------------
// Intermediate EffectComposer RT — NO samples (MSAA on post-processing RTs
// causes intermittent resolve failures on some GPU/driver combos, manifesting
// as grey-square / banding flashes on random frames in both live view and
// exported video). Anti-aliasing is handled by renderer antialias:true and
// the SSAA path in the offline render; we don't need MSAA here.
// colorSpace must be NoColorSpace (linear passthrough) for intermediate RTs —
// sRGB encoding belongs only on the final OutputPass. Combining SRGBColorSpace
// with HalfFloatType on an intermediate buffer caused double gamma conversion
// and out-of-range values that different drivers handle inconsistently.
const postRT = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  type: THREE.HalfFloatType,
  colorSpace: THREE.NoColorSpace,
});
const composer = new EffectComposer(renderer, postRT);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(window.innerWidth, window.innerHeight);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.5,   // strength
  0.7,   // radius
  0.82,  // threshold
);
bloomPass.enabled = false;
composer.addPass(bloomPass);

// --- Look Grade post-processing pass ---------------------------------------
// Applied to the final composited image (lens + panel + bloom). Adds creative
// finishing controls without affecting the underlying scene: saturation,
// contrast, vignette, film grain. All defaults are neutral (1, 1, 0, 0) so the
// pass is a no-op until the user dials anything in.
const lookGradeShader = {
  uniforms: {
    tDiffuse:    { value: null },
    uSaturation: { value: 1.0 },
    uContrast:   { value: 1.0 },
    uVignette:   { value: 0.0 },
    uGrain:      { value: 0.0 },
    uSharpen:    { value: 0.0 },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0.0 },
    tLut:        { value: null },
    uLutSize:    { value: 0.0 },   // 0 = no LUT loaded
    uLutMix:     { value: 1.0 },   // 0..1 strength of LUT vs original
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uSaturation;
    uniform float uContrast;
    uniform float uVignette;
    uniform float uGrain;
    uniform float uSharpen;
    uniform vec2  uResolution;
    uniform float uTime;
    uniform sampler2D tLut;
    uniform float uLutSize;
    uniform float uLutMix;

    // Sample a 3D LUT packed into a 2D strip texture of size (N*N) × N.
    // Bilinear filtering on the texture handles R+G axes; we manually blend
    // along B for trilinear interpolation. uLutSize=0 short-circuits so the
    // pass is a no-op when no LUT is loaded.
    vec3 lookupLut(vec3 c) {
      float N = uLutSize;
      vec3 cc = clamp(c, vec3(0.0), vec3(1.0));
      float r = cc.r * (N - 1.0);
      float g = cc.g * (N - 1.0);
      float b = cc.b * (N - 1.0);
      float b0 = floor(b);
      float b1 = min(b0 + 1.0, N - 1.0);
      float bFrac = b - b0;
      float u0 = (b0 * N + r + 0.5) / (N * N);
      float u1 = (b1 * N + r + 0.5) / (N * N);
      float v  = (g + 0.5) / N;
      vec3 col0 = texture2D(tLut, vec2(u0, v)).rgb;
      vec3 col1 = texture2D(tLut, vec2(u1, v)).rgb;
      return mix(col0, col1, bFrac);
    }

    void main() {
      vec4 c = texture2D(tDiffuse, vUv);

      // Sharpen — Laplacian convolution. Skipped when uSharpen == 0 to avoid
      // the four extra texture taps. Strength 0..1 maps to a strong unsharp.
      if (uSharpen > 0.0) {
        vec2 px = 1.0 / uResolution;
        vec3 cN = texture2D(tDiffuse, vUv + vec2(0.0, px.y)).rgb;
        vec3 cS = texture2D(tDiffuse, vUv - vec2(0.0, px.y)).rgb;
        vec3 cE = texture2D(tDiffuse, vUv + vec2(px.x, 0.0)).rgb;
        vec3 cW = texture2D(tDiffuse, vUv - vec2(px.x, 0.0)).rgb;
        vec3 lap = c.rgb * 4.0 - cN - cS - cE - cW;
        c.rgb += lap * uSharpen;
      }

      // Saturation around perceptual luminance.
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      c.rgb = mix(vec3(l), c.rgb, uSaturation);
      // Contrast pivots around 0.5 (midpoint).
      c.rgb = (c.rgb - 0.5) * uContrast + 0.5;

      // LUT — apply colour grade lookup if a CUBE file is loaded.
      if (uLutSize > 1.5) {
        vec3 graded = lookupLut(c.rgb);
        c.rgb = mix(c.rgb, graded, uLutMix);
      }

      // Vignette: smooth radial darkening from centre. uVignette=0 = no fade.
      float r = length(vUv - 0.5);
      float vig = 1.0 - smoothstep(0.35, 0.85, r) * uVignette;
      c.rgb *= vig;
      // Film grain: temporal noise modulated by uGrain. Stays subtle even at 1.
      if (uGrain > 0.0) {
        float n = fract(sin(dot(vUv * (1.0 + fract(uTime)), vec2(12.9898, 78.233))) * 43758.5453);
        c.rgb += (n - 0.5) * uGrain * 0.12;
      }
      gl_FragColor = c;
    }
  `,
};
const lookPass = new ShaderPass(lookGradeShader);
composer.addPass(lookPass);

composer.addPass(new OutputPass());

function renderFrame(timeOverride) {
  // Tick the grain time so the noise field shifts each frame. During offline
  // export we pass the frame's playback timestamp so grain advances at the
  // EXPORT framerate (deterministic per frame). In live view we fall back to
  // wall-clock so grain animates regardless of paused panel time.
  lookPass.uniforms.uTime.value = (timeOverride !== undefined)
    ? timeOverride
    : performance.now() * 0.001;
  composer.render();
}

const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(400, 600, 800);
scene.add(key);
const rim = new THREE.DirectionalLight(0x66aaff, 0.5);
rim.position.set(-600, 200, -400);
scene.add(rim);

// -------------------------------------------------------------------------
// LED shader
// -------------------------------------------------------------------------
const panelTexture = { value: null };
const hasTexture = { value: 0 };

const ledShader = {
  uniforms: {
    uTime:       { value: 0 },
    uMode:       { value: 1 },
    uScale:      { value: 40.0 },
    uSpeed:      { value: 0.5 },
    uBrightness: { value: 2.4 },
    uHueShift:   { value: 0.0 },
    uPanelSat:   { value: 1.0 },
    uTex:        panelTexture,
    uHasTex:     hasTexture,
    uPgLineWidth:{ value: 0.06 },  // pixelgrid: gridline thickness as fraction of cell pitch
    uPgFlow:     { value: 0.4 },   // pixelgrid: drift speed in cells per second (real time)
    // --- Generic per-pattern shaping uniforms ---------------------------------
    // Reusable "knobs" for shape-based modes (wave, radial, scanlines, spiral,
    // rings, squares, diamond bands) and the fluid shaders. Each mode interprets
    // them in its own context-appropriate way, but the GUI labels stay consistent
    // ("sharpness", "scale", "detail", "distortion") so the user has a stable
    // mental model. Values normalised to [0..1] where possible so behaviour is
    // predictable across modes.
    uPatSharp:   { value: 0.5 },   // 0..1 — edge crispness (0 soft, 1 razor)
    uPatScale:   { value: 1.0 },   // 0.3..4 — pattern frequency multiplier
    uPatDetail:  { value: 0.5 },   // 0..1 — fractal octave / sub-pattern density
    uPatDistort: { value: 0.0 },   // 0..1 — radial / sweep distortion amount
    uPatSeed:    { value: 0.0 },   // 0..100 — random offset for noise-based modes
    uPatAxis:    { value: 0 },     // 0=horizontal, 1=vertical, 2=diagonal (scanlines etc.)
    uPanelContrast: { value: 1.0 },// 0.5..2.5 — global contrast applied to the final panel colour
    uPanelMirror:{ value: 0 },     // 1 = fold uv into the top-right quadrant for H+V symmetry
    uSqThickness:{ value: 0.5 },
    uSqSoftness: { value: 0.3 },
    uSqMono:     { value: 0 },
    uSqDir:      { value: 1.0 },
    uSqHueSpread:{ value: 2.5 },
    // Gradient overlay for Squares mode. Baked into the panel texture so the
    // lens refracts/magnifies it naturally as the camera moves — that's the
    // "stretchy" effect that shows off when filming from different angles.
    uSqGrad:     { value: 0 },
    uSqGradA:    { value: new THREE.Color(0xff2e88) },  // magenta
    uSqGradB:    { value: new THREE.Color(0x00e0ff) },  // cyan
    uSqGradC:    { value: new THREE.Color(0xffd34d) },  // warm gold
    uSqGradAxis: { value: 0 },  // 0=radial 1=horiz 2=vert 3=diagonal 4=angle
    uSqGradScale:{ value: 1.0 },
    uSqGradFlow: { value: 0.15 },
    uPanelSmooth:{ value: 1 },  // 0 = hard cells, 1 = 4-tap AA (kills scan-line aliasing)
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform int   uMode;
    uniform float uScale;
    uniform float uSpeed;
    uniform float uBrightness;
    uniform float uHueShift;
    uniform float uPanelSat;
    uniform float uPgLineWidth;
    uniform float uPgFlow;
    uniform float uPatSharp;
    uniform float uPatScale;
    uniform float uPatDetail;
    uniform float uPatDistort;
    uniform float uPatSeed;
    uniform int   uPatAxis;
    uniform float uPanelContrast;
    uniform int   uPanelMirror;
    uniform sampler2D uTex;
    uniform int uHasTex;
    uniform float uSqThickness;
    uniform float uSqSoftness;
    uniform int   uSqMono;
    uniform float uSqDir;
    uniform float uSqHueSpread;
    uniform int   uSqGrad;
    uniform vec3  uSqGradA;
    uniform vec3  uSqGradB;
    uniform vec3  uSqGradC;
    uniform int   uSqGradAxis;
    uniform float uSqGradScale;
    uniform float uSqGradFlow;
    uniform int   uPanelSmooth;

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz)*6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }

    // Smooth value noise — interpolates between hashed cell corners with a
    // smoothstep curve. Cheap, no derivatives, plenty good for fluid panels.
    float vnoise(vec2 p) {
      vec2 ip = floor(p);
      vec2 fp = fract(p);
      vec2 u = fp * fp * (3.0 - 2.0 * fp);
      float a = hash(ip);
      float b = hash(ip + vec2(1.0, 0.0));
      float c = hash(ip + vec2(0.0, 1.0));
      float d = hash(ip + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    // Fractal Brownian Motion — sums octaves of value noise at decreasing
    // amplitude. This gives the rich high-detail texture for liquid shaders.
    float fbm(vec2 p) {
      float v = 0.0;
      float amp = 0.5;
      for (int i = 0; i < 5; i++) {
        v += amp * vnoise(p);
        p *= 2.0;
        amp *= 0.5;
      }
      return v;
    }
    // Inigo Quilez cosine palette — produces smooth iridescent gradients
    // controlled by 4 vec3s (DC, amp, freq, phase). Great for fluid colour.
    vec3 iqPalette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
      return a + b * cos(6.2831853 * (c * t + d));
    }

    vec3 computeLedColor(vec2 uv, float t) {
      // H+V mirror: fold the uv into the top-right quadrant of the panel so the
      // four quadrants mirror each other. Cheapest and most general way to
      // symmetrise every panel mode at once — no per-mode patches needed.
      if (uPanelMirror == 1) {
        uv = vec2(0.5) + abs(uv - vec2(0.5));
      }
      vec2 px = floor(uv * uScale);
      vec2 puv = (px + 0.5) / uScale;
      vec3 col = vec3(0.0);

      if (uMode == 0) {
        float c = mod(px.x + px.y, 2.0);
        float h = c * 0.5 + uHueShift + t * 0.1;
        col = hsv2rgb(vec3(fract(h), 0.85, 0.9));
      } else if (uMode == 1) {
        // Crisp black-and-white pixel grid. Bright square cells separated by thin
        // black gridlines. uScale controls cell density. uPgLineWidth controls the
        // thickness of the black lines (fraction of cell). uPgFlow drifts the grid
        // diagonally in cells/sec of real time — gentle motion when filming.
        vec2 drift = vec2(uTime, uTime * 0.7) * uPgFlow;
        vec2 cell = uv * uScale + drift;
        vec2 f = abs(fract(cell) - 0.5);
        float edge = max(f.x, f.y);
        float aa = fwidth(edge);
        float lw = clamp(uPgLineWidth, 0.0, 0.49);
        float pixel = 1.0 - smoothstep(0.5 - lw - aa, 0.5 - lw + aa, edge);
        col = vec3(pixel);
      } else if (uMode == 2) {
        // WAVE — three-octave sine interference for richer detail. uPatScale
        // controls overall frequency, uPatDetail mixes in higher-frequency
        // overtones for intricacy, uPatSharp narrows the bright/dark band so
        // dark areas become more pronounced and edges sharper.
        float s = 1.0 + uPatScale * 1.4;
        float a = sin(uv.x * 12.0 * s + t * 2.0) * cos(uv.y * 8.0 * s - t * 1.3);
        float b = sin(uv.x * 22.0 * s - t * 1.5 + 1.0) * cos(uv.y * 17.0 * s + t * 0.9);
        float c2 = sin((uv.x + uv.y) * 9.0 * s + t * 0.7) * cos((uv.x - uv.y) * 14.0 * s - t * 1.1);
        float v = a * 0.55 + b * 0.30 * uPatDetail + c2 * 0.25 * uPatDetail;
        v = v * 0.5 + 0.5;
        // Sharpness band: shrinks the lit zone for crisper black backgrounds.
        float band = mix(0.50, 0.04, clamp(uPatSharp, 0.0, 1.0));
        v = smoothstep(0.5 - band, 0.5 + band, v);
        col = hsv2rgb(vec3(fract(v + uHueShift + t * 0.04), 0.85, v));
      } else if (uMode == 3) {
        // RADIAL — concentric rings with optional swirl distortion. uPatSharp
        // narrows the band into hard ridges, uPatDistort warps the rings into
        // a slow swirl, uPatScale changes ring count.
        vec2 c = uv - 0.5;
        float r = length(c);
        float ang = atan(c.y, c.x);
        float swirl = uPatDistort * 4.0 * sin(ang * 3.0 + t * 0.4);
        float ringFreq = uScale * 0.6 * (0.5 + uPatScale * 0.8);
        float v = 0.5 + 0.5 * sin(r * ringFreq - t * 3.0 + swirl);
        float band = mix(0.45, 0.04, clamp(uPatSharp, 0.0, 1.0));
        v = smoothstep(0.5 - band, 0.5 + band, v);
        col = hsv2rgb(vec3(fract(r * 2.0 + uHueShift + t * 0.05), 0.85, v));
      } else if (uMode == 4) {
        // SCANLINES — sharp parallel bands. uPatAxis selects:
        //   0 = horizontal lines (current default)
        //   1 = vertical lines
        //   2 = diagonal /
        //   3 = anti-diagonal \
        //   4 = X-split (lens-aligned): vertical lines on the side triangles
        //       (where |x| > |y|), horizontal lines on the top/bottom triangles
        //       (where |y| > |x|). The X-boundary lines up with the X-shape the
        //       lens optically draws on the panel — scan lines all "point inward"
        //       toward the centre.
        //   5 = X-split inverted: horizontal on sides, vertical on top/bottom.
        vec2 c = uv - 0.5;
        float coord;
        if      (uPatAxis == 1) coord = uv.x;
        else if (uPatAxis == 2) coord = (uv.x + uv.y) * 0.7071;
        else if (uPatAxis == 3) coord = (uv.x - uv.y) * 0.7071;
        else if (uPatAxis == 4) coord = (abs(c.x) > abs(c.y)) ? uv.x : uv.y;
        else if (uPatAxis == 5) coord = (abs(c.x) > abs(c.y)) ? uv.y : uv.x;
        else                    coord = uv.y;
        float freq = 40.0 * (0.4 + uPatScale * 1.2);
        float v = 0.5 + 0.5 * sin(coord * freq + t * 1.0);
        float band = mix(0.45, 0.03, clamp(uPatSharp, 0.0, 1.0));
        v = smoothstep(0.5 - band, 0.5 + band, v);
        col = hsv2rgb(vec3(uHueShift, 0.75, v));
      } else if (uMode == 5) {
        vec2 q = px + floor(t * 6.0);
        float h = hash(q);
        col = hsv2rgb(vec3(fract(h + uHueShift), 0.9, 1.0));
      } else if (uMode == 6) {
        col = vec3(1.0);
      } else if (uMode == 9) {
        vec2 cell = floor(uv * uScale);
        vec2 cp = fract(uv * uScale) - 0.5;
        float h = hash(cell + floor(t * 0.3));
        float brightness = 0.0;
        if (h > 0.88) {
          float tw = 0.5 + 0.5 * sin(t * 5.0 + h * 50.0);
          float d = length(cp);
          float core = smoothstep(0.45, 0.0, d * 4.0);
          float cross = max(smoothstep(0.015, 0.0, abs(cp.x)), smoothstep(0.015, 0.0, abs(cp.y))) * smoothstep(0.5, 0.0, d);
          brightness = (core * core + cross * 0.6) * (0.4 + 0.6 * tw);
        }
        vec3 tint = hsv2rgb(vec3(fract(h * 2.0 + uHueShift), 0.5, 1.0));
        col = brightness * mix(vec3(1.0), tint, 0.5);
      } else if (uMode == 10) {
        // SPIRAL — galactic arms. uPatDetail controls arm count (2..8),
        // uPatDistort adds chromatic-twist that smears arms into longer streaks,
        // uPatSharp narrows ridges into hard lines.
        vec2 c = uv - 0.5;
        float r = length(c);
        float a = atan(c.y, c.x);
        float arms = floor(2.0 + uPatDetail * 6.0);
        float twist = 9.0 * (0.4 + uPatScale * 1.3);
        float warp = uPatDistort * 2.0 * sin(a * arms * 0.5 + t * 0.4);
        float spiral = sin(a * arms + log(r + 0.01) * twist - t * 1.8 + warp);
        float band = mix(0.45, 0.03, clamp(uPatSharp, 0.0, 1.0));
        float arm = smoothstep(0.5 - band, 0.5 + band, spiral * 0.5 + 0.5) * smoothstep(0.65, 0.0, r);
        float core = smoothstep(0.05, 0.0, r) * 1.4;
        float hue = fract(0.62 + r * 0.6 + uHueShift);
        col = hsv2rgb(vec3(hue, 0.85, arm)) + vec3(1.0, 0.85, 0.6) * core;
      } else if (uMode == 11) {
        // RINGS — concentric rings with optional petal-distortion (uPatDistort
        // warps them into flower-like shapes). uPatSharp narrows bands into
        // hard ridges. uPatScale tunes ring density.
        vec2 c = uv - 0.5;
        float r = length(c);
        float ang = atan(c.y, c.x);
        float petals = floor(3.0 + uPatDetail * 9.0);
        float distort = uPatDistort * 0.18 * sin(ang * petals + t * 0.4);
        float freq = uScale * 1.2 * (0.5 + uPatScale * 1.0);
        float rings = sin((r + distort) * freq - t * 4.0);
        float band = mix(0.45, 0.03, clamp(uPatSharp, 0.0, 1.0));
        float v = smoothstep(0.5 - band, 0.5 + band, rings * 0.5 + 0.5);
        col = hsv2rgb(vec3(uHueShift, 0.9, v));
      } else if (uMode == 12) {
        // RAYS — hard-edged spokes radiating from centre. Replaced the old
        // pow(ray, 3) gradient with an antialiased smoothstep band so each ray
        // reads as a crisp wedge with a clean dark gap between spokes.
        vec2 c = uv - 0.5;
        float a = atan(c.y, c.x);
        float r = length(c);
        float spokes = 12.0;
        float ray = 0.5 + 0.5 * cos(a * spokes - t * 1.0);
        float aa = fwidth(ray) * 1.5;
        float v = smoothstep(0.55 - aa, 0.55 + aa, ray) * smoothstep(0.55, 0.0, r);
        col = hsv2rgb(vec3(fract(a / 6.2832 + t * 0.1 + uHueShift), 0.85, v));
      } else if (uMode == 13) {
        // SQUARES — concentric Chebyshev ring bands with new generic knobs.
        // uPatSharp now controls edge crispness, uPatScale tunes ring density,
        // uPatDistort warps the squares into rounded shapes (corner softening),
        // uPatDetail mixes a secondary high-frequency banding for richer feel.
        vec2 cAbs = abs(uv - 0.5);
        // Distortion blends Chebyshev (square rings) toward Euclidean (circular):
        //   uPatDistort = 0 → max(|x|,|y|) hard squares
        //   uPatDistort = 1 → length(c) full circles
        float dSq = max(cAbs.x, cAbs.y);
        float dCr = length(cAbs);
        float d = mix(dSq, dCr, clamp(uPatDistort, 0.0, 1.0));
        float freq = uScale * 0.5 * (0.4 + uPatScale * 1.3);
        float phase = d * freq - t * 3.0 * uSqDir;
        float tri = 1.0 - abs(fract(phase / 6.2831853) * 2.0 - 1.0);
        // Mix in a secondary higher-frequency band for detail.
        float tri2 = 1.0 - abs(fract(phase * 3.0 / 6.2831853) * 2.0 - 1.0);
        tri = mix(tri, tri * tri2, clamp(uPatDetail, 0.0, 1.0) * 0.6);
        // Sharpness: narrow lit zone → fatter black gaps + crisper edges.
        float halfWidth = mix(0.7, 0.08, clamp(uPatSharp, 0.0, 1.0));
        float soft = mix(0.2, 0.005, clamp(uPatSharp, 0.0, 1.0));
        float edge = smoothstep(halfWidth - soft, halfWidth, tri);
        if (uSqGrad == 1) {
          // Sample a 3-stop gradient (A→B→C→A) along the chosen axis.
          // Baked into the panel so the lens stretches/magnifies it on camera moves.
          float g;
          if      (uSqGradAxis == 0) g = length(uv - 0.5) * 1.4142;                        // radial
          else if (uSqGradAxis == 1) g = uv.x;                                             // horizontal
          else if (uSqGradAxis == 2) g = uv.y;                                             // vertical
          else if (uSqGradAxis == 3) g = (uv.x + uv.y) * 0.5;                              // diagonal
          else                        g = atan(uv.y - 0.5, uv.x - 0.5) / 6.2831853 + 0.5;  // angular
          g = fract(g * uSqGradScale + t * uSqGradFlow + uHueShift);
          float s = g * 3.0;
          vec3 g0, g1; float lt;
          if (s < 1.0)      { g0 = uSqGradA; g1 = uSqGradB; lt = s; }
          else if (s < 2.0) { g0 = uSqGradB; g1 = uSqGradC; lt = s - 1.0; }
          else              { g0 = uSqGradC; g1 = uSqGradA; lt = s - 2.0; }
          vec3 grad = mix(g0, g1, lt);
          vec3 mono = vec3(edge);
          col = mix(grad * edge, mono, float(uSqMono));
        } else {
          float hue = fract(d * uSqHueSpread - t * 0.15 + uHueShift);
          vec3 colourful = hsv2rgb(vec3(hue, 0.9, edge));
          vec3 mono = vec3(edge);
          col = mix(colourful, mono, float(uSqMono));
        }
      } else if (uMode == 7 || uMode == 8) {
        vec2 samp = (uScale >= 999.0) ? uv : puv;
        vec3 tex = (uHasTex == 1) ? texture2D(uTex, samp).rgb : vec3(0.2);
        col = tex;
        if (uHueShift != 0.0) {
          float mx = max(max(col.r, col.g), col.b);
          float mn = min(min(col.r, col.g), col.b);
          float v = mx;
          float s = mx > 0.0 ? (mx - mn) / mx : 0.0;
          float h = 0.0;
          if (mx != mn) {
            if (mx == col.r) h = (col.g - col.b) / (mx - mn);
            else if (mx == col.g) h = 2.0 + (col.b - col.r) / (mx - mn);
            else h = 4.0 + (col.r - col.g) / (mx - mn);
            h /= 6.0; if (h < 0.0) h += 1.0;
          }
          h = fract(h + uHueShift);
          col = hsv2rgb(vec3(h, s, v));
        }
      } else if (uMode == 14) {
        // LIQUID IRIDESCENCE — domain-warped FBM. uPatScale tunes overall
        // scale, uPatDetail controls how many warp stages (intricacy), uPatSeed
        // shifts the noise field for a fresh look. uPatSharp drives contrast.
        float scl = 0.7 + uPatScale * 1.6;
        vec2 q = (uv * 2.0 - 1.0) * scl + vec2(uPatSeed * 0.31, uPatSeed * 0.47);
        float tt = t * 0.05;
        vec2 w1 = vec2(fbm(q + vec2(0.0, 0.0) + tt), fbm(q + vec2(5.2, 1.3) + tt));
        vec2 w2 = vec2(fbm(q + 4.0 * w1 + vec2(1.7, 9.2) + tt * 0.7),
                       fbm(q + 4.0 * w1 + vec2(8.3, 2.8) + tt * 0.7));
        // Detail mixes a third warp stage for higher intricacy at high uPatDetail.
        vec2 w3 = vec2(fbm(q + 6.0 * w2 + vec2(11.1, 3.3) + tt * 0.5),
                       fbm(q + 6.0 * w2 + vec2(2.9, 7.7) - tt * 0.5));
        vec2 wF = mix(w2, w3, clamp(uPatDetail, 0.0, 1.0));
        float v = fbm(q + 4.0 * wF);
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.0, 0.33, 0.67);
        vec3 hue = iqPalette(v + uHueShift + t * 0.02, a, b, c, d);
        float lo = mix(0.30, 0.05, clamp(uPatSharp, 0.0, 1.0));
        float hi = mix(0.70, 0.95, clamp(uPatSharp, 0.0, 1.0));
        float mask = smoothstep(lo, hi, v);
        col = hue * pow(mask, 1.4);
      } else if (uMode == 15) {
        // PLASMA AURORA — flowing curtains. uPatScale tunes the band frequency,
        // uPatDetail mixes more octaves for intricacy, uPatSeed shifts the
        // pattern for a randomized look.
        float scl = 0.6 + uPatScale * 1.4;
        vec2 q = (uv * 2.0 - 1.0) * scl + vec2(uPatSeed * 0.21, -uPatSeed * 0.13);
        float band = sin(q.x * 4.0 + sin(q.y * 2.5 + t * 0.22) * 1.5 + t * 0.13);
        band += sin(q.x * 7.0 - q.y * 3.0 + t * 0.18) * 0.5;
        band += sin(length(q) * 6.0 - t * 0.15) * 0.3;
        // Detail injects higher-frequency overtones.
        band += sin(q.x * 14.0 + q.y * 9.0 - t * 0.25) * 0.35 * clamp(uPatDetail, 0.0, 1.0);
        band += cos(q.y * 18.0 + t * 0.20) * 0.25 * clamp(uPatDetail, 0.0, 1.0);
        band = band * 0.5 + 0.5;
        float intensity = pow(band, mix(1.4, 3.0, clamp(uPatSharp, 0.0, 1.0)));
        vec3 a = vec3(0.45, 0.30, 0.55);
        vec3 b = vec3(0.55, 0.50, 0.45);
        vec3 c = vec3(1.0, 1.1, 0.9);
        vec3 d = vec3(0.10, 0.20, 0.30);
        col = iqPalette(intensity + uHueShift + t * 0.04, a, b, c, d) * intensity;
      } else if (uMode == 16) {
        // BUBBLE FLOW — voronoi cells. uPatScale = bubble density, uPatDetail
        // adds a sub-bubble micro-structure, uPatSeed shifts the cell pattern,
        // uPatSharp narrows the bright cores into harder edges.
        float scl = 2.0 + uPatScale * 4.0;
        vec2 q = uv * scl + vec2(uPatSeed * 1.3, uPatSeed * 0.7);
        vec2 ip = floor(q);
        vec2 fp = fract(q);
        float minD1 = 8.0;
        float minD2 = 8.0;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 cell = ip + vec2(float(i), float(j));
            vec2 offset = vec2(hash(cell), hash(cell + 17.0));
            offset = 0.5 + 0.45 * sin(t * 0.25 + 6.2832 * offset);
            float dist = length(vec2(float(i), float(j)) + offset - fp);
            if (dist < minD1) { minD2 = minD1; minD1 = dist; }
            else if (dist < minD2) { minD2 = dist; }
          }
        }
        float coreEdge = mix(0.55, 0.30, clamp(uPatSharp, 0.0, 1.0));
        float core = smoothstep(coreEdge, 0.05, minD1);
        float seam = smoothstep(0.0, 0.04, minD2 - minD1);
        // Detail: sub-pattern multiplied in for richer bubble interiors.
        float micro = mix(1.0, 0.5 + 0.5 * sin(minD1 * 26.0 + t * 0.4), clamp(uPatDetail, 0.0, 1.0) * 0.8);
        vec3 a = vec3(0.5, 0.4, 0.6);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.30, 0.50, 0.80);
        vec3 fill = iqPalette(minD1 * 1.5 + uHueShift + t * 0.03, a, b, c, d);
        col = fill * core * seam * micro;
      } else if (uMode == 17) {
        // LIQUID MERCURY — multi-layer FBM. uPatScale = pattern scale,
        // uPatDetail = layer count, uPatSeed = field offset for randomization.
        float scl = 0.8 + uPatScale * 1.5;
        vec2 q = (uv * 1.5 - 0.75) * scl + vec2(uPatSeed * 0.41, uPatSeed * 0.27);
        float n1 = fbm(q * 1.5 + vec2(t * 0.04, t * 0.025));
        float n2 = fbm(q * 4.0 + vec2(-t * 0.03, t * 0.05) + n1 * 0.7);
        float n3 = fbm(q * 9.0 + n2 * 1.5);
        // Detail: extra octave at very high detail for crystalline crispness.
        float n4 = fbm(q * 18.0 + n3 * 0.5) * clamp(uPatDetail, 0.0, 1.0);
        float v = n1 * 0.55 + n2 * 0.30 + n3 * 0.15 + n4 * 0.20;
        float liftLo = mix(0.40, 0.20, clamp(uPatSharp, 0.0, 1.0));
        float liftHi = mix(0.92, 0.78, clamp(uPatSharp, 0.0, 1.0));
        float lit = smoothstep(liftLo, liftHi, v);
        vec3 base = vec3(0.65, 0.72, 0.88) * lit * 1.5;
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 0.9, 1.1);
        vec3 d = vec3(0.0, 0.20, 0.50);
        vec3 sheen = iqPalette(v * 1.5 + uHueShift + t * 0.025, a, b, c, d);
        col = mix(base, base * sheen * 1.7, 0.6);
      } else if (uMode == 18) {
        // CAUSTICS. uPatScale = pattern scale, uPatDetail = warp depth,
        // uPatSharp = ridge crispness, uPatSeed = field offset.
        float scl = 1.5 + uPatScale * 2.5;
        vec2 p = uv * scl + vec2(uPatSeed * 0.51, -uPatSeed * 0.29);
        float ts = t * 0.08;  // in-shader time multiplier for caustics — slow / meditative
        vec2 q = vec2(fbm(p + vec2(0.0, ts)), fbm(p + vec2(5.2, -ts)));
        vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + ts * 0.5),
                      fbm(p + 4.0 * q + vec2(8.3, 2.8) - ts * 0.5));
        // Detail: deeper warp stages for more curling complexity.
        vec2 r2 = vec2(fbm(p + 6.0 * r + vec2(2.0, 5.5)), fbm(p + 6.0 * r + vec2(11.0, 1.0)));
        vec2 rF = mix(r, r2, clamp(uPatDetail, 0.0, 1.0));
        float f = fbm(p + 4.0 * rF);
        float ridgePow = mix(3.0, 10.0, clamp(uPatSharp, 0.0, 1.0));
        float ridge = pow(1.0 - abs(f - 0.5) * 2.0, ridgePow);
        vec3 a = vec3(0.5, 0.55, 0.6);
        vec3 b = vec3(0.5, 0.45, 0.4);
        vec3 c = vec3(1.0, 1.0, 0.9);
        vec3 d = vec3(0.45, 0.20, 0.10);
        vec3 base = iqPalette(f * 0.6 + uHueShift + ts * 0.05, a, b, c, d);
        col = base * ridge * 1.8;
      } else if (uMode == 19) {
        // WARPED GRID — orthogonal grid lines bent gently by a slow domain-
        // warping noise field. Lines stay razor-sharp; their positions flow.
        // High contrast, very slow, "bulgy" silk-grid look. uPgLineWidth controls
        // line thickness, uPgFlow / panel speed slider control drift rate.
        vec2 q = uv * 2.0 - 1.0;
        float ts = t * 0.015;  // very slow base flow — barely-perceptible silk drift
        float wx = fbm(q * 0.55 + vec2(ts, 0.0)) - 0.5;
        float wy = fbm(q * 0.55 + vec2(0.0, ts + 5.2)) - 0.5;
        vec2 warpedUv = uv + vec2(wx, wy) * 0.22;
        vec2 cell = warpedUv * uScale + vec2(uTime * uPgFlow, uTime * uPgFlow * 0.7);
        vec2 fc = abs(fract(cell) - 0.5);
        float aaX = fwidth(fc.x);
        float aaY = fwidth(fc.y);
        float lw = clamp(uPgLineWidth * 1.5 + 0.02, 0.005, 0.49);
        float lineX = 1.0 - smoothstep(0.5 - lw - aaX, 0.5 - lw + aaX, fc.x);
        float lineY = 1.0 - smoothstep(0.5 - lw - aaY, 0.5 - lw + aaY, fc.y);
        float v = max(lineX, lineY);
        col = vec3(v);
      } else if (uMode == 20) {
        // WAVEFIELD GRID — orthogonal grid bent by a slow sinusoidal field.
        // More periodic / undulating than the FBM-warped version, reads like
        // graph paper on a flag in still air. Hard lines, slow ocean-roll motion.
        float ts = t * 0.08;
        float dispX = sin(uv.y * 4.0 + ts) * 0.06 + sin(uv.y * 11.0 - ts * 0.5) * 0.025;
        float dispY = cos(uv.x * 5.5 - ts * 0.7) * 0.05 + cos(uv.x * 13.0 + ts * 0.4) * 0.020;
        vec2 cell = (uv + vec2(dispX, dispY)) * uScale + vec2(uTime * uPgFlow * 0.5, 0.0);
        vec2 fc = abs(fract(cell) - 0.5);
        float aaX = fwidth(fc.x), aaY = fwidth(fc.y);
        float lw = clamp(uPgLineWidth * 1.5 + 0.02, 0.005, 0.49);
        float lineX = 1.0 - smoothstep(0.5 - lw - aaX, 0.5 - lw + aaX, fc.x);
        float lineY = 1.0 - smoothstep(0.5 - lw - aaY, 0.5 - lw + aaY, fc.y);
        col = vec3(max(lineX, lineY));
      } else if (uMode == 21) {
        // DIAMOND BANDS — Chebyshev rings, slowly rotating. uPatScale tunes
        // ring density, uPatSharp narrows bright rings into harder edges,
        // uPatDistort blends toward circular rings.
        vec2 c = (uv - 0.5) * 2.0;
        float a = t * 0.025;
        float ca = cos(a), sa = sin(a);
        vec2 r = vec2(c.x * ca - c.y * sa, c.x * sa + c.y * ca);
        float dSq = max(abs(r.x), abs(r.y));
        float dCr = length(r);
        float d = mix(dSq, dCr, clamp(uPatDistort, 0.0, 1.0));
        float freqMul = 0.5 + uPatScale * 1.5;
        float bands = sin(d * uScale * 1.2 * freqMul - t * 0.4);
        float aa = fwidth(bands);
        // Sharp narrows the lit band; soft makes it broader.
        float band = mix(aa * 4.0, aa * 0.5, clamp(uPatSharp, 0.0, 1.0));
        float v = smoothstep(-band, band, bands);
        col = vec3(v);
      }
      return col;
    }

    void main() {
      float t = uTime * uSpeed;
      vec3 col;
      if (uPanelSmooth == 1) {
        // 4-tap sub-pixel AA: sample the panel at ±0.25 screen-pixel offsets
        // and average. Kills cell-boundary aliasing / moiré / scan-line effects
        // when the panel is viewed at a distance or at a steep angle.
        vec2 dx = dFdx(vUv) * 0.25;
        vec2 dy = dFdy(vUv) * 0.25;
        col = 0.25 * (
          computeLedColor(vUv - dx - dy, t) +
          computeLedColor(vUv + dx - dy, t) +
          computeLedColor(vUv - dx + dy, t) +
          computeLedColor(vUv + dx + dy, t)
        );
      } else {
        col = computeLedColor(vUv, t);
      }
      // Panel-side contrast — pivots around 0.5 so blacks deepen and highlights
      // brighten symmetrically. Applied BEFORE brightness so the contrast knob
      // is independent of overall panel intensity.
      if (uPanelContrast != 1.0) {
        col = (col - 0.5) * uPanelContrast + 0.5;
      }
      if (uPanelSat != 1.0) {
        float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(vec3(lum), col, uPanelSat);
      }
      col *= uBrightness;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};

// ── Wall material — procedural gallery surface textures ───────────────────
// All presets are achromatic grays; the variation is entirely in surface
// roughness and micro-texture so the gallery lights reveal wall character
// without competing with the acrylic lens.
const _wallTexCache = {};

function makeWallTexture(preset) {
  const SIZE = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(SIZE, SIZE);
  const d = imgData.data;

  // Seeded value-noise at a given grid resolution — returns a sample(x,y) fn.
  // The grid uses modular (periodic) indexing so the noise wraps seamlessly at
  // texture tile boundaries — eliminates all visible seam lines.
  const rng = mulberry32(preset.split('').reduce((a, c, i) => a + c.charCodeAt(0) * (i + 1), 7));
  function makeNoise(res) {
    const g = new Float32Array(res * res);
    for (let i = 0; i < g.length; i++) g[i] = rng();
    // Periodic look-up — wraps grid coordinates modulo res
    const at = (xi, yi) => g[((yi % res + res) % res) * res + ((xi % res + res) % res)];
    return (x, y) => {
      const gx = x * res / SIZE, gy = y * res / SIZE;
      const ix = gx | 0, iy = gy | 0;
      const fx = gx - ix, fy = gy - iy;
      const a = at(ix,   iy  );
      const b = at(ix+1, iy  );
      const c = at(ix,   iy+1);
      const e = at(ix+1, iy+1);
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      return a + (b-a)*sx + (c-a)*sy + (a-b-c+e)*sx*sy;
    };
  }

  // Per-preset config:
  //   base — base gray level (0–255)
  //   n    — [[gridRes, amplitude], ...] noise octaves
  //   bandsY / bandsX — sinusoidal banding amplitude (formwork / blockwork)
  //   sweep / wash — directional smear patterns
  const CFG = {
    concrete: { base: 0x84, n: [[5,22],[20,8],[80,3]],   bandsY: 6,  bandsX: 0 },
    plaster:  { base: 0xb2, n: [[4,7], [14,4],[56,2]],   sweep: 8              },
    polished: { base: 0x9c, n: [[6,9], [28,4],[110,2]],  bandsX: 0             },
    cement:   { base: 0x70, n: [[5,26],[18,9],[60,4]],   bandsX: 4             },
    limewash: { base: 0xbc, n: [[3,12],[8,8], [30,3]],   wash: 12              },
  };
  const cfg = CFG[preset] || CFG.concrete;
  const noises = cfg.n.map(([res]) => makeNoise(res));

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      let v = cfg.base;
      for (let ni = 0; ni < noises.length; ni++) {
        v += (noises[ni](x, y) - 0.5) * cfg.n[ni][1] * 2;
      }
      if (cfg.bandsY) v += Math.sin(y * Math.PI * 2 / (SIZE / cfg.bandsY)) * 5;
      if (cfg.bandsX) v += Math.sin(x * Math.PI * 2 / (SIZE / cfg.bandsX)) * 4;
      // sweep / wash: frequencies chosen so exactly N full cycles fit in SIZE
      // pixels in every direction — guarantees seamless tiling with no edge lines.
      if (cfg.sweep)  v += Math.sin((x + 2 * y) * Math.PI * 2 / SIZE) * cfg.sweep;
      if (cfg.wash)   v += Math.sin((x + y)     * Math.PI * 2 / SIZE) * cfg.wash;
      const i = (y * SIZE + x) * 4;
      d[i] = d[i+1] = d[i+2] = Math.max(0, Math.min(255, Math.round(v)));
      d[i+3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.needsUpdate = true;
  return tex;
}

const WALL_ROUGH    = { none:1.0, concrete:0.88, plaster:0.75, polished:0.35, cement:0.92, limewash:0.85 };
const WALL_METAL    = { none:0,   concrete:0,    plaster:0,    polished:0.04, cement:0,    limewash:0    };

function applyWallMaterial(preset) {
  if (!backdrop) return;
  if (preset && preset !== 'none') {
    if (!_wallTexCache[preset]) _wallTexCache[preset] = makeWallTexture(preset);
    const tex = _wallTexCache[preset];
    const scale  = state.wallScale ?? 8;
    const bright = state.wallBrightness ?? 1.0;
    tex.repeat.set(scale, scale);
    tex.needsUpdate = true;
    backdrop.material = new THREE.MeshStandardMaterial({
      color:        new THREE.Color(bright, bright, bright),
      map:          tex,
      roughnessMap: tex,
      roughness:    WALL_ROUGH[preset] ?? 0.88,
      metalness:    WALL_METAL[preset] ?? 0,
    });
  } else {
    // Flat unlit background — original behaviour
    backdrop.material = new THREE.MeshBasicMaterial({
      color: new THREE.Color(state.bgColor),
    });
  }
  backdrop.material.needsUpdate = true;
}

// Live-update wall brightness and grain scale without recreating the material.
function applyWallAdjust() {
  if (!backdrop?.material || !state.wallMaterial || state.wallMaterial === 'none') return;
  const bright = state.wallBrightness ?? 1.0;
  backdrop.material.color.setScalar(bright);
  const tex = _wallTexCache[state.wallMaterial];
  if (tex) {
    const s = state.wallScale ?? 8;
    tex.repeat.set(s, s);
    tex.needsUpdate = true;
  }
}

// Keep the backdrop flush with the back face of the deepest casing so the
// sculpture always reads as wall-mounted. Call whenever thickness or
// panelDistance changes.
function syncBackdropZ() {
  if (!backdrop) return;
  const deepest = Math.max(state.thickness || 15, state.thicknessB || state.thickness || 15);
  backdrop.position.z = -(deepest + (state.panelDistance || 30) + 30) - 2;
}

// -------------------------------------------------------------------------
// PRNG
// -------------------------------------------------------------------------
function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// -------------------------------------------------------------------------
// Logo mask — loaded from an uploaded image/SVG, sampled by the logo lens
// -------------------------------------------------------------------------
let logoImageData = null;
let logoName = '';

function rasteriseLogo(img, size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // keep transparent background; alpha channel distinguishes logo from background
  const aspect = img.width / img.height;
  let w, h;
  if (aspect >= 1) { w = size * 0.9; h = w / aspect; }
  else            { h = size * 0.9; w = h * aspect; }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
  return ctx.getImageData(0, 0, size, size);
}

function loadLogoFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    logoImageData = rasteriseLogo(img);
    logoName = file.name;
    URL.revokeObjectURL(url);
    if (state.lensType === 'logo' || state.lensTypeB === 'logo') rebuildLenses();
    setStatus(`logo loaded: ${file.name}`);
  };
  img.onerror = () => { setStatus(`logo load failed: ${file.name}`); URL.revokeObjectURL(url); };
  img.src = url;
}

function loadLogoUrl(url, name, onReady) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    logoImageData = rasteriseLogo(img);
    logoName = name || url;
    if (state.lensType === 'logo' || state.lensTypeB === 'logo') rebuildLenses();
    setStatus(`logo loaded: ${logoName}`);
    if (onReady) onReady();
  };
  img.onerror = () => setStatus(`logo load failed: ${name || url}`);
  img.src = url;
}

// -------------------------------------------------------------------------
// Lens types
// -------------------------------------------------------------------------
const LENS_TYPES = {
  ripple_field: {
    label: 'Ripple Field',
    params: {
      wavelength: { value: 70, min: 20, max: 200, step: 1 },
      amplitude:  { value: 8,  min: 0,  max: 100, step: 0.5 },
    },
    // Constant-amplitude concentric ripples covering the FULL panel rectangle,
    // fading smoothly to flat in a margin near each edge. (Earlier this used a
    // circular inscribed-circle mask which left flat corners on the lens — at
    // angled camera views, light went through those flat corners un-refracted
    // and you'd see the panel raw, reading as a glitch in the bottom of frame.)
    fn: (p, W, H) => {
      const TAU = Math.PI * 2;
      const halfW = W * 0.5, halfH = H * 0.5;
      const margin = Math.min(W, H) * 0.18;  // last 18% of each edge fades to flat
      return (x, y) => {
        const dx = halfW - Math.abs(x);
        const dy = halfH - Math.abs(y);
        const d = Math.min(dx, dy);
        if (d <= 0) return 0;
        const env = d >= margin ? 1 : 0.5 * (1 - Math.cos(Math.PI * (d / margin)));
        const r = Math.hypot(x, y);
        const wave = 0.5 * (1 + Math.cos(TAU * r / p.wavelength));
        return p.amplitude * wave * env;
      };
    },
  },
  stepped_ripple: {
    label: 'Stepped Ripple',
    params: {
      wavelength: { value: 42,   min: 20,   max: 200, step: 1 },
      amplitude:  { value: 100,  min: 0,    max: 200, step: 1, label: 'central peak (mm)' },
      step:       { value: 10,   min: 0,    max: 60,  step: 0.5, label: 'drop per ripple (mm)' },
      // edgeFade: ratio of the panel's short side that fades to flat at the
      // rim. 0 = ripples run all the way to the edge (sharp termination, may
      // look harsh and create un-refracted slivers if the wave isn't at zero).
      // 0.5 = the middle of the panel is flat-zero except for a brief peak.
      // Lower this to make the ripples WIDER / cover more of the slab.
      edgeFade:   { value: 0.18, min: 0.0,  max: 0.5, step: 0.005, label: 'edge fade (0=widest)' },
      // bumpSharp: 0..1 slider mapped to a dramatic shape transform.
      //   0.0 = flat-topped ridges with steep walls (like rounded square wave)
      //   0.5 = default cosine (smooth sinusoidal bumps)
      //   1.0 = sharp narrow spikes with broad flat troughs
      // Implemented as a smoothstep contrast on the wave, which gives a clearly
      // visible transformation across the whole slider range.
      bumpSharp:  { value: 0.5,  min: 0.0,  max: 1.0, step: 0.01, label: 'bump shape' },
    },
    // Stepped concentric ripples covering the full panel rectangle. Ripples now
    // cover the whole slab, fading smoothly to flat in a controllable margin
    // near each panel edge.
    fn: (p, W, H) => {
      const TAU = Math.PI * 2;
      const halfW = W * 0.5, halfH = H * 0.5;
      const wl   = Math.max(1, p.wavelength);
      const amp  = p.amplitude;
      const step = p.step != null ? p.step : 10;
      const fadeRatio = p.edgeFade != null ? p.edgeFade : 0.18;
      const sharp = p.bumpSharp != null ? p.bumpSharp : 0.5;
      const margin = Math.max(0.0001, Math.min(W, H) * fadeRatio);
      // Map slider 0..1 to a clearly-visible bump shape transform:
      //   0.0 = wide flat plateaus (rounded-square wave)
      //   0.5 = pass-through cosine
      //   1.0 = sharp narrow spikes with flat troughs
      // Uses symmetric pow-based reshape: plateau side is `1 - (1-v)^n`,
      // spike side is `v^n`, with n growing from 1 → 5 as the slider moves
      // away from the centre. Test value at mid-slope (v=0.5):
      //   sharp 0.0 → 0.97   sharp 0.5 → 0.50   sharp 1.0 → 0.03
      // ~32× dynamic range, so any slider movement produces an obvious change.
      const reshape = (v) => {
        if (sharp === 0.5) return v;
        if (sharp > 0.5) {
          const n = 1 + (sharp - 0.5) * 8;
          return Math.pow(v, n);
        }
        const n = 1 + (0.5 - sharp) * 8;
        return 1 - Math.pow(1 - v, n);
      };
      return (x, y) => {
        const dx = halfW - Math.abs(x);
        const dy = halfH - Math.abs(y);
        const d = Math.min(dx, dy);
        if (d <= 0) return 0;
        const env = d >= margin ? 1 : 0.5 * (1 - Math.cos(Math.PI * (d / margin)));
        const r = Math.hypot(x, y);
        const ampLocal = Math.max(0, amp - step * (r / wl));
        const waveRaw = 0.5 * (1 + Math.cos(TAU * r / wl));
        const wave = reshape(waveRaw);
        return ampLocal * wave * env;
      };
    },
  },
  torus_field: {
    label: 'Torus Field',
    params: {
      cols:          { value: 3,  min: 1, max: 8, step: 1 },
      rows:          { value: 3,  min: 1, max: 8, step: 1 },
      torus_outer_r: { value: 50, min: 10, max: 120, step: 1 },
      torus_inner_r: { value: 18, min: 1,  max: 80,  step: 1 },
      torus_height:  { value: 14, min: 1,  max: 40,  step: 0.5 },
    },
    fn: (p, W, H) => {
      const cx = [], cy = [];
      for (let i = 0; i < p.cols; i++) cx.push(-W/2 + (i + 1) * W/(p.cols + 1));
      for (let j = 0; j < p.rows; j++) cy.push(-H/2 + (j + 1) * H/(p.rows + 1));
      const midR = (p.torus_outer_r + p.torus_inner_r) / 2;
      const wallR = Math.max(0.1, (p.torus_outer_r - p.torus_inner_r) / 2);
      return (x, y) => {
        let z = 0;
        for (const a of cx) for (const b of cy) {
          const r = Math.hypot(x - a, y - b);
          const diff = r - midR;
          const inside = wallR * wallR - diff * diff;
          if (inside > 0) {
            const h = p.torus_height * Math.sqrt(inside) / wallR;
            if (h > z) z = h;
          }
        }
        return z;
      };
    },
  },
  hex_cells: {
    label: 'Hex Cells',
    params: {
      cell_size:  { value: 40, min: 10, max: 120, step: 1 },
      cell_depth: { value: 6,  min: 0,  max: 30,  step: 0.5 },
      invert:     { value: false },
    },
    fn: (p, W, H) => {
      const dx = p.cell_size * 1.5;
      const dy = p.cell_size * Math.sqrt(3);
      const radius = p.cell_size * 0.85;
      const ncols = Math.ceil(W / dx) + 2;
      const nrows = Math.ceil(H / dy) + 2;
      const centres = [];
      for (let row = -nrows; row <= nrows; row++) {
        for (let col = -ncols; col <= ncols; col++) {
          const ax = col * dx;
          const ay = row * dy + (col % 2 ? dy / 2 : 0);
          centres.push([ax, ay]);
        }
      }
      return (x, y) => {
        let z = p.cell_depth;
        for (const [a, b] of centres) {
          const r = Math.hypot(x - a, y - b);
          if (r < radius) {
            const bowl = 0.5 * (1 - Math.cos(Math.PI * r / radius)) * p.cell_depth;
            if (bowl < z) z = bowl;
          }
        }
        return p.invert ? (p.cell_depth - z) : z;
      };
    },
  },
  organic_bulbs: {
    label: 'Organic Bulbs',
    params: {
      n_bulbs: { value: 24, min: 1,  max: 80, step: 1 },
      seed:    { value: 7,  min: 0,  max: 999, step: 1 },
      min_r:   { value: 30, min: 10, max: 120, step: 1 },
      max_r:   { value: 75, min: 20, max: 200, step: 1 },
      min_h:   { value: 8,  min: 0,  max: 30,  step: 0.5 },
      max_h:   { value: 22, min: 1,  max: 50,  step: 0.5 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const margin = Math.max(p.min_r, p.max_r);
      const bulbs = [];
      for (let i = 0; i < p.n_bulbs; i++) {
        const cx = rng() * (W - 2 * margin) - (W/2 - margin);
        const cy = rng() * (H - 2 * margin) - (H/2 - margin);
        const radius = p.min_r + rng() * Math.max(0, p.max_r - p.min_r);
        const hpk = p.min_h + rng() * Math.max(0, p.max_h - p.min_h);
        bulbs.push([cx, cy, radius, hpk]);
      }
      return (x, y) => {
        let z = 0;
        for (const [cx, cy, radius, hpk] of bulbs) {
          const r = Math.hypot(x - cx, y - cy);
          if (r < radius) {
            const h = hpk * 0.5 * (1 + Math.cos(Math.PI * r / radius));
            if (h > z) z = h;
          }
        }
        return z;
      };
    },
  },
  pyramid_grid: {
    label: 'Pyramid Grid (v1 homage)',
    params: {
      cols:      { value: 8,  min: 1,  max: 24, step: 1 },
      rows:      { value: 8,  min: 1,  max: 24, step: 1 },
      pyramid_h: { value: 20, min: 1,  max: 60, step: 0.5 },
    },
    fn: (p, W, H) => {
      const cellW = W / p.cols;
      const cellH = H / p.rows;
      return (x, y) => {
        const u = (((x + W/2) % cellW) + cellW) % cellW / cellW - 0.5;
        const v = (((y + H/2) % cellH) + cellH) % cellH / cellH - 0.5;
        const d = Math.max(Math.abs(u), Math.abs(v)) * 2;
        return Math.max(0, Math.min(p.pyramid_h, p.pyramid_h * (1 - d)));
      };
    },
  },
  dome: {
    label: 'Single Dome',
    params: {
      radius: { value: 280, min: 50, max: 600, step: 1 },
      height: { value: 40,  min: 1,  max: 120, step: 1 },
    },
    // Spherical cap: section of a sphere with footprint radius `radius` and
    // central height `height`. Uniformly convex (no inflection, no flared rim),
    // so the apex reads as a clean outward bulge from any angle. The earlier
    // cosine-bump profile had an inflection at r=R/2 that showed up as a
    // central ripple/dimple under refraction.
    fn: (p) => {
      const R = p.radius;
      const h = Math.max(0.0001, p.height);
      const Rs = (R * R + h * h) / (2 * h);  // sphere radius from chord & sagitta
      const cz = h - Rs;                      // sphere centre on the z-axis
      return (x, y) => {
        const r2 = x * x + y * y;
        if (r2 >= R * R) return 0;
        return cz + Math.sqrt(Rs * Rs - r2);
      };
    },
  },
  morph_rings: {
    label: 'Morph Rings (square ↔ circle)',
    params: {
      wavelength:   { value: 40,  min: 10, max: 200, step: 1 },
      amplitude:    { value: 12,  min: 0,  max: 200, step: 0.5, label: 'bump height (mm)' },
      morph_period: { value: 2,   min: 1,  max: 8,   step: 1 },
      bias:         { value: 0.5, min: 0,  max: 1,   step: 0.02 },
      phase_shift:  { value: 0,   min: 0,  max: 1,   step: 0.01 },
    },
    fn: (p, W, H) => {
      const TAU = Math.PI * 2;
      const maxD = Math.min(W, H) * 0.5;
      const period = Math.max(1, p.morph_period);
      return (x, y) => {
        const ax = Math.abs(x), ay = Math.abs(y);
        const dSq = Math.max(ax, ay);       // Chebyshev — square
        const dCr = Math.hypot(x, y);        // Euclidean — circle
        const dMid = 0.5 * (dSq + dCr);
        // Morph oscillator: 0 → 1 → 0 once per cycle. Starts at 0 (square) near centre.
        const cycleLen = p.wavelength * period;
        const osc = 0.5 - 0.5 * Math.cos(TAU * dMid / cycleLen);
        // Bias slides the midpoint toward more-square (0) or more-circle (1).
        // bias=0.5 keeps the pure oscillation; higher = circlier; lower = squarer.
        const w = Math.min(1, Math.max(0, osc + (p.bias - 0.5)));
        const d = dSq * (1 - w) + dCr * w;
        if (d >= maxD) return 0;
        // Soft radial fall-off so edges taper gracefully
        const fade = 0.5 * (1 + Math.cos(Math.PI * d / maxD));
        // Concentric ridges along the morphed distance
        const ridge = 0.5 * (1 + Math.sin(TAU * (d / p.wavelength + p.phase_shift)));
        return p.amplitude * ridge * fade;
      };
    },
  },
  interlocking_teardrops: {
    label: 'Interlocking Teardrops',
    params: {
      cols:         { value: 4,  min: 1,  max: 10,  step: 1 },
      rows:         { value: 4,  min: 1,  max: 10,  step: 1 },
      size:         { value: 70, min: 20, max: 200, step: 1 },
      height:       { value: 16, min: 1,  max: 40,  step: 0.5 },
      asymmetry:    { value: 0.5, min: 0.0, max: 0.9, step: 0.05 },
      rot_variance: { value: 0.8, min: 0,   max: 1,   step: 0.05 },
      jitter:       { value: 0.3, min: 0,   max: 0.6, step: 0.05 },
      seed:         { value: 3,  min: 0,   max: 999, step: 1 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const dxC = W / p.cols;
      const dyC = H / p.rows;
      const drops = [];
      for (let i = 0; i < p.cols; i++) {
        for (let j = 0; j < p.rows; j++) {
          const cx = -W/2 + (i + 0.5) * dxC + (rng() - 0.5) * dxC * p.jitter;
          const cy = -H/2 + (j + 0.5) * dyC + (rng() - 0.5) * dyC * p.jitter;
          const angle = rng() * Math.PI * 2 * p.rot_variance;
          drops.push([cx, cy, Math.cos(angle), Math.sin(angle)]);
        }
      }
      return (x, y) => {
        let z = 0;
        for (const [cx, cy, ca, sa] of drops) {
          const ex = x - cx, ey = y - cy;
          const lx = ex * ca + ey * sa;
          const ly = -ex * sa + ey * ca;
          const r = Math.hypot(lx, ly);
          if (r > p.size) continue;
          const theta = Math.atan2(ly, lx);
          const rMax = p.size * (1 + p.asymmetry * Math.cos(theta));
          if (r >= rMax) continue;
          const t = r / rMax;
          const v = p.height * 0.5 * (1 + Math.cos(Math.PI * t));
          if (v > z) z = v;
        }
        return z;
      };
    },
  },
  wave_lattice: {
    label: 'Wave Lattice',
    params: {
      wavelength_x: { value: 80, min: 20, max: 300, step: 1 },
      wavelength_y: { value: 80, min: 20, max: 300, step: 1 },
      amplitude:    { value: 10, min: 0,  max: 100,  step: 0.5 },
      diagonal_mix: { value: 0.0, min: 0, max: 1,   step: 0.05 },
      rotation:     { value: 0,  min: 0,  max: 90,  step: 1 },
    },
    fn: (p) => {
      const rad = p.rotation * Math.PI / 180;
      const ca = Math.cos(rad), sa = Math.sin(rad);
      const avg = (p.wavelength_x + p.wavelength_y) / 2;
      return (x, y) => {
        const rx = x * ca + y * sa;
        const ry = -x * sa + y * ca;
        const wx = Math.sin(2 * Math.PI * rx / p.wavelength_x);
        const wy = Math.sin(2 * Math.PI * ry / p.wavelength_y);
        const d1 = Math.sin(2 * Math.PI * (rx + ry) / avg);
        const d2 = Math.sin(2 * Math.PI * (rx - ry) / avg);
        const val = (wx + wy) * (1 - p.diagonal_mix) + (d1 + d2) * p.diagonal_mix;
        return p.amplitude * 0.25 * (2 + val);
      };
    },
  },
  logo: {
    label: 'Custom Logo',
    params: {
      height:  { value: 30, min: 1,  max: 80,  step: 0.5 },
      falloff: { value: 0.15, min: 0, max: 0.5, step: 0.01 },
      invert:  { value: false },
      threshold: { value: 0.5, min: 0.0, max: 1.0, step: 0.01 },
    },
    fn: (p, W, H) => {
      const data = logoImageData;
      if (!data) return () => 0;
      const dw = data.width, dh = data.height;
      const buf = data.data;
      return (x, y) => {
        const u = (x + W / 2) / W;
        const v = 1 - (y + H / 2) / H;
        if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
        const px = Math.min(dw - 1, Math.max(0, Math.floor(u * dw)));
        const py = Math.min(dh - 1, Math.max(0, Math.floor(v * dh)));
        const idx = (py * dw + px) * 4;
        const alpha = buf[idx + 3] / 255;
        const lum   = (buf[idx] + buf[idx + 1] + buf[idx + 2]) / (3 * 255);
        // mask = "is this a logo pixel?" — handles transparent-bg SVGs and opaque light-bg PNGs
        const raw = p.invert ? lum : (1 - lum);
        let t = alpha * raw + (1 - alpha) * (p.invert ? 1 : 0);
        const soft = Math.max(0.001, p.falloff);
        t = Math.min(1, Math.max(0, (t - p.threshold + soft) / (2 * soft)));
        const shaped = 0.5 * (1 - Math.cos(Math.PI * t));
        return shaped * p.height;
      };
    },
  },
  voronoi_bulbs: {
    label: 'Voronoi Bulbs',
    params: {
      n_seeds: { value: 20, min: 3, max: 80,  step: 1 },
      seed:    { value: 5,  min: 0, max: 999, step: 1 },
      height:  { value: 18, min: 1, max: 50,  step: 0.5 },
      fill:    { value: 0.85, min: 0.2, max: 1.0, step: 0.02 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const margin = 20;
      const seeds = [];
      for (let i = 0; i < p.n_seeds; i++) {
        seeds.push([
          rng() * (W - 2 * margin) - (W/2 - margin),
          rng() * (H - 2 * margin) - (H/2 - margin),
        ]);
      }
      return (x, y) => {
        let d1 = Infinity, d2 = Infinity;
        for (const [sx, sy] of seeds) {
          const d = Math.hypot(x - sx, y - sy);
          if (d < d1) { d2 = d1; d1 = d; }
          else if (d < d2) { d2 = d; }
        }
        const rCell = (d1 + d2) * 0.5 * p.fill;
        if (d1 > rCell) return 0;
        const t = d1 / rCell;
        return p.height * 0.5 * (1 + Math.cos(Math.PI * t));
      };
    },
  },
};

// Geometry
// -------------------------------------------------------------------------
function makeLensGeometry(heightFn, width, height, resolution, thickness, smoothing = 0) {
  const nx = Math.max(4, Math.floor(width / resolution) + 1);
  const ny = Math.max(4, Math.floor(height / resolution) + 1);

  // Pre-sample the height field into a grid so we can blur it before emitting vertices.
  const grid = new Float32Array(nx * ny);
  for (let i = 0; i < ny; i++) {
    const y = -height/2 + (i / (ny - 1)) * height;
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      grid[i * nx + j] = heightFn(x, y);
    }
  }
  // Separable box-blur passes for cheap surface smoothing. Each pass is ~O(nx·ny).
  const passes = Math.max(0, smoothing | 0);
  if (passes > 0) {
    const tmp = new Float32Array(nx * ny);
    for (let p = 0; p < passes; p++) {
      // Horizontal
      for (let i = 0; i < ny; i++) {
        const row = i * nx;
        for (let j = 0; j < nx; j++) {
          const l = j > 0 ? grid[row + j - 1] : grid[row + j];
          const c = grid[row + j];
          const r = j < nx - 1 ? grid[row + j + 1] : grid[row + j];
          tmp[row + j] = (l + c + c + r) * 0.25;
        }
      }
      // Vertical
      for (let j = 0; j < nx; j++) {
        for (let i = 0; i < ny; i++) {
          const u = i > 0 ? tmp[(i - 1) * nx + j] : tmp[i * nx + j];
          const c = tmp[i * nx + j];
          const d = i < ny - 1 ? tmp[(i + 1) * nx + j] : tmp[i * nx + j];
          grid[i * nx + j] = (u + c + c + d) * 0.25;
        }
      }
    }
  }

  const verts = [];
  const indices = [];
  const vert = (x, y, z) => { const id = verts.length / 3; verts.push(x, y, z); return id; };

  const topIds = [], botIds = [];
  for (let i = 0; i < ny; i++) {
    const y = -height/2 + (i / (ny - 1)) * height;
    const rowT = [], rowB = [];
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      rowT.push(vert(x, y, grid[i * nx + j]));
    }
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      rowB.push(vert(x, y, -thickness));
    }
    topIds.push(rowT); botIds.push(rowB);
  }

  // Sculpted top face
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = topIds[i][j], b = topIds[i][j+1], c = topIds[i+1][j+1], d = topIds[i+1][j];
    indices.push(a, b, c, a, c, d);
  }
  // Flat bottom face (reverse winding)
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = botIds[i][j], b = botIds[i][j+1], c = botIds[i+1][j+1], d = botIds[i+1][j];
    indices.push(a, c, b, a, d, c);
  }
  // Perimeter walls
  for (let j = 0; j < nx - 1; j++) {
    const t1 = topIds[0][j], t2 = topIds[0][j+1], b1 = botIds[0][j], b2 = botIds[0][j+1];
    indices.push(t1, b1, b2, t1, b2, t2);
    const ut1 = topIds[ny-1][j], ut2 = topIds[ny-1][j+1], ub1 = botIds[ny-1][j], ub2 = botIds[ny-1][j+1];
    indices.push(ut1, ub2, ub1, ut1, ut2, ub2);
  }
  for (let i = 0; i < ny - 1; i++) {
    const t1 = topIds[i][0], t2 = topIds[i+1][0], b1 = botIds[i][0], b2 = botIds[i+1][0];
    indices.push(t1, b2, b1, t1, t2, b2);
    const rt1 = topIds[i][nx-1], rt2 = topIds[i+1][nx-1], rb1 = botIds[i][nx-1], rb2 = botIds[i+1][nx-1];
    indices.push(rt1, rb1, rb2, rt1, rb2, rt2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
