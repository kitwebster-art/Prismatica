<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prismatica V2 — Lens Playground</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; color:#eee; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #ddd; opacity: 0.8; pointer-events: none;
  }
  #hud b { font-weight: 600; letter-spacing: 0.12em; }
  #hud span { color: #888; }
  #status {
    position: fixed; bottom: 12px; left: 80px; z-index: 10;
    font-size: 11px; color: #888; font-family: "SF Mono", ui-monospace, Menlo, monospace;
    max-width: 70%;
  }
  #fps {
    position: fixed; bottom: 12px; left: 14px; z-index: 10;
    font-size: 11px; color: #888; font-family: "SF Mono", ui-monospace, Menlo, monospace;
    pointer-events: none;
  }
  canvas { display: block; }
  .lil-gui { --background-color: #111; --widget-color: #1e1e1e; --focus-color: #333; --hover-color: #2a2a2a; --number-color: #f0a; --string-color: #0af; font-size: 11px; }
  .lil-gui.root { --width: 300px; }
  .lil-gui .title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .fi { position: absolute; left: -9999px; }

  /* --- render mode overlay ------------------------------------------------ */
  /* Shown during offline render. Covers canvas + GUI so the compositor has less
     work to do and the user gets a clean "rendering…" screen. */
  #renderOverlay {
    position: fixed; inset: 0; z-index: 100000; display: none;
    background: #000; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    justify-content: center; align-items: center;
  }
  #renderOverlay.on { display: flex; }
  body.render-mode canvas { display: none !important; }
  body.render-mode .lil-gui { display: none !important; }
  body.render-mode #hud, body.render-mode #fps, body.render-mode #aspectOverlay { display: none !important; }
  body.render-mode #status { display: none !important; }
  #renderOverlay .box {
    text-align: center; max-width: 640px; padding: 0 32px;
  }
  #renderOverlay h1 {
    margin: 0 0 8px 0; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #888; font-weight: 500;
  }
  #renderOverlay .title2 {
    font-size: 32px; font-weight: 300; letter-spacing: 0.02em; margin: 0 0 36px 0;
    background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #renderOverlay .stats {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 13px; color: #aaa; margin-bottom: 20px; line-height: 1.8;
  }
  #renderOverlay .stats .num { color: #fff; }
  #renderOverlay .bar {
    width: 100%; height: 6px; background: #1a1a1a; border-radius: 3px;
    overflow: hidden; margin-bottom: 24px;
  }
  #renderOverlay .barFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3af, #f0a);
    transition: width 120ms linear;
  }
  #renderOverlay .stopBtn {
    appearance: none; background: transparent; color: #888; border: 1px solid #333;
    padding: 10px 28px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    font-family: inherit; cursor: pointer; border-radius: 4px;
    transition: color 120ms, border-color 120ms;
  }
  #renderOverlay .stopBtn:hover { color: #fff; border-color: #666; }
  #renderOverlay .hint { color: #555; font-size: 11px; margin-top: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><b>Prismatica V2</b> <span>— lens playground</span></div>
<div id="status">loading…</div>

<div id="renderOverlay">
  <div class="box">
    <h1>Exporting Video</h1>
    <div class="title2" id="roTitle">Rendering…</div>
    <div class="bar"><div class="barFill" id="roBarFill"></div></div>
    <div class="stats" id="roStats">preparing encoder…</div>
    <button class="stopBtn" id="roStopBtn">■ Stop render</button>
    <div class="hint">keep this tab in the foreground for fastest render</div>
  </div>
</div>

<input type="file" id="fileImage" class="fi" accept="image/*" />
<input type="file" id="fileVideo" class="fi" accept="video/*" />
<input type="file" id="fileImport" class="fi" accept="application/json" />
<input type="file" id="fileLogo"  class="fi" accept="image/*,.svg" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'lil-gui';

const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

// -------------------------------------------------------------------------
// Renderer + scene
// -------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const QUALITY_PRESETS = {
  eco:      { pixelRatio: 1.0, transmissionScale: 0.4 },
  balanced: { pixelRatio: 1.5, transmissionScale: 0.7 },
  high:     { pixelRatio: 2.0, transmissionScale: 1.0 },
  ultra:    { pixelRatio: Math.min(window.devicePixelRatio, 3.0), transmissionScale: 1.0 },
};
function applyRenderQuality(name) {
  const q = QUALITY_PRESETS[name] || QUALITY_PRESETS.high;
  renderer.setPixelRatio(q.pixelRatio);
  renderer.transmissionResolutionScale = q.transmissionScale;
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (typeof composer !== 'undefined') {
    composer.setPixelRatio(q.pixelRatio);
    composer.setSize(window.innerWidth, window.innerHeight);
    bloomPass.setSize(window.innerWidth, window.innerHeight);
  }
}
// Transmission rendering is the main cost. Halve its internal render target.
renderer.transmissionResolutionScale = 1.0;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(0, 220, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 200;
controls.maxDistance = 3000;

// While the user drags the camera, auto orbit/zoom/pan step aside so the
// mouse wins. On release, the motion recenters on wherever the camera ended up.
let userInteractingWithCamera = false;
controls.addEventListener('start', () => {
  userInteractingWithCamera = true;
  // Undo any active pan offset so the on-screen camera position matches the
  // real world position (otherwise the drag starts from a stale point).
  if (typeof updateCameraMotion !== 'undefined' && updateCameraMotion._lastPanDy) {
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
  }
});
controls.addEventListener('end', () => {
  userInteractingWithCamera = false;
  // Force auto-motion to recapture "home" from the new camera pose.
  orbitHomeAzimuth = null;
  orbitHomeElevation = null;
  orbitPhase = 0;
  zoomBaseDist = null;
  zoomPhase = 0;
  panPhase = 0;
});

// -------------------------------------------------------------------------
// Post-processing (bloom)
// -------------------------------------------------------------------------
const postRT = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  samples: 4,
  type: THREE.HalfFloatType,
  colorSpace: THREE.SRGBColorSpace,
});
const composer = new EffectComposer(renderer, postRT);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(window.innerWidth, window.innerHeight);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.5,   // strength
  0.7,   // radius
  0.82,  // threshold
);
bloomPass.enabled = false;
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

function renderFrame() { composer.render(); }

const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(400, 600, 800);
scene.add(key);
const rim = new THREE.DirectionalLight(0x66aaff, 0.5);
rim.position.set(-600, 200, -400);
scene.add(rim);

// -------------------------------------------------------------------------
// LED shader
// -------------------------------------------------------------------------
const panelTexture = { value: null };
const hasTexture = { value: 0 };

const ledShader = {
  uniforms: {
    uTime:       { value: 0 },
    uMode:       { value: 1 },
    uScale:      { value: 40.0 },
    uSpeed:      { value: 0.5 },
    uBrightness: { value: 2.4 },
    uHueShift:   { value: 0.0 },
    uTex:        panelTexture,
    uHasTex:     hasTexture,
    uSqThickness:{ value: 0.5 },
    uSqSoftness: { value: 0.3 },
    uSqMono:     { value: 0 },
    uSqDir:      { value: 1.0 },
    uSqHueSpread:{ value: 2.5 },
    // Gradient overlay for Squares mode. Baked into the panel texture so the
    // lens refracts/magnifies it naturally as the camera moves — that's the
    // "stretchy" effect that shows off when filming from different angles.
    uSqGrad:     { value: 0 },
    uSqGradA:    { value: new THREE.Color(0xff2e88) },  // magenta
    uSqGradB:    { value: new THREE.Color(0x00e0ff) },  // cyan
    uSqGradC:    { value: new THREE.Color(0xffd34d) },  // warm gold
    uSqGradAxis: { value: 0 },  // 0=radial 1=horiz 2=vert 3=diagonal 4=angle
    uSqGradScale:{ value: 1.0 },
    uSqGradFlow: { value: 0.15 },
    uPanelSmooth:{ value: 1 },  // 0 = hard cells, 1 = 4-tap AA (kills scan-line aliasing)
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform int   uMode;
    uniform float uScale;
    uniform float uSpeed;
    uniform float uBrightness;
    uniform float uHueShift;
    uniform sampler2D uTex;
    uniform int uHasTex;
    uniform float uSqThickness;
    uniform float uSqSoftness;
    uniform int   uSqMono;
    uniform float uSqDir;
    uniform float uSqHueSpread;
    uniform int   uSqGrad;
    uniform vec3  uSqGradA;
    uniform vec3  uSqGradB;
    uniform vec3  uSqGradC;
    uniform int   uSqGradAxis;
    uniform float uSqGradScale;
    uniform float uSqGradFlow;
    uniform int   uPanelSmooth;

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz)*6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }

    vec3 computeLedColor(vec2 uv, float t) {
      vec2 px = floor(uv * uScale);
      vec2 puv = (px + 0.5) / uScale;
      vec3 col = vec3(0.0);

      if (uMode == 0) {
        float c = mod(px.x + px.y, 2.0);
        float h = c * 0.5 + uHueShift + t * 0.1;
        col = hsv2rgb(vec3(fract(h), 0.85, 0.9));
      } else if (uMode == 1) {
        float h = (px.x / uScale) + (px.y / uScale) * 0.5 + uHueShift + t * 0.2;
        col = hsv2rgb(vec3(fract(h), 0.9, 1.0));
      } else if (uMode == 2) {
        float v = 0.5 + 0.5 * sin(puv.x * 12.0 + t * 2.0) * cos(puv.y * 8.0 - t * 1.3);
        col = hsv2rgb(vec3(fract(v + uHueShift), 0.85, v));
      } else if (uMode == 3) {
        vec2 c = puv - 0.5;
        float r = length(c);
        float ringFreq = uScale * 0.6;
        float v = 0.5 + 0.5 * sin(r * ringFreq - t * 3.0);
        col = hsv2rgb(vec3(fract(r * 2.0 + uHueShift + t * 0.05), 0.85, v));
      } else if (uMode == 4) {
        float v = 0.5 + 0.5 * sin(puv.y * 40.0 + t * 6.0);
        col = vec3(v, v * 0.6, v * 0.3);
      } else if (uMode == 5) {
        vec2 q = px + floor(t * 6.0);
        float h = hash(q);
        col = hsv2rgb(vec3(fract(h + uHueShift), 0.9, 1.0));
      } else if (uMode == 6) {
        col = vec3(1.0);
      } else if (uMode == 9) {
        vec2 cell = floor(uv * uScale);
        vec2 cp = fract(uv * uScale) - 0.5;
        float h = hash(cell + floor(t * 0.3));
        float brightness = 0.0;
        if (h > 0.88) {
          float tw = 0.5 + 0.5 * sin(t * 5.0 + h * 50.0);
          float d = length(cp);
          float core = smoothstep(0.45, 0.0, d * 4.0);
          float cross = max(smoothstep(0.015, 0.0, abs(cp.x)), smoothstep(0.015, 0.0, abs(cp.y))) * smoothstep(0.5, 0.0, d);
          brightness = (core * core + cross * 0.6) * (0.4 + 0.6 * tw);
        }
        vec3 tint = hsv2rgb(vec3(fract(h * 2.0 + uHueShift), 0.5, 1.0));
        col = brightness * mix(vec3(1.0), tint, 0.5);
      } else if (uMode == 10) {
        vec2 c = puv - 0.5;
        float r = length(c);
        float a = atan(c.y, c.x);
        float arms = 3.0;
        float spiral = sin(a * arms + log(r + 0.01) * 9.0 - t * 1.8);
        float arm = smoothstep(-0.1, 0.8, spiral) * exp(-r * 2.4);
        float core = exp(-r * 16.0) * 1.6;
        float hue = fract(0.62 + r * 0.6 + uHueShift);
        col = hsv2rgb(vec3(hue, 0.75, arm)) + vec3(1.0, 0.85, 0.6) * core;
      } else if (uMode == 11) {
        vec2 c = puv - 0.5;
        float r = length(c);
        float freq = uScale * 1.2;
        float rings = sin(r * freq - t * 4.0);
        float v = smoothstep(0.0, 0.9, rings);
        float hue = fract(r * 4.0 + t * 0.12 + uHueShift);
        col = hsv2rgb(vec3(hue, 0.9, v));
      } else if (uMode == 12) {
        vec2 c = puv - 0.5;
        float a = atan(c.y, c.x);
        float r = length(c);
        float spokes = 12.0;
        float ray = 0.5 + 0.5 * cos(a * spokes - t * 1.0);
        float v = pow(ray, 3.0) * smoothstep(0.55, 0.0, r) * (0.6 + 0.4 * sin(t * 2.0 + r * 20.0));
        col = hsv2rgb(vec3(fract(a / 6.2832 + t * 0.1 + uHueShift), 0.85, v));
      } else if (uMode == 13) {
        vec2 c = abs(uv - 0.5);
        float d = max(c.x, c.y);
        float freq = uScale * 0.5;
        float phase = d * freq - t * 3.0 * uSqDir;
        // triangular wave in [0,1], symmetric band profile
        float tri = 1.0 - abs(fract(phase / 6.2831853) * 2.0 - 1.0);
        // duty cycle via uSqThickness (0 = thin line, 1 = mostly filled)
        float halfWidth = clamp(uSqThickness, 0.02, 0.98);
        float soft = clamp(uSqSoftness, 0.0, 1.0) * 0.5 + 0.001;
        float edge = smoothstep(halfWidth - soft, halfWidth, tri);
        if (uSqGrad == 1) {
          // Sample a 3-stop gradient (A→B→C→A) along the chosen axis.
          // Baked into the panel so the lens stretches/magnifies it on camera moves.
          float g;
          if      (uSqGradAxis == 0) g = length(uv - 0.5) * 1.4142;                        // radial
          else if (uSqGradAxis == 1) g = uv.x;                                             // horizontal
          else if (uSqGradAxis == 2) g = uv.y;                                             // vertical
          else if (uSqGradAxis == 3) g = (uv.x + uv.y) * 0.5;                              // diagonal
          else                        g = atan(uv.y - 0.5, uv.x - 0.5) / 6.2831853 + 0.5;  // angular
          g = fract(g * uSqGradScale + t * uSqGradFlow + uHueShift);
          float s = g * 3.0;
          vec3 g0, g1; float lt;
          if (s < 1.0)      { g0 = uSqGradA; g1 = uSqGradB; lt = s; }
          else if (s < 2.0) { g0 = uSqGradB; g1 = uSqGradC; lt = s - 1.0; }
          else              { g0 = uSqGradC; g1 = uSqGradA; lt = s - 2.0; }
          vec3 grad = mix(g0, g1, lt);
          vec3 mono = vec3(edge);
          col = mix(grad * edge, mono, float(uSqMono));
        } else {
          float hue = fract(d * uSqHueSpread - t * 0.15 + uHueShift);
          vec3 colourful = hsv2rgb(vec3(hue, 0.9, edge));
          vec3 mono = vec3(edge);
          col = mix(colourful, mono, float(uSqMono));
        }
      } else if (uMode == 7 || uMode == 8) {
        vec2 samp = (uScale >= 999.0) ? uv : puv;
        vec3 tex = (uHasTex == 1) ? texture2D(uTex, samp).rgb : vec3(0.2);
        col = tex;
        if (uHueShift != 0.0) {
          float mx = max(max(col.r, col.g), col.b);
          float mn = min(min(col.r, col.g), col.b);
          float v = mx;
          float s = mx > 0.0 ? (mx - mn) / mx : 0.0;
          float h = 0.0;
          if (mx != mn) {
            if (mx == col.r) h = (col.g - col.b) / (mx - mn);
            else if (mx == col.g) h = 2.0 + (col.b - col.r) / (mx - mn);
            else h = 4.0 + (col.r - col.g) / (mx - mn);
            h /= 6.0; if (h < 0.0) h += 1.0;
          }
          h = fract(h + uHueShift);
          col = hsv2rgb(vec3(h, s, v));
        }
      }
      return col;
    }

    void main() {
      float t = uTime * uSpeed;
      vec3 col;
      if (uPanelSmooth == 1) {
        // 4-tap sub-pixel AA: sample the panel at ±0.25 screen-pixel offsets
        // and average. Kills cell-boundary aliasing / moiré / scan-line effects
        // when the panel is viewed at a distance or at a steep angle.
        vec2 dx = dFdx(vUv) * 0.25;
        vec2 dy = dFdy(vUv) * 0.25;
        col = 0.25 * (
          computeLedColor(vUv - dx - dy, t) +
          computeLedColor(vUv + dx - dy, t) +
          computeLedColor(vUv - dx + dy, t) +
          computeLedColor(vUv + dx + dy, t)
        );
      } else {
        col = computeLedColor(vUv, t);
      }
      col *= uBrightness;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};

const ledGeo = new THREE.PlaneGeometry(800, 800, 1, 1);
const ledMat = new THREE.ShaderMaterial({ ...ledShader, depthWrite: true, side: THREE.FrontSide });
const ledPanel = new THREE.Mesh(ledGeo, ledMat);
ledPanel.position.z = -30;
scene.add(ledPanel);

const ledMatB = new THREE.ShaderMaterial({ ...ledShader, depthWrite: true, side: THREE.FrontSide });
const ledPanelB = new THREE.Mesh(new THREE.PlaneGeometry(800, 800, 1, 1), ledMatB);
ledPanelB.position.z = -30;
ledPanelB.visible = false;
scene.add(ledPanelB);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
backdrop.position.z = -800;
scene.add(backdrop);

// -------------------------------------------------------------------------
// PRNG
// -------------------------------------------------------------------------
function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// -------------------------------------------------------------------------
// Logo mask — loaded from an uploaded image/SVG, sampled by the logo lens
// -------------------------------------------------------------------------
let logoImageData = null;
let logoName = '';

function rasteriseLogo(img, size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // keep transparent background; alpha channel distinguishes logo from background
  const aspect = img.width / img.height;
  let w, h;
  if (aspect >= 1) { w = size * 0.9; h = w / aspect; }
  else            { h = size * 0.9; w = h * aspect; }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
  return ctx.getImageData(0, 0, size, size);
}

function loadLogoFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    logoImageData = rasteriseLogo(img);
    logoName = file.name;
    URL.revokeObjectURL(url);
    if (state.lensType === 'logo' || state.lensTypeB === 'logo') rebuildLenses();
    setStatus(`logo loaded: ${file.name}`);
  };
  img.onerror = () => { setStatus(`logo load failed: ${file.name}`); URL.revokeObjectURL(url); };
  img.src = url;
}

function loadLogoUrl(url, name, onReady) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    logoImageData = rasteriseLogo(img);
    logoName = name || url;
    if (state.lensType === 'logo' || state.lensTypeB === 'logo') rebuildLenses();
    setStatus(`logo loaded: ${logoName}`);
    if (onReady) onReady();
  };
  img.onerror = () => setStatus(`logo load failed: ${name || url}`);
  img.src = url;
}

// -------------------------------------------------------------------------
// Lens types
// -------------------------------------------------------------------------
const LENS_TYPES = {
  ripple_field: {
    label: 'Ripple Field',
    params: {
      wavelength: { value: 70, min: 20, max: 200, step: 1 },
      amplitude:  { value: 8,  min: 0,  max: 100,  step: 0.5 },
    },
    fn: (p) => (x, y) => {
      const r = Math.hypot(x, y);
      return p.amplitude * 0.5 * (1 + Math.sin(2 * Math.PI * r / p.wavelength));
    },
  },
  torus_field: {
    label: 'Torus Field',
    params: {
      cols:          { value: 3,  min: 1, max: 8, step: 1 },
      rows:          { value: 3,  min: 1, max: 8, step: 1 },
      torus_outer_r: { value: 50, min: 10, max: 120, step: 1 },
      torus_inner_r: { value: 18, min: 1,  max: 80,  step: 1 },
      torus_height:  { value: 14, min: 1,  max: 40,  step: 0.5 },
    },
    fn: (p, W, H) => {
      const cx = [], cy = [];
      for (let i = 0; i < p.cols; i++) cx.push(-W/2 + (i + 1) * W/(p.cols + 1));
      for (let j = 0; j < p.rows; j++) cy.push(-H/2 + (j + 1) * H/(p.rows + 1));
      const midR = (p.torus_outer_r + p.torus_inner_r) / 2;
      const wallR = Math.max(0.1, (p.torus_outer_r - p.torus_inner_r) / 2);
      return (x, y) => {
        let z = 0;
        for (const a of cx) for (const b of cy) {
          const r = Math.hypot(x - a, y - b);
          const diff = r - midR;
          const inside = wallR * wallR - diff * diff;
          if (inside > 0) {
            const h = p.torus_height * Math.sqrt(inside) / wallR;
            if (h > z) z = h;
          }
        }
        return z;
      };
    },
  },
  hex_cells: {
    label: 'Hex Cells',
    params: {
      cell_size:  { value: 40, min: 10, max: 120, step: 1 },
      cell_depth: { value: 6,  min: 0,  max: 30,  step: 0.5 },
      invert:     { value: false },
    },
    fn: (p, W, H) => {
      const dx = p.cell_size * 1.5;
      const dy = p.cell_size * Math.sqrt(3);
      const radius = p.cell_size * 0.85;
      const ncols = Math.ceil(W / dx) + 2;
      const nrows = Math.ceil(H / dy) + 2;
      const centres = [];
      for (let row = -nrows; row <= nrows; row++) {
        for (let col = -ncols; col <= ncols; col++) {
          const ax = col * dx;
          const ay = row * dy + (col % 2 ? dy / 2 : 0);
          centres.push([ax, ay]);
        }
      }
      return (x, y) => {
        let z = p.cell_depth;
        for (const [a, b] of centres) {
          const r = Math.hypot(x - a, y - b);
          if (r < radius) {
            const bowl = 0.5 * (1 - Math.cos(Math.PI * r / radius)) * p.cell_depth;
            if (bowl < z) z = bowl;
          }
        }
        return p.invert ? (p.cell_depth - z) : z;
      };
    },
  },
  organic_bulbs: {
    label: 'Organic Bulbs',
    params: {
      n_bulbs: { value: 24, min: 1,  max: 80, step: 1 },
      seed:    { value: 7,  min: 0,  max: 999, step: 1 },
      min_r:   { value: 30, min: 10, max: 120, step: 1 },
      max_r:   { value: 75, min: 20, max: 200, step: 1 },
      min_h:   { value: 8,  min: 0,  max: 30,  step: 0.5 },
      max_h:   { value: 22, min: 1,  max: 50,  step: 0.5 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const margin = Math.max(p.min_r, p.max_r);
      const bulbs = [];
      for (let i = 0; i < p.n_bulbs; i++) {
        const cx = rng() * (W - 2 * margin) - (W/2 - margin);
        const cy = rng() * (H - 2 * margin) - (H/2 - margin);
        const radius = p.min_r + rng() * Math.max(0, p.max_r - p.min_r);
        const hpk = p.min_h + rng() * Math.max(0, p.max_h - p.min_h);
        bulbs.push([cx, cy, radius, hpk]);
      }
      return (x, y) => {
        let z = 0;
        for (const [cx, cy, radius, hpk] of bulbs) {
          const r = Math.hypot(x - cx, y - cy);
          if (r < radius) {
            const h = hpk * 0.5 * (1 + Math.cos(Math.PI * r / radius));
            if (h > z) z = h;
          }
        }
        return z;
      };
    },
  },
  pyramid_grid: {
    label: 'Pyramid Grid (v1 homage)',
    params: {
      cols:      { value: 8,  min: 1,  max: 24, step: 1 },
      rows:      { value: 8,  min: 1,  max: 24, step: 1 },
      pyramid_h: { value: 20, min: 1,  max: 60, step: 0.5 },
    },
    fn: (p, W, H) => {
      const cellW = W / p.cols;
      const cellH = H / p.rows;
      return (x, y) => {
        const u = (((x + W/2) % cellW) + cellW) % cellW / cellW - 0.5;
        const v = (((y + H/2) % cellH) + cellH) % cellH / cellH - 0.5;
        const d = Math.max(Math.abs(u), Math.abs(v)) * 2;
        return Math.max(0, Math.min(p.pyramid_h, p.pyramid_h * (1 - d)));
      };
    },
  },
  dome: {
    label: 'Single Dome',
    params: {
      radius: { value: 280, min: 50, max: 600, step: 1 },
      height: { value: 40,  min: 1,  max: 120, step: 1 },
    },
    fn: (p) => (x, y) => {
      const r = Math.hypot(x, y);
      if (r >= p.radius) return 0;
      return p.height * 0.5 * (1 + Math.cos(Math.PI * r / p.radius));
    },
  },
  morph_rings: {
    label: 'Morph Rings (square ↔ circle)',
    params: {
      wavelength:   { value: 40, min: 10,  max: 200, step: 1 },
      amplitude:    { value: 12, min: 0,   max: 60,  step: 0.5 },
      morph_period: { value: 2,  min: 1,   max: 8,   step: 1 },
      bias:         { value: 0.5, min: 0,  max: 1,   step: 0.02 },
      phase_shift:  { value: 0,  min: 0,   max: 1,   step: 0.01 },
    },
    fn: (p, W, H) => {
      const TAU = Math.PI * 2;
      const maxD = Math.min(W, H) * 0.5;
      const period = Math.max(1, p.morph_period);
      return (x, y) => {
        const ax = Math.abs(x), ay = Math.abs(y);
        const dSq = Math.max(ax, ay);       // Chebyshev — square
        const dCr = Math.hypot(x, y);        // Euclidean — circle
        const dMid = 0.5 * (dSq + dCr);
        // Morph oscillator: 0 → 1 → 0 once per cycle. Starts at 0 (square) near centre.
        const cycleLen = p.wavelength * period;
        const osc = 0.5 - 0.5 * Math.cos(TAU * dMid / cycleLen);
        // Bias slides the midpoint toward more-square (0) or more-circle (1).
        // bias=0.5 keeps the pure oscillation; higher = circlier; lower = squarer.
        const w = Math.min(1, Math.max(0, osc + (p.bias - 0.5)));
        const d = dSq * (1 - w) + dCr * w;
        if (d >= maxD) return 0;
        // Soft radial fall-off so edges taper gracefully
        const fade = 0.5 * (1 + Math.cos(Math.PI * d / maxD));
        // Concentric ridges along the morphed distance
        const ridge = 0.5 * (1 + Math.sin(TAU * (d / p.wavelength + p.phase_shift)));
        return p.amplitude * ridge * fade;
      };
    },
  },
  interlocking_teardrops: {
    label: 'Interlocking Teardrops',
    params: {
      cols:         { value: 4,  min: 1,  max: 10,  step: 1 },
      rows:         { value: 4,  min: 1,  max: 10,  step: 1 },
      size:         { value: 70, min: 20, max: 200, step: 1 },
      height:       { value: 16, min: 1,  max: 40,  step: 0.5 },
      asymmetry:    { value: 0.5, min: 0.0, max: 0.9, step: 0.05 },
      rot_variance: { value: 0.8, min: 0,   max: 1,   step: 0.05 },
      jitter:       { value: 0.3, min: 0,   max: 0.6, step: 0.05 },
      seed:         { value: 3,  min: 0,   max: 999, step: 1 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const dxC = W / p.cols;
      const dyC = H / p.rows;
      const drops = [];
      for (let i = 0; i < p.cols; i++) {
        for (let j = 0; j < p.rows; j++) {
          const cx = -W/2 + (i + 0.5) * dxC + (rng() - 0.5) * dxC * p.jitter;
          const cy = -H/2 + (j + 0.5) * dyC + (rng() - 0.5) * dyC * p.jitter;
          const angle = rng() * Math.PI * 2 * p.rot_variance;
          drops.push([cx, cy, Math.cos(angle), Math.sin(angle)]);
        }
      }
      return (x, y) => {
        let z = 0;
        for (const [cx, cy, ca, sa] of drops) {
          const ex = x - cx, ey = y - cy;
          const lx = ex * ca + ey * sa;
          const ly = -ex * sa + ey * ca;
          const r = Math.hypot(lx, ly);
          if (r > p.size) continue;
          const theta = Math.atan2(ly, lx);
          const rMax = p.size * (1 + p.asymmetry * Math.cos(theta));
          if (r >= rMax) continue;
          const t = r / rMax;
          const v = p.height * 0.5 * (1 + Math.cos(Math.PI * t));
          if (v > z) z = v;
        }
        return z;
      };
    },
  },
  wave_lattice: {
    label: 'Wave Lattice',
    params: {
      wavelength_x: { value: 80, min: 20, max: 300, step: 1 },
      wavelength_y: { value: 80, min: 20, max: 300, step: 1 },
      amplitude:    { value: 10, min: 0,  max: 100,  step: 0.5 },
      diagonal_mix: { value: 0.0, min: 0, max: 1,   step: 0.05 },
      rotation:     { value: 0,  min: 0,  max: 90,  step: 1 },
    },
    fn: (p) => {
      const rad = p.rotation * Math.PI / 180;
      const ca = Math.cos(rad), sa = Math.sin(rad);
      const avg = (p.wavelength_x + p.wavelength_y) / 2;
      return (x, y) => {
        const rx = x * ca + y * sa;
        const ry = -x * sa + y * ca;
        const wx = Math.sin(2 * Math.PI * rx / p.wavelength_x);
        const wy = Math.sin(2 * Math.PI * ry / p.wavelength_y);
        const d1 = Math.sin(2 * Math.PI * (rx + ry) / avg);
        const d2 = Math.sin(2 * Math.PI * (rx - ry) / avg);
        const val = (wx + wy) * (1 - p.diagonal_mix) + (d1 + d2) * p.diagonal_mix;
        return p.amplitude * 0.25 * (2 + val);
      };
    },
  },
  logo: {
    label: 'Custom Logo',
    params: {
      height:  { value: 30, min: 1,  max: 80,  step: 0.5 },
      falloff: { value: 0.15, min: 0, max: 0.5, step: 0.01 },
      invert:  { value: false },
      threshold: { value: 0.5, min: 0.0, max: 1.0, step: 0.01 },
    },
    fn: (p, W, H) => {
      const data = logoImageData;
      if (!data) return () => 0;
      const dw = data.width, dh = data.height;
      const buf = data.data;
      return (x, y) => {
        const u = (x + W / 2) / W;
        const v = 1 - (y + H / 2) / H;
        if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
        const px = Math.min(dw - 1, Math.max(0, Math.floor(u * dw)));
        const py = Math.min(dh - 1, Math.max(0, Math.floor(v * dh)));
        const idx = (py * dw + px) * 4;
        const alpha = buf[idx + 3] / 255;
        const lum   = (buf[idx] + buf[idx + 1] + buf[idx + 2]) / (3 * 255);
        // mask = "is this a logo pixel?" — handles transparent-bg SVGs and opaque light-bg PNGs
        const raw = p.invert ? lum : (1 - lum);
        let t = alpha * raw + (1 - alpha) * (p.invert ? 1 : 0);
        const soft = Math.max(0.001, p.falloff);
        t = Math.min(1, Math.max(0, (t - p.threshold + soft) / (2 * soft)));
        const shaped = 0.5 * (1 - Math.cos(Math.PI * t));
        return shaped * p.height;
      };
    },
  },
  voronoi_bulbs: {
    label: 'Voronoi Bulbs',
    params: {
      n_seeds: { value: 20, min: 3, max: 80,  step: 1 },
      seed:    { value: 5,  min: 0, max: 999, step: 1 },
      height:  { value: 18, min: 1, max: 50,  step: 0.5 },
      fill:    { value: 0.85, min: 0.2, max: 1.0, step: 0.02 },
    },
    fn: (p, W, H) => {
      const rng = mulberry32(p.seed);
      const margin = 20;
      const seeds = [];
      for (let i = 0; i < p.n_seeds; i++) {
        seeds.push([
          rng() * (W - 2 * margin) - (W/2 - margin),
          rng() * (H - 2 * margin) - (H/2 - margin),
        ]);
      }
      return (x, y) => {
        let d1 = Infinity, d2 = Infinity;
        for (const [sx, sy] of seeds) {
          const d = Math.hypot(x - sx, y - sy);
          if (d < d1) { d2 = d1; d1 = d; }
          else if (d < d2) { d2 = d; }
        }
        const rCell = (d1 + d2) * 0.5 * p.fill;
        if (d1 > rCell) return 0;
        const t = d1 / rCell;
        return p.height * 0.5 * (1 + Math.cos(Math.PI * t));
      };
    },
  },
};

// -------------------------------------------------------------------------
// Geometry
// -------------------------------------------------------------------------
function makeLensGeometry(heightFn, width, height, resolution, thickness, smoothing = 0) {
  const nx = Math.max(4, Math.floor(width / resolution) + 1);
  const ny = Math.max(4, Math.floor(height / resolution) + 1);

  // Pre-sample the height field into a grid so we can blur it before emitting vertices.
  const grid = new Float32Array(nx * ny);
  for (let i = 0; i < ny; i++) {
    const y = -height/2 + (i / (ny - 1)) * height;
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      grid[i * nx + j] = heightFn(x, y);
    }
  }
  // Separable box-blur passes for cheap surface smoothing. Each pass is ~O(nx·ny).
  const passes = Math.max(0, smoothing | 0);
  if (passes > 0) {
    const tmp = new Float32Array(nx * ny);
    for (let p = 0; p < passes; p++) {
      // Horizontal
      for (let i = 0; i < ny; i++) {
        const row = i * nx;
        for (let j = 0; j < nx; j++) {
          const l = j > 0 ? grid[row + j - 1] : grid[row + j];
          const c = grid[row + j];
          const r = j < nx - 1 ? grid[row + j + 1] : grid[row + j];
          tmp[row + j] = (l + c + c + r) * 0.25;
        }
      }
      // Vertical
      for (let j = 0; j < nx; j++) {
        for (let i = 0; i < ny; i++) {
          const u = i > 0 ? tmp[(i - 1) * nx + j] : tmp[i * nx + j];
          const c = tmp[i * nx + j];
          const d = i < ny - 1 ? tmp[(i + 1) * nx + j] : tmp[i * nx + j];
          grid[i * nx + j] = (u + c + c + d) * 0.25;
        }
      }
    }
  }

  const verts = [];
  const indices = [];
  const vert = (x, y, z) => { const id = verts.length / 3; verts.push(x, y, z); return id; };

  const topIds = [], botIds = [];
  for (let i = 0; i < ny; i++) {
    const y = -height/2 + (i / (ny - 1)) * height;
    const rowT = [], rowB = [];
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      rowT.push(vert(x, y, grid[i * nx + j]));
    }
    for (let j = 0; j < nx; j++) {
      const x = -width/2 + (j / (nx - 1)) * width;
      rowB.push(vert(x, y, -thickness));
    }
    topIds.push(rowT); botIds.push(rowB);
  }

  // Sculpted top face
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = topIds[i][j], b = topIds[i][j+1], c = topIds[i+1][j+1], d = topIds[i+1][j];
    indices.push(a, b, c, a, c, d);
  }
  // Flat bottom face (reverse winding)
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = botIds[i][j], b = botIds[i][j+1], c = botIds[i+1][j+1], d = botIds[i+1][j];
    indices.push(a, c, b, a, d, c);
  }
  // Perimeter walls
  for (let j = 0; j < nx - 1; j++) {
    const t1 = topIds[0][j], t2 = topIds[0][j+1], b1 = botIds[0][j], b2 = botIds[0][j+1];
    indices.push(t1, b1, b2, t1, b2, t2);
    const ut1 = topIds[ny-1][j], ut2 = topIds[ny-1][j+1], ub1 = botIds[ny-1][j], ub2 = botIds[ny-1][j+1];
    indices.push(ut1, ub2, ub1, ut1, ut2, ub2);
  }
  for (let i = 0; i < ny - 1; i++) {
    const t1 = topIds[i][0], t2 = topIds[i+1][0], b1 = botIds[i][0], b2 = botIds[i+1][0];
    indices.push(t1, b2, b1, t1, t2, b2);
    const rt1 = topIds[i][nx-1], rt2 = topIds[i+1][nx-1], rb1 = botIds[i][nx-1], rb2 = botIds[i+1][nx-1];
    indices.push(rt1, rb1, rb2, rt1, rb2, rt2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

let rebuildTimer = null;
function rebuildSoon() {
  if (rebuildTimer) cancelAnimationFrame(rebuildTimer);
  rebuildTimer = requestAnimationFrame(() => {
    rebuildTimer = null;
    rebuildLenses();
  });
}
function rebuildLenses() {
  if (lensMesh) { lensMesh.geometry.dispose(); scene.remove(lensMesh); }
  const typeA = LENS_TYPES[state.lensType];
  const hA = typeA.fn(state.params, state.panelWidth, state.panelHeight);
  const geoA = makeLensGeometry(hA, state.panelWidth, state.panelHeight, state.resolution, state.thickness, state.smoothing);
  lensMesh = new THREE.Mesh(geoA, lensMaterial);
  scene.add(lensMesh);

  // LED sits behind the flat back of the lens: lens back is at z = -thickness,
  // so LED is at z = -(thickness + gap)
  const ledZA = -(state.thickness + state.panelDistance);
  const ledZB = -(state.thicknessB + state.panelDistance);

  if (state.compare) {
    const offsetX = state.panelWidth / 2 + 40;
    lensMesh.position.set(-offsetX, 0, 0);
    ledPanel.position.set(-offsetX, 0, ledZA);
    ledPanel.geometry.dispose();
    ledPanel.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);

    if (lensMeshB) { lensMeshB.geometry.dispose(); scene.remove(lensMeshB); }
    const typeB = LENS_TYPES[state.lensTypeB];
    const hB = typeB.fn(state.paramsB, state.panelWidth, state.panelHeight);
    const geoB = makeLensGeometry(hB, state.panelWidth, state.panelHeight, state.resolution, state.thicknessB, state.smoothing);
    lensMeshB = new THREE.Mesh(geoB, lensMaterialB);
    lensMeshB.position.set(offsetX, 0, 0);
    scene.add(lensMeshB);

    ledPanelB.visible = true;
    ledPanelB.position.set(offsetX, 0, ledZB);
    ledPanelB.geometry.dispose();
    ledPanelB.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);

    setStatus(`A: ${typeA.label}  ·  B: ${typeB.label}  ·  ${state.panelWidth}×${state.panelHeight} mm each`);
  } else {
    lensMesh.position.set(0, 0, 0);
    ledPanel.position.set(0, 0, ledZA);
    ledPanel.geometry.dispose();
    ledPanel.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);
    if (lensMeshB) { scene.remove(lensMeshB); lensMeshB.geometry.dispose(); lensMeshB = null; }
    ledPanelB.visible = false;
    setStatus(`${typeA.label}  ·  ${state.panelWidth}×${state.panelHeight} mm  ·  ${(geoA.attributes.position.count).toLocaleString()} verts`);
  }
}

// Snap orbit/zoom/pan/spin speeds so each completes an integer number of cycles
// over the current clip duration. Use this BEFORE an offline render with loop on
// so the motion closes seamlessly without shifting away from the user's intent.
function snapSpeedsToLoop() {
  const d = Math.max(1, state.recDuration | 0 || 10);
  const snap = (speed) => {
    if (!speed) return 0;
    const cycles = Math.max(1, Math.round(speed * d));
    return cycles / d;
  };
  const parts = [];
  if (state.autoOrbit && state.orbitSpeed) { const v = snap(state.orbitSpeed); parts.push(`orbit ${state.orbitSpeed.toFixed(3)}→${v.toFixed(3)}`); state.orbitSpeed = v; }
  if (state.autoZoom  && state.zoomSpeed)  { const v = snap(state.zoomSpeed);  parts.push(`zoom ${state.zoomSpeed.toFixed(3)}→${v.toFixed(3)}`);  state.zoomSpeed  = v; }
  if (state.autoPan   && state.panSpeed)   { const v = snap(state.panSpeed);   parts.push(`pan ${state.panSpeed.toFixed(3)}→${v.toFixed(3)}`);   state.panSpeed   = v; }
  if (state.lensSpin) {
    const rots = Math.max(1, Math.round(Math.abs(state.lensSpin) * d / 360));
    const sign = state.lensSpin < 0 ? -1 : 1;
    const v = sign * rots * 360 / d;
    parts.push(`spin ${state.lensSpin.toFixed(1)}→${v.toFixed(1)}°/s`);
    state.lensSpin = v;
  }
  guiRefresh();
  setStatus(parts.length ? `snapped for ${d}s loop: ${parts.join(' · ')}` : `nothing to snap — enable orbit/zoom/pan/spin first`);
}

// -------------------------------------------------------------------------
// STL export
// -------------------------------------------------------------------------
function buildSolidForExport(isB) {
  const W = state.panelWidth, H = state.panelHeight;
  const res = Math.min(state.resolution, 2.0);
  const nx = Math.max(4, Math.floor(W / res) + 1);
  const ny = Math.max(4, Math.floor(H / res) + 1);
  const type = LENS_TYPES[isB ? state.lensTypeB : state.lensType];
  const heightFn = type.fn(isB ? state.paramsB : state.params, W, H);
  const thickness = isB ? state.thicknessB : state.thickness;

  const verts = [];
  const vert = (x, y, z) => { const id = verts.length / 3; verts.push(x, y, z); return id; };
  const topIds = [], botIds = [];
  for (let i = 0; i < ny; i++) {
    const y = -H/2 + (i / (ny - 1)) * H;
    const rowT = [], rowB = [];
    for (let j = 0; j < nx; j++) {
      const x = -W/2 + (j / (nx - 1)) * W;
      rowT.push(vert(x, y, heightFn(x, y)));
    }
    for (let j = 0; j < nx; j++) {
      const x = -W/2 + (j / (nx - 1)) * W;
      rowB.push(vert(x, y, -thickness));
    }
    topIds.push(rowT); botIds.push(rowB);
  }
  const triangles = [];
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = topIds[i][j], b = topIds[i][j+1], c = topIds[i+1][j+1], d = topIds[i+1][j];
    triangles.push(a, b, c, a, c, d);
  }
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = botIds[i][j], b = botIds[i][j+1], c = botIds[i+1][j+1], d = botIds[i+1][j];
    triangles.push(a, c, b, a, d, c);
  }
  for (let j = 0; j < nx - 1; j++) {
    const t1 = topIds[0][j], t2 = topIds[0][j+1], b1 = botIds[0][j], b2 = botIds[0][j+1];
    triangles.push(t1, b1, b2, t1, b2, t2);
    const ut1 = topIds[ny-1][j], ut2 = topIds[ny-1][j+1], ub1 = botIds[ny-1][j], ub2 = botIds[ny-1][j+1];
    triangles.push(ut1, ub2, ub1, ut1, ut2, ub2);
  }
  for (let i = 0; i < ny - 1; i++) {
    const t1 = topIds[i][0], t2 = topIds[i+1][0], b1 = botIds[i][0], b2 = botIds[i+1][0];
    triangles.push(t1, b2, b1, t1, t2, b2);
    const rt1 = topIds[i][nx-1], rt2 = topIds[i+1][nx-1], rb1 = botIds[i][nx-1], rb2 = botIds[i+1][nx-1];
    triangles.push(rt1, rb1, rb2, rt1, rb2, rt2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(triangles);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, lensMaterial);
}
function doExportSTL(isB) {
  try {
    setStatus(`building high-res solid for export (${isB ? 'B' : 'A'})…`);
    const solid = buildSolidForExport(isB);
    const bin = new STLExporter().parse(solid, { binary: true });
    const blob = new Blob([bin], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    const which = isB ? state.lensTypeB : state.lensType;
    const fname = `prismatica_${which}${isB ? '_B' : ''}_${state.panelWidth}x${state.panelHeight}.stl`;
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    solid.geometry.dispose();
    setStatus(`exported ${fname}`);
  } catch (e) { console.error(e); setStatus('export failed — see console'); }
}
function doScreenshot() {
  renderFrame();
  const text = (state.watermarkText || '').trim();
  if (text) {
    // Paint watermark on a copy so we don't disturb the live canvas.
    const src = renderer.domElement;
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const cx = c.getContext('2d');
    cx.drawImage(src, 0, 0);
    drawWatermark(cx, c.width, c.height);
    c.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `prismatica_${state.lensType}_${Date.now()}.png`;
      a.click();
      setStatus('screenshot saved');
    });
    return;
  }
  renderer.domElement.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `prismatica_${state.lensType}_${Date.now()}.png`;
    a.click();
    setStatus('screenshot saved');
  });
}

// Needs to be in scope before buildGUI reads it for the dropdown options.
// Aspect ratios (width/height). Combined with REC_RESOLUTIONS to compute final pixel dims.
const REC_ASPECTS = {
  'native':       null,
  '1:1 square':   1,
  '4:5 portrait': 4/5,
  '9:16 reels':   9/16,
  '16:9 wide':    16/9,
};
// Output resolution tiers, measured in px on the short side.
// e.g. 4K at 9:16 = 2160×3840; 4K at 16:9 = 3840×2160; 4K at 1:1 = 2160×2160.
const REC_RESOLUTIONS = {
  '720p (HD)':       720,
  '1080p (Full HD)': 1080,
  '1440p (2K)':      1440,
  '2160p (4K)':      2160,
  '4320p (8K)':      4320,
};
function getRecDims() {
  const ratio = REC_ASPECTS[state.recAspect];
  if (ratio == null) return null;  // native — computed from renderer canvas at render time
  const short = REC_RESOLUTIONS[state.recResolution] || 1080;
  let w, h;
  if (ratio >= 1) { h = short; w = Math.round(short * ratio); }
  else            { w = short; h = Math.round(short / ratio); }
  return [w & ~1, h & ~1];
}

// =========================================================================
// SHOT SEQUENCE — SketchUp-style ordered scenes with timed transitions
// Each shot = { pose, transitionSec, holdSec }
//   pose = { px,py,pz, tx,ty,tz, zoom }
//   transitionSec = time (s) to fly FROM previous shot TO this one (ignored for first)
//   holdSec       = time (s) to linger on this shot after arriving
// Total clip = sum of (transition + hold) for each shot (first shot's transition = 0)
// =========================================================================
const SEQUENCE_KEY = 'prismatica.shotSequence.v1';
let shotSequence = [];
try {
  const raw = JSON.parse(localStorage.getItem(SEQUENCE_KEY) || '[]');
  if (Array.isArray(raw)) shotSequence = raw;
} catch (_) { shotSequence = []; }
let sequencePlaying = false;   // live preview running (drives camera each frame)
let sequenceStartMs = 0;
let sequenceRenderActive = false;  // true during offline sequence render

function saveShotSequence() {
  try { localStorage.setItem(SEQUENCE_KEY, JSON.stringify(shotSequence)); } catch (_) {}
}
function currentPose() {
  return {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
    zoom: camera.zoom,
  };
}
function applyPose(pose) {
  if (!pose) return;
  if (updateCameraMotion._lastPanDy) {
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
  }
  camera.position.set(pose.px, pose.py, pose.pz);
  controls.target.set(pose.tx, pose.ty, pose.tz);
  if (typeof pose.zoom === 'number') { camera.zoom = pose.zoom; camera.updateProjectionMatrix(); }
  camera.lookAt(controls.target);
}
function addShotToSequence() {
  shotSequence.push({
    pose: currentPose(),
    transitionSec: state.seqDefaultTransition,
    holdSec: state.seqDefaultHold,
  });
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus(`➕ added shot ${shotSequence.length} — sequence now ${sequenceTotalDuration().toFixed(1)}s`);
}
function removeShotFromSequence(i) {
  if (i < 0 || i >= shotSequence.length) return;
  shotSequence.splice(i, 1);
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus(`removed shot ${i + 1}`);
}
function replaceShotInSequence(i) {
  if (i < 0 || i >= shotSequence.length) return;
  shotSequence[i].pose = currentPose();
  saveShotSequence();
  setStatus(`shot ${i + 1} replaced with current view`);
}
function loadShotPose(i) {
  if (i < 0 || i >= shotSequence.length) return;
  applyPose(shotSequence[i].pose);
  controls.update();
  orbitHomeAzimuth = null;
  orbitHomeElevation = null;
  orbitPhase = 0;
  zoomBaseDist = null;
  zoomPhase = 0;
  panPhase = 0;
  setStatus(`▶ jumped to shot ${i + 1}`);
}
function moveShotInSequence(i, dir) {
  const j = i + dir;
  if (i < 0 || i >= shotSequence.length || j < 0 || j >= shotSequence.length) return;
  const tmp = shotSequence[i];
  shotSequence[i] = shotSequence[j];
  shotSequence[j] = tmp;
  saveShotSequence();
  rebuildSequenceGUI();
}
function clearShotSequence() {
  shotSequence = [];
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus('cleared shot sequence');
}
function sequenceTotalDuration() {
  if (shotSequence.length === 0) return 0;
  let total = shotSequence[0].holdSec || 0;
  for (let i = 1; i < shotSequence.length; i++) {
    total += (shotSequence[i].transitionSec || 0) + (shotSequence[i].holdSec || 0);
  }
  return Math.max(0.1, total);
}

// --- Easing curves (t in [0,1] → eased t) ---
const EASINGS = {
  'linear':       t => t,
  'ease-in-out':  t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,   // cubic
  'ease-in':      t => t * t * t,
  'ease-out':     t => 1 - Math.pow(1 - t, 3),
  'smooth (quintic)': t => t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2,
};

// --- Pose interpolation — SLERP of direction around target for orbital arcs ---
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
function lerpPose(A, B, tRaw, ease) {
  const t = ease(Math.max(0, Math.min(1, tRaw)));
  const tx = A.tx + (B.tx - A.tx) * t;
  const ty = A.ty + (B.ty - A.ty) * t;
  const tz = A.tz + (B.tz - A.tz) * t;
  _tmpA.set(A.px - A.tx, A.py - A.ty, A.pz - A.tz);
  _tmpB.set(B.px - B.tx, B.py - B.ty, B.pz - B.tz);
  const la = _tmpA.length(), lb = _tmpB.length();
  const radius = la + (lb - la) * t;
  const ua = _tmpA.clone().normalize();
  const ub = _tmpB.clone().normalize();
  const cosA = Math.max(-1, Math.min(1, ua.dot(ub)));
  let dir;
  if (cosA > 0.9995) {
    dir = ua.lerp(ub, t).normalize();
  } else {
    const omega = Math.acos(cosA);
    const sinO = Math.sin(omega);
    const sa = Math.sin((1 - t) * omega) / sinO;
    const sb = Math.sin(t * omega) / sinO;
    dir = ua.multiplyScalar(sa).add(ub.multiplyScalar(sb));
  }
  return {
    px: tx + dir.x * radius,
    py: ty + dir.y * radius,
    pz: tz + dir.z * radius,
    tx, ty, tz,
    zoom: (A.zoom || 1) + ((B.zoom || 1) - (A.zoom || 1)) * t,
  };
}

// Given elapsed time (s), return the pose the camera should be at.
function evaluateSequenceAt(elapsedSec) {
  if (shotSequence.length === 0) return null;
  if (shotSequence.length === 1) return shotSequence[0].pose;
  let cursor = 0;
  // First shot: hold from 0 to its holdSec
  const firstHold = shotSequence[0].holdSec || 0;
  if (elapsedSec < firstHold) return shotSequence[0].pose;
  cursor = firstHold;
  const easeFn = EASINGS[state.seqEasing] || EASINGS['ease-in-out'];
  for (let i = 1; i < shotSequence.length; i++) {
    const trans = shotSequence[i].transitionSec || 0;
    const hold = shotSequence[i].holdSec || 0;
    if (elapsedSec < cursor + trans) {
      const localT = trans > 0 ? (elapsedSec - cursor) / trans : 1;
      return lerpPose(shotSequence[i - 1].pose, shotSequence[i].pose, localT, easeFn);
    }
    cursor += trans;
    if (elapsedSec < cursor + hold) return shotSequence[i].pose;
    cursor += hold;
  }
  return shotSequence[shotSequence.length - 1].pose;
}

function playSequencePreview() {
  if (shotSequence.length < 1) { setStatus('add at least one shot first'); return; }
  if (sequencePlaying) return;
  sequencePlaying = true;
  sequenceStartMs = performance.now();
  setStatus(`▶ previewing sequence (${sequenceTotalDuration().toFixed(1)}s)`);
}
function stopSequencePreview() {
  if (!sequencePlaying) return;
  sequencePlaying = false;
  // Recapture auto-motion homes from wherever we landed
  orbitHomeAzimuth = null;
  orbitHomeElevation = null;
  orbitPhase = 0;
  zoomBaseDist = null;
  zoomPhase = 0;
  panPhase = 0;
  setStatus('preview stopped');
}

// Wire into state actions (after function defs so closures work)
state.seqAddShot     = () => { addShotToSequence(); };
state.seqPreview     = () => { playSequencePreview(); };
state.seqStopPreview = () => { stopSequencePreview(); };
state.seqClearAll    = () => { clearShotSequence(); };
state.seqExport      = () => { renderOffline({ sequence: true }); };

// --- Shot sequence GUI section — rebuilt on every add/remove/move ---
let fSeq = null;
const seqShotFolders = [];  // sub-folders for each shot
function rebuildSequenceGUI() {
  if (!fSeq) return;
  // Remove old sub-folders
  for (const f of seqShotFolders) { try { f.destroy(); } catch (_) {} }
  seqShotFolders.length = 0;
  // Add one subfolder per shot
  for (let i = 0; i < shotSequence.length; i++) {
    const shot = shotSequence[i];
    const fs = fSeq.addFolder(`Shot ${i + 1}${i === 0 ? ' (start)' : ''}`);
    fs.close();
    const acts = {
      load:    () => loadShotPose(i),
      replace: () => replaceShotInSequence(i),
      del:     () => removeShotFromSequence(i),
      up:      () => moveShotInSequence(i, -1),
      down:    () => moveShotInSequence(i, +1),
    };
    fs.add(acts, 'load').name('▶ jump to this shot');
    fs.add(acts, 'replace').name('⟳ replace with current view');
    if (i > 0) fs.add(shot, 'transitionSec', 0, 20, 0.1).name('transition from prev (s)').onChange(saveShotSequence);
    fs.add(shot, 'holdSec', 0, 10, 0.1).name('hold on this shot (s)').onChange(saveShotSequence);
    if (i > 0) fs.add(acts, 'up').name('↑ move earlier');
    if (i < shotSequence.length - 1) fs.add(acts, 'down').name('↓ move later');
    fs.add(acts, 'del').name('× delete this shot');
    seqShotFolders.push(fs);
  }
  // Update the info controller if it exists
  if (fSeq.__infoCtrl) {
    const info = shotSequence.length === 0
      ? 'no shots yet — frame a view, hit "save shot"'
      : `${shotSequence.length} shots · total ${sequenceTotalDuration().toFixed(1)}s`;
    fSeq.__infoCtrl.name(info);
  }
}

// --- camera auto-motion state ---
let zoomBaseDist = null;
let zoomPhase = 0;
let orbitHomeAzimuth = null, orbitHomeElevation = null, orbitPhase = 0;
let panPhase = 0;
let loopCameraMode = false;   // set by offline render when recLoop is on
function updateCameraMotion(dt) {
  // In loop mode we force elevation to the same frequency as azimuth and clamp
  // all phases to a single [0..1] cycle per duration so the last frame matches the first.
  const elFreq = loopCameraMode ? 1.0 : 0.63;
  // While the user is dragging the camera — OR a sequence is driving the camera —
  // skip all position-writing auto-motion. Lens spin still runs.
  if (userInteractingWithCamera || sequencePlaying || sequenceRenderActive) {
    if (state.lensSpin) {
      const spinRad = state.lensSpin * Math.PI / 180 * dt;
      if (lensMesh) lensMesh.rotation.z += spinRad;
      if (lensMeshB) lensMeshB.rotation.z += spinRad;
    }
    return;
  }
  if (state.autoOrbit) {
    const rel = camera.position.clone().sub(controls.target);
    const radius = rel.length();
    if (orbitHomeAzimuth === null) {
      orbitHomeAzimuth = Math.atan2(rel.x, rel.z);
      orbitHomeElevation = Math.asin(rel.y / Math.max(0.001, radius));
      orbitPhase = 0;
    }
    orbitPhase += dt * state.orbitSpeed;
    // Sway ±orbitArc° around the starting azimuth, with gentler vertical bob.
    const azArc = (state.orbitArc * Math.PI) / 180;
    const elArc = azArc * 0.28;
    const azimuth = orbitHomeAzimuth + azArc * Math.sin(orbitPhase * Math.PI * 2);
    const elevation = orbitHomeElevation + elArc * Math.sin(orbitPhase * Math.PI * 2 * elFreq);
    const planar = radius * Math.cos(elevation);
    camera.position.x = controls.target.x + planar * Math.sin(azimuth);
    camera.position.z = controls.target.z + planar * Math.cos(azimuth);
    camera.position.y = controls.target.y + radius * Math.sin(elevation);
  } else {
    orbitHomeAzimuth = null;
  }
  if (state.autoZoom) {
    const curDist = camera.position.distanceTo(controls.target);
    if (zoomBaseDist === null) zoomBaseDist = curDist;
    zoomPhase += dt * state.zoomSpeed;
    const target = zoomBaseDist * (1 + state.zoomAmount * Math.sin(zoomPhase * Math.PI * 2));
    const ratio = target / Math.max(0.001, curDist);
    const dir = camera.position.clone().sub(controls.target);
    dir.multiplyScalar(ratio);
    camera.position.copy(controls.target).add(dir);
  } else {
    zoomBaseDist = null;
  }
  if (state.autoPan) {
    // Gentle vertical sway — lifts and drops the camera around its current height.
    // Uses the current camera-to-target distance so the effect scales with framing.
    panPhase += dt * state.panSpeed;
    const dist = camera.position.distanceTo(controls.target);
    const dy = dist * state.panAmount * Math.sin(panPhase * Math.PI * 2);
    // Apply as an offset above the current height — reset each frame so it doesn't drift.
    camera.position.y += dy - (updateCameraMotion._lastPanDy || 0);
    updateCameraMotion._lastPanDy = dy;
  } else if (updateCameraMotion._lastPanDy) {
    // Undo the last pan offset so disabling returns to the natural height.
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
    panPhase = 0;
  }
  if (state.autoOrbit || state.autoZoom || state.autoPan) camera.lookAt(controls.target);

  // Lens spin — rotate the lens mesh (and its B twin) around its Z axis.
  if (state.lensSpin) {
    const spinRad = state.lensSpin * Math.PI / 180 * dt;
    if (lensMesh) lensMesh.rotation.z += spinRad;
    if (lensMeshB) lensMeshB.rotation.z += spinRad;
  }
}

// --- video recording ---
let mediaRecorder = null;
let recordedChunks = [];
let recTimer = null;
let recStartMs = 0;
// Offscreen canvas used when exporting at a non-native aspect ratio (Instagram etc.)
const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');
let recUsesOffscreen = false;

function pickMime() {
  const candidates = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

function drawRecFrame() {
  if (!recUsesOffscreen) return;
  const src = renderer.domElement;
  const sw = src.width, sh = src.height;
  const dw = recCanvas.width, dh = recCanvas.height;
  if (!sw || !sh) return;
  const sAR = sw / sh, dAR = dw / dh;
  let cx, cy, cw, ch;
  if (sAR > dAR) {
    // source wider than target → crop sides
    ch = sh;
    cw = sh * dAR;
    cx = (sw - cw) / 2;
    cy = 0;
  } else {
    // source taller → crop top/bottom
    cw = sw;
    ch = sw / dAR;
    cx = 0;
    cy = (sh - ch) / 2;
  }
  recCtx.drawImage(src, cx, cy, cw, ch, 0, 0, dw, dh);
  drawWatermark(recCtx, dw, dh);
}

function drawWatermark(ctx, w, h) {
  const text = (state.watermarkText || '').trim();
  if (!text) return;
  const pad = Math.max(18, Math.round(Math.min(w, h) * 0.02));
  const fontPx = Math.max(14, Math.round(Math.min(w, h) * 0.022));
  ctx.save();
  ctx.font = `500 ${fontPx}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(text, pad + 1, h - pad + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText(text, pad, h - pad);
  ctx.restore();
}

function startRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  const dims = getRecDims();
  let streamSource;
  if (dims) {
    recCanvas.width = dims[0];
    recCanvas.height = dims[1];
    recCtx.fillStyle = '#000';
    recCtx.fillRect(0, 0, dims[0], dims[1]);
    recUsesOffscreen = true;
    streamSource = recCanvas;
  } else {
    recUsesOffscreen = false;
    streamSource = renderer.domElement;
  }
  const fps = Math.max(12, Math.min(60, state.recFps | 0 || 30));
  const stream = streamSource.captureStream(fps);
  const mimeType = pickMime();
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16_000_000 });
  } catch (e) {
    try { mediaRecorder = new MediaRecorder(stream); }
    catch (err) { setStatus('recording not supported in this browser'); recUsesOffscreen = false; return; }
  }
  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const tag = state.recAspect.replace(/\s+/g, '_').replace(/[:]/g, 'x');
    a.download = `prismatica_${tag}_${Date.now()}.webm`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    setStatus(`video saved (${(blob.size / 1048576).toFixed(1)} MB · ${state.recAspect})`);
    recUsesOffscreen = false;
  };
  mediaRecorder.start(250);
  recStartMs = performance.now();
  if (recTimer) clearInterval(recTimer);
  recTimer = setInterval(() => {
    const s = ((performance.now() - recStartMs) / 1000).toFixed(1);
    setStatus(`● recording ${state.recAspect} — ${s}s (click again to stop)`);
  }, 250);
}
function stopRecording() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}
function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  else {
    if (animPaused) setAnimPaused(false);  // auto-resume so we record a live frame
    startRecording();
  }
}

  } else {

      state.renderSmooth = ecoPreEcoSnapshot.renderSmooth;

const roBarFill = document.getElementById('roBarFill');

function updateRenderOverlay({ frame, totalFrames, elapsedMs, W, H, fps }) {

  const elapsed = elapsedMs / 1000;

function hideRenderOverlay() {

}
async function renderOffline(opts = {}) {
  if (offlineInProgress) return;
  if (typeof VideoEncoder === 'undefined') { setStatus('WebCodecs not supported in this browser'); return; }

  // Sequence mode: drive the camera from the shot sequence instead of auto-motion.
  // Total duration comes from the sequence itself, overriding state.recDuration.
  const useSequence = !!opts.sequence && shotSequence.length >= 1;
  if (opts.sequence && shotSequence.length < 1) {
    setStatus('add at least 1 shot to the sequence before exporting');
    return;
  }

  const fps      = Math.max(12, Math.min(60, state.recFps | 0 || 30));
  const duration = useSequence
    ? Math.max(0.1, sequenceTotalDuration())
    : Math.max(1, Math.min(120, state.recDuration | 0 || 10));
  const totalFrames = Math.max(1, Math.round(fps * duration));

  // MAX QUALITY OVERRIDE — when on, ignore user's preview settings and crank everything
  // up for the export. Live-view quality stays low (fast preview) but exports are gallery-grade.
  // Note: user now picks resolution explicitly via recResolution dropdown, so maxQ no longer
  // upscales dims — it only forces SSAA, transmission, and panel smoothing.
  const maxQ = !!state.maxQualityExport;

  const dims = getRecDims();
  let W, H, useOffscreen;
  if (dims) { W = dims[0]; H = dims[1]; useOffscreen = true; }
  else      { W = renderer.domElement.width; H = renderer.domElement.height; useOffscreen = false; }
  // H.264 requires even dimensions
  W = W & ~1; H = H & ~1;

  // Supersample factor — render at ssaa×output then downscale for clean edges.
  const ssaaMap = { 'off (fast)': 1, '2× (clean)': 2, '3× (pristine)': 3 };
  const userSsaa = ssaaMap[state.renderSmooth] || 1;
  const ssaa = maxQ ? Math.max(userSsaa, 3) : userSsaa;  // max-q forces ≥3×
  const renderW = (W * ssaa) & ~1;
  const renderH = (H * ssaa) & ~1;

  let Muxer, ArrayBufferTarget;
  {
    const sources = [
      'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm',
      'https://esm.sh/mp4-muxer@5.2.2',
      'https://esm.sh/mp4-muxer',
      'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.mjs',
    ];
    let lastErr = null;
    for (const src of sources) {
      try {
        const mod = await import(src);
        Muxer = mod.Muxer; ArrayBufferTarget = mod.ArrayBufferTarget;
        if (Muxer && ArrayBufferTarget) { lastErr = null; break; }
        lastErr = new Error('module missing Muxer / ArrayBufferTarget');
      } catch (e) { lastErr = e; }
    }
    if (!Muxer || !ArrayBufferTarget) {
      setStatus('mp4-muxer failed to load: ' + (lastErr ? lastErr.message : 'unknown'));
      return;
    }
  }

  // Pick an AVC profile that supports the target resolution.
  // Max coded area (macroblocks) per H.264 level:
  //   4.0 → 8,192   (1920×1088)
  //   4.1 → 8,192
  //   4.2 → 8,704
  //   5.0 → 22,080
  //   5.1 → 36,864  (4096×2304)
  //   5.2 → 36,864  (allows higher fps)
  //   6.0 → 139,264 (8K)
  //   6.2 → 139,264
  const pickAvcLevel = (w, h) => {
    const mbs = Math.ceil(w / 16) * Math.ceil(h / 16);
    if (mbs <= 8192)   return 'avc1.640028'; // 4.0  → 1080p
    if (mbs <= 22080)  return 'avc1.640032'; // 5.0  → ~2560×1440
    if (mbs <= 36864)  return 'avc1.640034'; // 5.2  → 4K
    return 'avc1.64003E';                    // 6.2  → 8K

  const AVC_LADDER = ['avc1.640028','avc1.640032','avc1.640034','avc1.64003E'];
  let codec = pickAvcLevel(W, H);
  const startIdx = AVC_LADDER.indexOf(codec);
  // Bitrate scales with pixels × fps. Target ~0.12 bits/pixel/frame — high quality without being wasteful.
  // Clamp to [12 Mbps, 120 Mbps] so small renders aren't starved and 8K doesn't blow out.
  const targetBitrate = Math.round(Math.max(12_000_000, Math.min(120_000_000, W * H * fps * 0.12)));
  for (let i = Math.max(0, startIdx); i < AVC_LADDER.length; i++) {
    try {
      const sup = await VideoEncoder.isConfigSupported({ codec: AVC_LADDER[i], width: W, height: H, bitrate: targetBitrate, framerate: fps });
      if (sup && sup.supported) { codec = AVC_LADDER[i]; break; }
    } catch (_) { /* try next */ }
  }

  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: fps },
    fastStart: 'in-memory',
  });

  let encodeError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encodeError = e; console.error(e); },
  });
  try {
    encoder.configure({
      codec,
      width: W,
      height: H,
      bitrate: targetBitrate,
      framerate: fps,
      latencyMode: 'quality',
    });

  // Setup offscreen canvas for aspect crop + SSAA downscale
  if (useOffscreen) {
    recCanvas.width = W; recCanvas.height = H; recUsesOffscreen = true;
    recCtx.imageSmoothingEnabled = true;
    recCtx.imageSmoothingQuality = 'high';
