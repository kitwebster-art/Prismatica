  }

  const fps      = Math.max(12, Math.min(60, state.recFps | 0 || 30));
  const duration = useSequence
    ? Math.max(0.1, sequenceTotalDuration())
    : Math.max(1, Math.min(120, state.recDuration | 0 || 10));
  const totalFrames = Math.max(1, Math.round(fps * duration));

  // MAX QUALITY OVERRIDE — when on, ignore user's preview settings and crank everything
  // up for the export. Live-view quality stays low (fast preview) but exports are gallery-grade.
  // Note: user now picks resolution explicitly via recResolution dropdown, so maxQ no longer
  // upscales dims — it only forces SSAA, transmission, and panel smoothing.
  const maxQ = !!state.maxQualityExport;

  const dims = getRecDims();
  let W, H, useOffscreen;
  if (dims) { W = dims[0]; H = dims[1]; useOffscreen = true; }
  else      { W = renderer.domElement.width; H = renderer.domElement.height; useOffscreen = false; }
  // For non-native renders, getRecDims() already returns multiples of 16.
  // For native renders, W/H come from renderer.domElement — floor to even
  // (H.264 minimum alignment). Native renders never glitch so ~1 is sufficient.
  W = W & ~1; H = H & ~1;

  // Eco render — combines (a) a pause after each frame so the OS can run other
  // apps and (b) a per-frame GPU-load reduction so the pause actually translates
  // into headroom. Declared up here so it can influence the SSAA + transmission
  // decisions below. The pause is read from state EVERY frame so flipping the
  // dropdown mid-render takes effect immediately.
  const ECO_PAUSE = { off: 0, light: 60, 'half-speed': 150, gentle: 320 };
  const ecoActive = state.ecoRender && state.ecoRender !== 'off';

  // Supersample factor — render at ssaa×output then downscale for clean edges.
  // Eco render forces SSAA to 1× regardless of user setting / max-Q so per-frame
  // GPU load drops dramatically. Combined with the inter-frame pause this gives
  // a real laptop-friendly render. (Output resolution and quality of the lens
  // simulation itself are unchanged — only the supersample multiplier is dropped.)
  const ssaaMap = { 'off (fast)': 1, '2× (clean)': 2, '3× (pristine)': 3, '4× (gallery)': 4 };
  const userSsaa = ssaaMap[state.renderSmooth] || 1;
  // max-q no longer forces a minimum SSAA — it controls transmission quality and panel
  // smoothing only. SSAA is fully user-controlled via the smoothing dropdown. This prevents
  // max-q silently overriding a deliberate "off" setting with an expensive 3× render.
  let ssaa = userSsaa;
  if (ecoActive) ssaa = 1;
  const renderW = (W * ssaa) & ~1;
  const renderH = (H * ssaa) & ~1;

  // Motion blur — render N sub-frames per output frame at slightly different
  // times and average them. Big quality win on sequence exports with camera
  // moves: the silky smear of the transition reads as proper cinematic motion
  // blur rather than a jerk between discrete steps. 1 = off (default).
  const mbSamples = Math.max(1, state.motionBlurSamples | 0);
  const motionBlurOn = mbSamples > 1;

  let Muxer, ArrayBufferTarget;
  {
    const sources = [
      'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm',
      'https://esm.sh/mp4-muxer@5.2.2',
      'https://esm.sh/mp4-muxer',
      'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.mjs',
    ];
    let lastErr = null;
    for (const src of sources) {
      try {
        const mod = await import(src);
        Muxer = mod.Muxer; ArrayBufferTarget = mod.ArrayBufferTarget;
        if (Muxer && ArrayBufferTarget) { lastErr = null; break; }
        lastErr = new Error('module missing Muxer / ArrayBufferTarget');
      } catch (e) { lastErr = e; }
    }
    if (!Muxer || !ArrayBufferTarget) {
      setStatus('mp4-muxer failed to load: ' + (lastErr ? lastErr.message : 'unknown'));
      return;
    }
  }

  // Pick an AVC profile that supports the target resolution.
  // Max coded area (macroblocks) per H.264 level:
  //   4.0 → 8,192   (1920×1088)
  //   4.1 → 8,192
  //   4.2 → 8,704
  //   5.0 → 22,080
  //   5.1 → 36,864  (4096×2304)
  //   5.2 → 36,864  (allows higher fps)
  //   6.0 → 139,264 (8K)
  //   6.2 → 139,264
  const pickAvcLevel = (w, h) => {
    const mbs = Math.ceil(w / 16) * Math.ceil(h / 16);
    if (mbs <= 8192)   return 'avc1.640028'; // 4.0  → 1080p
    if (mbs <= 22080)  return 'avc1.640032'; // 5.0  → ~2560×1440
    if (mbs <= 36864)  return 'avc1.640034'; // 5.2  → 4K
    return 'avc1.64003E';                    // 6.2  → 8K
  };
  // Walk up from the suggested codec until we find one the browser will accept.
  const AVC_LADDER = ['avc1.640028','avc1.640032','avc1.640034','avc1.64003E'];
  let codec = pickAvcLevel(W, H);
  const startIdx = AVC_LADDER.indexOf(codec);
  // Bitrate scales with pixels × fps. Target ~0.12 bits/pixel/frame — high quality without being wasteful.
  // Clamp to [12 Mbps, 120 Mbps] so small renders aren't starved and 8K doesn't blow out.
  const targetBitrate = Math.round(Math.max(12_000_000, Math.min(120_000_000, W * H * fps * 0.12)));
  for (let i = Math.max(0, startIdx); i < AVC_LADDER.length; i++) {
    try {
      const sup = await VideoEncoder.isConfigSupported({ codec: AVC_LADDER[i], width: W, height: H, bitrate: targetBitrate, framerate: fps });
      if (sup && sup.supported) { codec = AVC_LADDER[i]; break; }
    } catch (_) { /* try next */ }
  }

  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: fps },
    fastStart: 'in-memory',
  });

  let encodeError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { encodeError = e; console.error(e); },
  });
  try {
    encoder.configure({
      codec,
      width: W,
      height: H,
      bitrate: targetBitrate,
      framerate: fps,
      latencyMode: 'quality',
    });
  } catch (e) { setStatus('encoder config failed: ' + e.message); return; }

  // Setup offscreen canvas for aspect crop + SSAA downscale.
  // ALWAYS route through recCanvas — even for native-ratio no-SSAA renders.
  // Reason: creating VideoFrame directly from renderer.domElement (a WebGL
  // canvas) can race with the GPU command queue on some Chrome/driver combos:
  // composer.render() submits GPU work asynchronously, and VideoFrame(canvas)
  // may read the canvas before the GPU has finished writing to it, producing
  // stale or partial pixels on random frames. Routing through recCanvas forces
  // Chrome to composite the WebGL surface into a CPU-accessible 2D buffer first
  // (drawImage from a WebGL canvas triggers proper GPU→compositor sync), so the
  // VideoFrame always sees a fully-rendered frame. For a 1:1 native render the
  // drawImage is a trivial blit with no visual difference.
  recCanvas.width = W; recCanvas.height = H; recUsesOffscreen = true;
  recCtx.imageSmoothingEnabled = true;
  recCtx.imageSmoothingQuality = 'high';

  // Save / suspend live state
  offlineInProgress = true;
  // Auto-pause live animation while the render runs — keeps the browser snappy.
  if (!animPaused) { setAnimPaused(true); autoPausedForRender = true; }
  // Hide canvas + GUI behind a static overlay during the render. Kills compositor
  // work on a huge canvas (big win at 4K/8K) and gives the user a clean progress UI.
  showRenderOverlay({ W, H, fps, totalFrames, mode: useSequence ? 'sequence' : 'normal' });

  // Supersample: resize renderer/composer to ssaa×output. Camera aspect matches
  // the OUTPUT aspect so framing is identical to preview, just at higher pixel
  // density. drawRecFrame (or for native, the H.264 encoder's internal scale)
  // does the high-quality downsample into the final W×H frame.
  const savedRendererW = renderer.domElement.width;
  const savedRendererH = renderer.domElement.height;
  const savedPixelRatio = renderer.getPixelRatio();
  const savedCamAspect = camera.aspect;
  const savedTransmissionScale = renderer.transmissionResolutionScale;
  const savedPanelSmooth = ledMat.uniforms.uPanelSmooth.value;
  // Max-quality override forces the heaviest transmission RT for glass realism,
  // and always enables panel anti-aliasing (kills scan-line moiré on exports).
  if (maxQ) {
    renderer.transmissionResolutionScale = 1.0;
    ledMat.uniforms.uPanelSmooth.value = 1;
    ledMatB.uniforms.uPanelSmooth.value = 1;
  }
  // Eco render: drop the transmission RT resolution to lighten the most
  // expensive pass. Halves transmission cost vs default 1.0.
  if (ecoActive) {
    renderer.transmissionResolutionScale = 0.5;
  }
  // Supersample dispersion is OPT-IN ONLY. It supersamples the transmission RT
  // to 2× viewport for sharper rainbow fringes — but it can cause rendering
  // glitches on some setups, so it's off by default and isn't pulled in by maxQ.
  if (state.superDispersion && !ecoActive) {
    renderer.transmissionResolutionScale = 2.0;
  }
  const outputAspect = W / H;
  if (useOffscreen) {
    renderer.setPixelRatio(1);
    renderer.setSize(renderW, renderH, false);
    composer.setPixelRatio(1);
    composer.setSize(renderW, renderH);
    bloomPass.setSize(renderW, renderH);
    syncLookResolution(renderW, renderH);
    camera.aspect = outputAspect;
    camera.updateProjectionMatrix();
  } else if (ssaa > 1) {
    // Native aspect: render above target, drawImage to recCanvas for downscale.
    recCanvas.width = W; recCanvas.height = H;
    recCtx.imageSmoothingEnabled = true;
    recCtx.imageSmoothingQuality = 'high';
    recUsesOffscreen = true;
    renderer.setPixelRatio(1);
    renderer.setSize(renderW, renderH, false);
    composer.setPixelRatio(1);
    composer.setSize(renderW, renderH);
    bloomPass.setSize(renderW, renderH);
    syncLookResolution(renderW, renderH);
    camera.aspect = outputAspect;
    camera.updateProjectionMatrix();
  }
  const savedTime = ledMat.uniforms.uTime.value;
  const savedTimeB = ledMatB.uniforms.uTime.value;
  const savedSpinA = lensMesh ? lensMesh.rotation.z : 0;
  const savedSpinB = lensMeshB ? lensMeshB.rotation.z : 0;
  // Remember live camera pose so we can restore it after a sequence render (so the
  // on-screen view doesn't jump to the last sequence pose when the export finishes).
  const savedCamPose = {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
    zoom: camera.zoom,
  };
  // Reset motion phases so offline render sways around the user's current vantage
  orbitHomeAzimuth = null; orbitPhase = 0;
  zoomBaseDist = null; zoomPhase = 0;
  panPhase = 0; updateCameraMotion._lastPanDy = 0;
  // In sequence mode, updateCameraMotion is bypassed — pose is driven by evaluateSequenceAt.
  if (useSequence) { sequenceRenderActive = true; stopSequencePreview(); }

  // Loop mode: respect the user's dialled-in speeds. We only sync the elevation
  // frequency to the azimuth frequency (via loopCameraMode) so the vertical bob
  // doesn't desync. For a seamless loop the user should pick speeds so that
  // speed × duration is ~integer; we surface the cycle counts so they can tune.
  const savedOrbitSpeed = state.orbitSpeed;
  const savedZoomSpeed  = state.zoomSpeed;
  const savedPanSpeed   = state.panSpeed;
  const savedLensSpin   = state.lensSpin;
  if (state.recLoop) {
    loopCameraMode = true;
    const cycles = {
      orbit: state.autoOrbit ? (state.orbitSpeed * duration).toFixed(2) : null,
      zoom:  state.autoZoom  ? (state.zoomSpeed  * duration).toFixed(2) : null,
      pan:   state.autoPan   ? (state.panSpeed   * duration).toFixed(2) : null,
      spin:  state.lensSpin  ? ((state.lensSpin * duration) / 360).toFixed(2) : null,
    };
    const parts = Object.entries(cycles).filter(([,v]) => v !== null).map(([k,v]) => `${k} ${v}`);
    if (parts.length) console.info('[loop cycles per clip — tune speed/duration so each is close to an integer for a seamless loop]', parts.join(' · '));
  }

  // --- Transmission render-target warm-up ----------------------------------
  // After renderer.setSize() Three.js lazily recreates the transmission RT
  // (the backbuffer the glass refraction shader samples). The RT is not fully
  // GPU-resident until the first actual render completes. If we start encoding
  // immediately, early frames sample an uninitialised buffer and produce
  // the characteristic checkerboard or aliased artefacts visible in exports.
  // Fix: render 4 un-encoded warm-up frames, then force a GPU-CPU sync via
  // gl.readPixels (a 1×1 pixel readback stalls the CPU until all pending GPU
  // work — including the transmission RT pre-pass — has fully completed).
  // This is more reliable than setTimeout for heavy SSAA renders where a
  // timer-based yield may expire before the GPU finishes the large RT.
  {
    const warmT = useSequence ? (shotSequence[0]?.time ?? 0) : 0;
    ledMat.uniforms.uTime.value  = warmT;
    ledMatB.uniforms.uTime.value = warmT;
    if (useSequence) { const p = evaluateSequenceAt(warmT); if (p) applyPose(p); }
    camera.updateMatrixWorld(true);
    for (let w = 0; w < 4; w++) {
      renderFrame(warmT);
      await new Promise(r => setTimeout(r, 8));
    }
    // GPU sync: stalls CPU until all submitted GL commands have completed.
    const _gl = renderer.getContext();
    const _syncBuf = new Uint8Array(4);
    _gl.readPixels(0, 0, 1, 1, _gl.RGBA, _gl.UNSIGNED_BYTE, _syncBuf);
  }

  // Per-frame GPU sync helper — used below for non-native renders.
  // readPixels stalls the CPU until all pending GPU commands (including the
  // OutputPass draw to the canvas) have completed. Pre-allocate once so we're
  // not creating a new Uint8Array every frame.
  const _glCtx    = renderer.getContext();
  const _glSyncBuf = new Uint8Array(4);

  const startMs = performance.now();
  offlineAbortRequested = false;
  setStatus(`rendering 0 / ${totalFrames}…`);

  // --- Helper: draw one sub-frame from renderer.domElement onto recCanvas with
  // a given accumulation alpha. Mirrors drawRecFrame's crop/scale logic but lets
  // motion blur build up an averaged frame. -----------------------------------
  function accumulateSubFrame(alpha) {
    const src = renderer.domElement;
    const sw = src.width, sh = src.height;
    const dw = recCanvas.width, dh = recCanvas.height;
    if (!sw || !sh) return;
    const sAR = sw / sh, dAR = dw / dh;
    let cx, cy, cw, ch;
    if (sAR > dAR) { ch = sh; cw = sh * dAR; cx = (sw - cw) / 2; cy = 0; }
    else           { cw = sw; ch = sw / dAR; cx = 0; cy = (sh - ch) / 2; }
    recCtx.globalAlpha = alpha;
    recCtx.drawImage(src, cx, cy, cw, ch, 0, 0, dw, dh);
  }

  for (let i = 0; i < totalFrames; i++) {
    if (offlineAbortRequested) break;
    const t = i / fps;
    let src;

    if (motionBlurOn) {
      // Average mbSamples sub-frames per output frame, evenly spaced across the
      // shutter interval [t, t + 1/fps]. Each sub-frame ticks panel time + camera
      // pose forward by a fraction of the frame duration. The resulting blur is
      // proportional to per-frame motion — fast camera moves smear, static
      // shots stay sharp. Dramatically improves cinematic feel on sequences.
      recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
      const subDt = 1 / (fps * mbSamples);
      const alpha = 1 / mbSamples;
      for (let s = 0; s < mbSamples; s++) {
        if (offlineAbortRequested) break;
        const subT = t + (s + 0.5) / (fps * mbSamples);
        ledMat.uniforms.uTime.value  = subT;
        ledMatB.uniforms.uTime.value = subT;
        if (useSequence) {
          const pose = evaluateSequenceAt(subT);
          if (pose) applyPose(pose);
        } else {
          updateCameraMotion(subDt);
        }
        camera.updateMatrixWorld(true);
        renderFrame(subT);
        accumulateSubFrame(alpha);
      }
      recCtx.globalAlpha = 1.0;
      drawWatermark(recCtx, recCanvas.width, recCanvas.height);
      src = recCanvas;
    } else {
      ledMat.uniforms.uTime.value  = t;
      ledMatB.uniforms.uTime.value = t;
      if (useSequence) {
        const pose = evaluateSequenceAt(t);
        if (pose) applyPose(pose);
      } else {
        updateCameraMotion(1 / fps);
      }
      camera.updateMatrixWorld(true);
      renderFrame(t);
      // recUsesOffscreen is always true (set in render setup above), so we
      // always drawRecFrame → recCanvas → VideoFrame. For non-native renders
      // (useOffscreen=true) where renderer.setSize() was called, Chrome
      // allocates a new canvas IOSurface — drawImage can race the GPU command
      // queue and read stale pixels on some frames (intermittent grey squares).
      // Force a CPU stall via readPixels so the IOSurface is fully written before
      // drawImage reads it. Native renders (useOffscreen=false) use the same
      // long-lived canvas from live view; no sync needed there.
      if (useOffscreen) {
        _glCtx.readPixels(0, 0, 1, 1, _glCtx.RGBA, _glCtx.UNSIGNED_BYTE, _glSyncBuf);
      }
      if (recUsesOffscreen) { drawRecFrame(); src = recCanvas; } else { src = renderer.domElement; }
    }

    let frame;
    try {
      frame = new VideoFrame(src, { timestamp: Math.round(t * 1_000_000) });
    } catch (e) { setStatus('VideoFrame failed: ' + e.message); break; }
    const keyFrame = (i % fps) === 0;
    try {
      encoder.encode(frame, { keyFrame });
    } catch (e) {
      encodeError = e;
      try { frame.close(); } catch (_) {}
      break;
    }
    frame.close();

    // Backpressure: wait for the encoder queue to drain below a safe threshold
    // before queueing more frames. This prevents GPU/encoder buildup at heavy SSAA.
    // When the tab is hidden Chrome throttles setTimeout to ≥1s — use a tight
    // spin-check (no yield) in that case so background renders aren't penalised.
    const queueLimit = Math.max(4, Math.min(fps, 12));
    let waitGuard = 0;
    while (encoder.encodeQueueSize > queueLimit && encoder.state !== 'closed' && !encodeError && !offlineAbortRequested && waitGuard < 1000) {
      if (!document.hidden) await new Promise(r => setTimeout(r, 8));
      waitGuard++;
    }
    if (offlineAbortRequested) break;

    if (i % 3 === 0 || i === totalFrames - 1) {
      const pct = ((i + 1) / totalFrames * 100).toFixed(0);
      const elapsed = (performance.now() - startMs) / 1000;
      const eta = elapsed / (i + 1) * (totalFrames - i - 1);
      const livePause = ECO_PAUSE[state.ecoRender] || 0;
      setStatus(`rendering ${i + 1}/${totalFrames} · ${pct}% · eta ${eta.toFixed(0)}s${state.recLoop ? ' · loop' : ''}${livePause ? ` · 🌱 eco (${state.ecoRender})` : ''}`);
      updateRenderOverlay({ frame: i + 1, totalFrames, elapsedMs: performance.now() - startMs, W, H, fps });
      // Only yield for UI updates when the tab is visible — background renders
      // skip this entirely so Chrome's timer throttling doesn't stall them.
      if (!document.hidden) await new Promise(r => setTimeout(r, 0));
    }
    if (encodeError) break;
    // Eco render — pause between frames so the OS can run other apps. Read
    // state.ecoRender live every frame so flipping the dropdown mid-render
    // takes effect immediately on the very next frame.
    const pauseMs = ECO_PAUSE[state.ecoRender] || 0;
    if (pauseMs > 0) {
      await new Promise(r => setTimeout(r, pauseMs));
    }
    // Pause support — spin here at 100ms ticks until the user resumes or aborts.
    while (offlineRenderPaused && !offlineAbortRequested) {
      await new Promise(r => setTimeout(r, 100));
    }
    if (offlineAbortRequested) break;
  }

  // Only flush + finalize if encoder is still alive; a codec error above closes it.
  // On abort, skip flush+finalize — we discard the partial output.
  const encoderOk = encoder.state !== 'closed' && !encodeError && !offlineAbortRequested;
  if (encoderOk) {
    try { await encoder.flush(); } catch (e) { encodeError = e; console.error(e); }
  }
  try { if (encoder.state !== 'closed') encoder.close(); } catch (e) { /* already closed */ }
  if (!encodeError && !offlineAbortRequested) {
    try { muxer.finalize(); } catch (e) { encodeError = e; console.error(e); }
  }

  // Restore realtime state
  ledMat.uniforms.uTime.value  = savedTime;
  ledMatB.uniforms.uTime.value = savedTimeB;
  if (lensMesh)  lensMesh.rotation.z  = savedSpinA;
  if (lensMeshB) lensMeshB.rotation.z = savedSpinB;
  state.orbitSpeed = savedOrbitSpeed;
  state.zoomSpeed  = savedZoomSpeed;
  state.panSpeed   = savedPanSpeed;
  state.lensSpin   = savedLensSpin;
  orbitHomeAzimuth = null; zoomBaseDist = null;
  recUsesOffscreen = false;
  offlineInProgress = false;
  loopCameraMode = false;
  // If this was a sequence render, restore the live camera pose so the on-screen
  // view doesn't jump to wherever the last sequence frame landed.
  if (sequenceRenderActive) {
    sequenceRenderActive = false;
    camera.position.set(savedCamPose.px, savedCamPose.py, savedCamPose.pz);
    controls.target.set(savedCamPose.tx, savedCamPose.ty, savedCamPose.tz);
    camera.zoom = savedCamPose.zoom;
    camera.updateProjectionMatrix();
    controls.update();
  }
  // Restore renderer/composer/camera to live viewport
  renderer.setPixelRatio(savedPixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.transmissionResolutionScale = savedTransmissionScale;
  ledMat.uniforms.uPanelSmooth.value = savedPanelSmooth;
  ledMatB.uniforms.uPanelSmooth.value = savedPanelSmooth;
  composer.setPixelRatio(savedPixelRatio);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
  syncLookResolution(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  if (offlineAbortRequested) {
    offlineAbortRequested = false;
    if (autoPausedForRender) { animPaused = false; clock.getDelta(); autoPausedForRender = false; guiRefresh(); }
    hideRenderOverlay();
    setStatus('render stopped');
    return;
  }
  if (encodeError) {
    if (autoPausedForRender) { animPaused = false; clock.getDelta(); autoPausedForRender = false; guiRefresh(); }
    hideRenderOverlay();
    setStatus('offline render failed — see console');
    return;
  }

  const buffer = muxer.target.buffer;
  const blob = new Blob([buffer], { type: 'video/mp4' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const tag = state.recAspect.replace(/\s+/g, '_').replace(/:/g, 'x');
  a.download = `prismatica_offline_${tag}_${W}x${H}_${fps}fps_${Date.now()}.mp4`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  // Resume live animation BEFORE the final status message so the save message isn't overwritten.
  if (autoPausedForRender) { animPaused = false; clock.getDelta(); autoPausedForRender = false; guiRefresh(); }
  hideRenderOverlay();
  const smoothTag = ssaa > 1 ? ` · SSAA ${ssaa}×` : '';
  const maxTag = maxQ ? ' · max-Q' : '';
  const mbps = (targetBitrate / 1_000_000).toFixed(0);
  setStatus(`offline render saved · ${W}×${H} · ${duration}s @ ${fps}fps${smoothTag}${maxTag} · ${mbps} Mbps · ${(blob.size / 1048576).toFixed(1)} MB`);
}

function animate() {
  if (offlineInProgress) {
    // Throttle to ~5Hz during offline render — live loop has nothing to do.
    state.fpsText = 'rendering…';
    setTimeout(() => requestAnimationFrame(animate), 200);
    return;
  }
  if (animPaused) {
    // Keep the loop alive at a low cadence so resume is instant, but skip all
    // shader/motion/render work so the GPU + CPU stay quiet.
    state.fpsText = 'paused';
    setTimeout(() => requestAnimationFrame(animate), 200);
    return;
  }
  const dt = clock.getDelta();
  ledMat.uniforms.uTime.value  += dt;
  ledMatB.uniforms.uTime.value += dt;
  // Sequence preview: drive the camera through the storyboard in real time.
  if (sequencePlaying) {
    const elapsed = (performance.now() - sequenceStartMs) / 1000;
    const total = sequenceTotalDuration();
    if (elapsed >= total) {
      // Park on the final shot, then stop preview.
      const last = shotSequence[shotSequence.length - 1];
      if (last) applyPose(last.pose);
      sequencePlaying = false;
      setBtnActive(seqPlayBtnCtrl, false, { labelOn: '✓ playing — stop  [Enter]', labelOff: '▶ preview sequence  [Enter]' });
      setStatus('sequence preview complete');
    } else {
      const pose = evaluateSequenceAt(elapsed);
      if (pose) applyPose(pose);
    }
  }
  updateCameraMotion(dt);
  controls.update();
  renderFrame();
  if (recUsesOffscreen && mediaRecorder && mediaRecorder.state === 'recording') drawRecFrame();
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLast > 500) {
    const fps = (fpsFrames * 1000) / (now - fpsLast);
    state.fpsText = `${fps.toFixed(0)} fps`;
    fpsFrames = 0; fpsLast = now;
  }
  requestAnimationFrame(animate);
}
animate();

// Always start with eco mode ON so the laptop stays cool on launch. Deferred
// via queueMicrotask so it runs AFTER the rest of the module (specifically
// after `let ecoModeActive` initialises further up). Without this defer we'd
// hit a temporal-dead-zone ReferenceError and the app would render a black
// screen on load. User can press E or click the floating ⚡ eco button to flip
// it off when they want full live-view quality.
queueMicrotask(() => {
  try { if (!ecoModeActive) toggleEcoMode(); } catch (e) { console.warn('eco-on at startup skipped:', e); }
});

// -------------------------------------------------------------------------
// Keyboard shortcuts  (H hide UI · F fullscreen · R record · Space auto-orbit
// · B toggle bloom · 1-9 load numeric preset · Esc stop recording)
// -------------------------------------------------------------------------
let uiHidden = false;
function setUIHidden(hide) {
  uiHidden = hide;
  gui.domElement.style.display = hide ? 'none' : '';
  document.getElementById('hud').style.display = hide ? 'none' : '';
  statusEl.style.display = hide ? 'none' : '';
  fpsEl.style.display = hide ? 'none' : '';
  aspectOverlay.style.visibility = hide ? 'hidden' : '';
}
window.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
  // Shift+1..9 jumps to shot N in the sequence (no transition, pure snap).
  // Checked BEFORE the meta/ctrl/alt guard so shift-combos work, and BEFORE the
  // digit-only preset check so it wins over preset loading.
  if (e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && /^Digit[1-9]$/.test(e.code)) {
    const n = parseInt(e.code.slice(5));
    if (n <= shotSequence.length) { loadShotPose(n - 1); e.preventDefault(); return; }
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'h' || k === 'H') { setUIHidden(!uiHidden); e.preventDefault(); }
  else if (k === 'f' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
    e.preventDefault();
  }
  else if (k === 'r' || k === 'R') { toggleRecording(); e.preventDefault(); }
  else if (k === 'p' || k === 'P') { setAnimPaused(!animPaused); e.preventDefault(); }
  else if (k === 'e' || k === 'E') { toggleEcoMode(); e.preventDefault(); }
  else if (k === 'n' || k === 'N') { addShotToSequence(); e.preventDefault(); }
  else if (k === 'Enter') {
    if (sequencePlaying) stopSequencePreview();
    else playSequencePreview();
    e.preventDefault();
  }
  else if (k === 'b' || k === 'B') {
    state.bloomEnabled = !state.bloomEnabled;
    syncBloom(); guiRefresh();
    setStatus(`bloom ${state.bloomEnabled ? 'on' : 'off'}`);
    e.preventDefault();
  }
  else if (k === ' ') {
    state.autoOrbit = !state.autoOrbit;
    orbitHomeAzimuth = null;
    guiRefresh();
    setStatus(`auto orbit ${state.autoOrbit ? 'on' : 'off'}`);
    e.preventDefault();
  }
  else if (k === 'Escape') {
    if (offlineInProgress) { abortOfflineRender(); e.preventDefault(); }
    else if (sequencePlaying) { stopSequencePreview(); e.preventDefault(); }
    else if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); e.preventDefault(); }
  }
  else if (/^[0-9]$/.test(k)) {
    const p = loadPresets()[k];
    if (p) { applyPreset(p); state.currentPreset = k; refreshPresetDropdown(); guiRefresh(); setStatus(`loaded preset "${k}"`); }
  }
});

window.__prismatica = {
  state, rebuildLenses, scene, camera, renderer, controls,
  ledMat, ledMatB, lensMaterial, lensMaterialB, LENS_TYPES,
  addShotToSequence, removeShotFromSequence, replaceShotInSequence,
  loadShotPose, clearShotSequence, moveShotInSequence,
  playSequencePreview, stopSequencePreview,
  evaluateSequenceAt, sequenceTotalDuration,
  shotSequence: () => shotSequence,
};
</script>
</body>
