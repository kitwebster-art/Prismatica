// --- Shape-view material -----------------------------------------------------
// Opaque matte "clay" with topographic colour ramp + contour lines for sense-
// checking the lens form. Toggled via the floating 🗺 shape view button. Reads
// like a topo map — gradient encodes height (cool=low, warm=high), thin dark
// lines mark every Nmm of elevation, Lambert shading shows the silhouette
// clearly. Used both for me sense-checking my own work and for sending to
// fabricators alongside the STL so they can read the geometry at a glance.
const shapeViewMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uLightDir:        { value: new THREE.Vector3(0.3, 0.6, 1.0).normalize() },
    uContourInterval: { value: 5.0 },     // mm between contour lines
    uHeightRange:     { value: 100.0 },   // mm; colour ramp spans 0..uHeightRange
  },
  vertexShader: /* glsl */`
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    uniform vec3 uLightDir;
    uniform float uContourInterval;
    uniform float uHeightRange;

    // Cool→warm 4-stop gradient. Reads as a topo map at a glance.
    vec3 heightRamp(float t) {
      t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.07, 0.12, 0.30);   // deep blue (lowest)
      vec3 c1 = vec3(0.18, 0.55, 0.65);   // teal
      vec3 c2 = vec3(0.95, 0.75, 0.30);   // warm gold
      vec3 c3 = vec3(1.00, 0.45, 0.20);   // orange (highest)
      if (t < 0.33) return mix(c0, c1, t / 0.33);
      if (t < 0.66) return mix(c1, c2, (t - 0.33) / 0.33);
      return mix(c2, c3, (t - 0.66) / 0.34);
    }

    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 L = normalize(uLightDir);
      // Lambert shading with a soft ambient floor so dark sides still read.
      float diffuse = mix(0.35, 1.0, max(0.0, dot(N, L)));

      // Height ramp colour
      float h = max(0.0, vWorldPos.z);
      vec3 base = heightRamp(h / uHeightRange);

      // Contour lines: thin dark bands at every uContourInterval mm of elevation.
      // Antialiased via fwidth on the height-derivative so lines stay clean at
      // any zoom or grazing angle.
      float bands = h / uContourInterval;
      float aa = fwidth(bands);
      float fr = abs(fract(bands) - 0.5);
      float contour = smoothstep(aa, aa * 2.5, fr);
      // Major lines every 5th contour, slightly stronger.
      float bandsMaj = h / (uContourInterval * 5.0);
      float aaMaj = fwidth(bandsMaj);
      float frMaj = abs(fract(bandsMaj) - 0.5);
      float major = smoothstep(aaMaj * 0.5, aaMaj * 2.0, frMaj);

      vec3 col = base * diffuse * (0.55 + contour * 0.45) * (0.7 + major * 0.3);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide,
});

let rebuildTimer = null;
function rebuildSoon() {
  if (rebuildTimer) cancelAnimationFrame(rebuildTimer);
  rebuildTimer = requestAnimationFrame(() => {
    rebuildTimer = null;
    rebuildLenses();
  });
}
// Wrap a lens height function so it's symmetric across X and Y. Folds the
// sampled coordinate into the first quadrant (|x|, |y|) so the four quadrants
// of the panel mirror each other. Useful for asymmetric lens types
// (teardrops, voronoi, organic_bulbs, hex_cells, logo, etc.) — radially
// symmetric lenses (ripple_field, dome) look identical with this on.
function withMirror(fn, on) {
  if (!on) return fn;
  return (x, y) => fn(Math.abs(x), Math.abs(y));
}

// Scale the lens-fn input coordinates. scale<1 zooms IN on the centre of the
// height field, stretching features outward so they fill more of the slab and
// reduce the flat margin at the edges. scale>1 compresses features inward,
// adding more flat margin around them. Applied universally to every lens type.
function withShapeScale(fn, scale) {
  if (!scale || scale === 1) return fn;
  const s = scale;
  return (x, y) => fn(x * s, y * s);
}

// Recompute the dimension overlay panel from the current state. Walks the
// lens height field at a coarse grid (4 mm step) to find peak height and
// integrate volume, so the on-screen mass estimate matches reality. Cheap —
// 22k samples for a 600×600 panel, runs only on rebuildLenses.
function updateDimensionOverlay() {
  const panel = document.getElementById('dimPanel');
  if (!panel) return;
  panel.classList.toggle('on', !!state.showDimensions);
  if (!state.showDimensions) return;
  try {
    const W = state.panelWidth, H = state.panelHeight;
    const type = LENS_TYPES[state.lensType];
    const heightFn = withShapeScale(withMirror(type.fn(state.params, W, H), state.mirrorLens), state.shapeScale);
    const step = 4.0;
    let maxZ = 0, volR = 0;
    const cell = step * step;
    for (let y = -H/2; y <= H/2; y += step) {
      for (let x = -W/2; x <= W/2; x += step) {
        const z = heightFn(x, y);
        if (z > maxZ) maxZ = z;
        if (z > 0) volR += z * cell;
      }
    }
    const baseT = state.thickness;
    const totalH = baseT + maxZ;
    const volBase = W * H * baseT;
    const massKg = ((volBase + volR) / 1e6) * 1.18 / 1000;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('dimFoot',   `${W} × ${H} mm`);
    set('dimBase',   `${baseT.toFixed(0)} mm`);
    set('dimPeak',   `${maxZ.toFixed(1)} mm`);
    set('dimTotal',  `${totalH.toFixed(1)} mm`);
    set('dimNarrow', `${baseT.toFixed(0)} mm`);
    set('dimMass',   `${massKg.toFixed(1)} kg`);
  } catch (_) { /* leave overlay stale on transient errors */ }
}

function rebuildLenses() {
  if (lensMesh) { lensMesh.geometry.dispose(); scene.remove(lensMesh); }
  const typeA = LENS_TYPES[state.lensType];
  const hA = withShapeScale(withMirror(typeA.fn(state.params, state.panelWidth, state.panelHeight), state.mirrorLens), state.shapeScale);
  const geoA = makeLensGeometry(hA, state.panelWidth, state.panelHeight, state.resolution, state.thickness, state.smoothing);
  lensMesh = new THREE.Mesh(geoA, lensMaterial);
  scene.add(lensMesh);

  // LED sits behind the flat back of the lens: lens back is at z = -thickness,
  // so LED is at z = -(thickness + gap)
  const ledZA = -(state.thickness + state.panelDistance);
  const ledZB = -(state.thicknessB + state.panelDistance);

  if (state.compare) {
    const offsetX = state.panelWidth / 2 + 40;
    lensMesh.position.set(-offsetX, 0, 0);
    ledPanel.position.set(-offsetX, 0, ledZA);
    ledPanel.geometry.dispose();
    ledPanel.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);
    ledCasing.position.set(-offsetX, 0, ledZA - 15);
    ledCasing.geometry.dispose();
    ledCasing.geometry = new THREE.BoxGeometry(state.panelWidth, state.panelHeight, 30);

    if (lensMeshB) { lensMeshB.geometry.dispose(); scene.remove(lensMeshB); }
    const typeB = LENS_TYPES[state.lensTypeB];
    const hB = withShapeScale(withMirror(typeB.fn(state.paramsB, state.panelWidth, state.panelHeight), state.mirrorLens), state.shapeScale);
    const geoB = makeLensGeometry(hB, state.panelWidth, state.panelHeight, state.resolution, state.thicknessB, state.smoothing);
    lensMeshB = new THREE.Mesh(geoB, lensMaterialB);
    lensMeshB.position.set(offsetX, 0, 0);
    scene.add(lensMeshB);

    ledPanelB.visible = true;
    ledPanelB.position.set(offsetX, 0, ledZB);
    ledPanelB.geometry.dispose();
    ledPanelB.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);
    ledCasingB.visible = true;
    ledCasingB.position.set(offsetX, 0, ledZB - 15);
    ledCasingB.geometry.dispose();
    ledCasingB.geometry = new THREE.BoxGeometry(state.panelWidth, state.panelHeight, 30);

    setStatus(`A: ${typeA.label}  ·  B: ${typeB.label}  ·  ${state.panelWidth}×${state.panelHeight} mm each`);
  } else {
    lensMesh.position.set(0, 0, 0);
    ledPanel.position.set(0, 0, ledZA);
    ledPanel.geometry.dispose();
    ledPanel.geometry = new THREE.PlaneGeometry(state.panelWidth, state.panelHeight);
    ledCasing.position.set(0, 0, ledZA - 15);
    ledCasing.geometry.dispose();
    ledCasing.geometry = new THREE.BoxGeometry(state.panelWidth, state.panelHeight, 30);
    if (lensMeshB) { scene.remove(lensMeshB); lensMeshB.geometry.dispose(); lensMeshB = null; }
    ledPanelB.visible = false;
    ledCasingB.visible = false;
    setStatus(`${typeA.label}  ·  ${state.panelWidth}×${state.panelHeight} mm  ·  ${(geoA.attributes.position.count).toLocaleString()} verts`);
  }
  syncBackdropZ();
  updateDimensionOverlay();
  // Re-apply shape view if it was active — the rebuild just gave us a fresh
  // mesh with the regular glass material, so the topo render needs to be
  // re-bound to the new mesh.
  if (state.shapeView   && typeof applyShapeView   === 'function') applyShapeView(true);
  if (state.lensHidden  && typeof applyLensHidden  === 'function') applyLensHidden(true);
}

const PRESET_KEY = 'prismatica.presets.v1';

}
function savePresets(obj) { localStorage.setItem(PRESET_KEY, JSON.stringify(obj)); }
function presetSnapshot() {
  const s = {};
  for (const k of [
    'lensType','panelWidth','panelHeight','resolution','smoothing','shapeScale','params',
    'ior','dispersion','thickness','roughness','tint',
    'panelMode','panelScale','panelSpeed','panelBrightness','panelHue','panelSat','panelDistance','pgLineWidth','pgFlow',
    'patSharp','patScale','patDetail','patDistort','patSeed','patAxis','panelContrast','mirrorPanel','mirrorLens',

    'sqGradient','sqGradA','sqGradB','sqGradC','sqGradAxis','sqGradScale','sqGradFlow',
    'bgColor','wallMaterial','wallBrightness','wallScale','envPreset','envIntensity',
    'bloomEnabled','bloomStrength','bloomRadius','bloomThreshold','lensSpin',
    'lookSaturation','lookContrast','lookVignette','lookGrain','lookSharpen','lookLutMix',
    'compare','lensTypeB','paramsB','iorB','dispersionB','thicknessB','roughnessB','tintB',
  ]) s[k] = JSON.parse(JSON.stringify(state[k]));

}
function applyPreset(p) {
  for (const k in p) state[k] = JSON.parse(JSON.stringify(p[k]));
  // Migrate older presets that predate these fields to the current defaults.
  if (!('smoothing' in p)) state.smoothing = 1;
  if (!('resolution' in p) || state.resolution > 2.5) state.resolution = 1.0;
  if (!('bgColor' in p)) state.bgColor = '#050505';
  if (!('bloomEnabled' in p)) state.bloomEnabled = false;
  if (!('pgLineWidth' in p)) state.pgLineWidth = 0.06;
  if (!('pgFlow' in p)) state.pgFlow = 0.4;
  if (!('patSharp'   in p)) state.patSharp   = 0.5;
  if (!('patScale'   in p)) state.patScale   = 1.0;
  if (!('patDetail'  in p)) state.patDetail  = 0.5;
  if (!('patDistort' in p)) state.patDistort = 0.0;
  if (!('patSeed'    in p)) state.patSeed    = 0.0;
  if (!('patAxis'    in p)) state.patAxis    = 0;
  if (!('panelContrast' in p)) state.panelContrast = 1.0;
  if (!('panelSat'      in p)) state.panelSat      = 1.0;
  if (!('shapeScale' in p)) state.shapeScale = 1.0;
  if (!('mirrorLens' in p)) state.mirrorLens = true;
  if (!('mirrorPanel' in p)) state.mirrorPanel = true;
  if (!('envPreset' in p))    state.envPreset    = 'gallery';
  if (!('envIntensity' in p)) state.envIntensity = 1.0;
  // Migrate old presets that used removed env names → gallery
  if (!['studio','gallery','spots','product'].includes(state.envPreset)) state.envPreset = 'spots';
  if (!('lookSaturation' in p)) state.lookSaturation = 1.0;
  if (!('lookContrast' in p))   state.lookContrast   = 1.0;
  if (!('lookVignette' in p))   state.lookVignette   = 0.0;
  if (!('lookGrain' in p))      state.lookGrain      = 0.0;
  if (!('lookSharpen' in p))    state.lookSharpen    = 0.0;
  if (!('lookLutMix' in p))     state.lookLutMix     = 1.0;
  // Backfill any per-lens-type params that didn't exist when this preset was saved.
  // Without this, buildParamFolders crashes if the lens added new params after the
  // preset was last saved (e.g. ripple_field gained a `step` param).
  const fillMissingParams = (lensType, paramsObj) => {
    const defs = LENS_TYPES[lensType] && LENS_TYPES[lensType].params;
    if (!defs || !paramsObj) return;
    for (const k in defs) {
      if (!(k in paramsObj)) {
        paramsObj[k] = defs[k].value;
      } else if (typeof defs[k].min === 'number' && typeof defs[k].max === 'number' &&
                 typeof paramsObj[k] === 'number' &&
                 (paramsObj[k] < defs[k].min || paramsObj[k] > defs[k].max)) {
        // Legacy values outside the current slider range get reset to the
        // current default — covers cases where a param's range was narrowed
        // (e.g. bumpSharp moved from 0.3..3 → 0..1 and the centre meaning shifted).
        paramsObj[k] = defs[k].value;
      }
    }
  };
  fillMissingParams(state.lensType, state.params);
  fillMissingParams(state.lensTypeB, state.paramsB);
  syncMaterials();
  syncShader();
  syncScene();
  syncBloom();
  buildParamFolders();
  rebuildLenses();
  guiRefresh();
}

// Snap orbit/zoom/pan/spin speeds so each completes an integer number of cycles
// over the current clip duration. Use this BEFORE an offline render with loop on
// so the motion closes seamlessly without shifting away from the user's intent.
function snapSpeedsToLoop() {
  const d = Math.max(1, state.recDuration | 0 || 10);
  const snap = (speed) => {
    if (!speed) return 0;
    const cycles = Math.max(1, Math.round(speed * d));
    return cycles / d;
  };
  const parts = [];

// --- 3D LUT loading (Adobe / Resolve .CUBE format) ---------------------------
// Parse a CUBE file's text into { size, data: Float32Array(N*N*N*4) } packed
// for a 2D strip texture of width N*N, height N. Stride is RGBA float.
function parseCubeLut(text) {
  const lines = text.split(/\r?\n/);
  let size = 0;
  const flat = [];
  for (const raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    if (line.toUpperCase().startsWith('TITLE')) continue;
    if (line.toUpperCase().startsWith('LUT_3D_SIZE')) {
      size = parseInt(line.split(/\s+/)[1], 10);
      continue;
    }
    if (line.toUpperCase().startsWith('LUT_1D_SIZE')) {
      throw new Error('1D LUTs (.cube LUT_1D_SIZE) not supported — please supply a 3D LUT.');
    }
    if (line.toUpperCase().startsWith('DOMAIN_')) continue;
    const parts = line.split(/\s+/).map(parseFloat);
    if (parts.length === 3 && parts.every(v => !isNaN(v))) {
      flat.push(parts[0], parts[1], parts[2]);
    }
  }
  if (size <= 1) throw new Error('LUT_3D_SIZE missing or invalid in CUBE file');
  const expected = size * size * size * 3;
  if (flat.length !== expected) {
    throw new Error(`CUBE data size mismatch — got ${flat.length / 3} entries, expected ${size**3}`);
  }
  // Repack from CUBE order (r fastest, then g, then b) into a 2D strip where
  // row = g, col = b*size + r. Texture is N*N wide, N tall, RGBA float.
  const N = size, N2 = N * N;
  const out = new Float32Array(N2 * N * 4);
  for (let b = 0; b < N; b++) {
    for (let g = 0; g < N; g++) {
      for (let r = 0; r < N; r++) {
        const cubeIdx = ((b * N + g) * N + r) * 3;
        const tx = b * N + r, ty = g;
        const o  = (ty * N2 + tx) * 4;
        out[o + 0] = flat[cubeIdx + 0];
        out[o + 1] = flat[cubeIdx + 1];
        out[o + 2] = flat[cubeIdx + 2];
        out[o + 3] = 1.0;
      }
    }
  }
  return { size: N, data: out };
}

function setLutTexture(lut, name) {
  if (!lookPass) return;
  // Dispose old texture if any
  const old = lookPass.uniforms.tLut.value;
  if (old && old.dispose) old.dispose();
  if (!lut) {
    lookPass.uniforms.tLut.value = null;
    lookPass.uniforms.uLutSize.value = 0;
    state.lookLutName = '';
  } else {
    const tex = new THREE.DataTexture(lut.data, lut.size * lut.size, lut.size, THREE.RGBAFormat, THREE.FloatType);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.colorSpace = THREE.NoColorSpace;
    tex.needsUpdate = true;
    lookPass.uniforms.tLut.value = tex;
    lookPass.uniforms.uLutSize.value = lut.size;
    state.lookLutName = name || '';
  }
  guiRefresh();
}

// ── Environment presets — designed to reveal acrylic curvature ──────────────
// The rule: many small discrete light sources > a few large ones.
// Small bright points produce distinct highlights that move relative to each
// other as the surface curves, making every bulge and crease readable.
// All geometry kept within ~40 units of origin (PMREM far default = 100).

function _envSpot(s, x, y, z, col, pw, r = 0.85) {
  // Emissive sphere (visible in PMREM) + matching point light.
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(r, 8, 8),
    new THREE.MeshBasicMaterial({ color: col })
  );
  dot.position.set(x, y, z);
  s.add(dot);
  const l = new THREE.PointLight(col, pw, 70);
  l.position.set(x, y, z);
  s.add(l);
}

function buildEnv() {
  if (scene.environment) scene.environment.dispose();
  const preset = state.envPreset || 'gallery';
  let envTex;

  if (preset === 'gallery') {
    // 4×4 grid of ceiling recessed spotlights — 16 distinct warm-white sources.
    // Simulates a well-lit art gallery. Each spot produces its own discrete
    // highlight on the acrylic, tracing the curvature across the surface.
    const s = new THREE.Scene();
    const roomMat = new THREE.MeshBasicMaterial({ color: 0x040406, side: THREE.BackSide });
    s.add(new THREE.Mesh(new THREE.BoxGeometry(64, 30, 64), roomMat));
    for (let xi = -1.5; xi <= 1.5; xi++) {
      for (let zi = -1.5; zi <= 1.5; zi++) {
        _envSpot(s, xi * 10, 13, zi * 10, 0xfff8f0, 14);
      }
    }
    envTex = pmrem.fromScene(s, 0.0).texture;

  } else if (preset === 'spots') {
    // Three concentric rings of small lights at different elevations.
    // The most information-dense option: 26 distinct sources from top,
    // middle, and low positions. Shows curvature in every direction.
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(
      new THREE.SphereGeometry(45, 8, 4),
      new THREE.MeshBasicMaterial({ color: 0x030303, side: THREE.BackSide })
    ));
    // Top ring: 8 bright white lights, high elevation
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      _envSpot(s, Math.cos(a) * 20, 18, Math.sin(a) * 20, 0xffffff, 22, 1.0);
    }
    // Middle ring: 12 lights, near horizon
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + 0.26; // offset so they don't align with top ring
      _envSpot(s, Math.cos(a) * 26, 4, Math.sin(a) * 26, 0xfff4e8, 16, 0.9);
    }
    // Low ring: 6 warm-accent lights below horizon
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.52;
      _envSpot(s, Math.cos(a) * 20, -13, Math.sin(a) * 20, 0xffddc0, 12, 0.8);
    }
    envTex = pmrem.fromScene(s, 0.0).texture;

  } else if (preset === 'product') {
    // Photography-style: key cluster top-left, fill cluster top-right, rim from back.
    // Mimics a professional product shoot for curved glass/acrylic objects.
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(
      new THREE.SphereGeometry(45, 8, 4),
      new THREE.MeshBasicMaterial({ color: 0x020202, side: THREE.BackSide })
    ));
    // Key softbox — cluster of 7 at top-left (simulates a large rectangular soft source)
    const keyPositions = [
      [-16, 16, -8], [-20, 14, -6], [-12, 14, -10],
      [-18, 18, -4], [-14, 18, -12], [-20, 10, -10], [-12, 10, -6],
    ];
    for (const [x, y, z] of keyPositions) _envSpot(s, x, y, z, 0xfff8f0, 18);
    // Fill — 4 lights at top-right, dimmer and cooler
    const fillPositions = [[18, 12, 0], [22, 10, -4], [16, 14, 4], [20, 8, 4]];
    for (const [x, y, z] of fillPositions) _envSpot(s, x, y, z, 0xf0f6ff, 10, 0.8);
    // Rim — 4 lights from behind and above (creates a halo on lens edges)
    const rimPositions = [[-4, 18, 20], [4, 18, 20], [-8, 14, 22], [8, 14, 22]];
    for (const [x, y, z] of rimPositions) _envSpot(s, x, y, z, 0xd0e4ff, 20, 0.9);
    // Top accent — single overhead
    _envSpot(s, 0, 24, 0, 0xffffff, 26, 1.1);
    envTex = pmrem.fromScene(s, 0.0).texture;

  } else {
    // Studio — neutral soft-box room (good for shape evaluation)
    envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  }

  scene.environment = envTex;
  // scene.environmentIntensity is the correct IBL scale lever in Three.js r155+.
  scene.environmentIntensity = (state.envIntensity != null) ? state.envIntensity : 1.0;
}

function buildSolidForExport(isB) {
  const W = state.panelWidth, H = state.panelHeight;
  const res = Math.min(state.resolution, 2.0);
  const nx = Math.max(4, Math.floor(W / res) + 1);
  const ny = Math.max(4, Math.floor(H / res) + 1);
  const type = LENS_TYPES[isB ? state.lensTypeB : state.lensType];
  const heightFn = type.fn(isB ? state.paramsB : state.params, W, H);
  const thickness = isB ? state.thicknessB : state.thickness;

  const verts = [];
  const vert = (x, y, z) => { const id = verts.length / 3; verts.push(x, y, z); return id; };
  const topIds = [], botIds = [];
  for (let i = 0; i < ny; i++) {
    const y = -H/2 + (i / (ny - 1)) * H;
    const rowT = [], rowB = [];
    for (let j = 0; j < nx; j++) {
      const x = -W/2 + (j / (nx - 1)) * W;
      rowT.push(vert(x, y, heightFn(x, y)));
    }
    for (let j = 0; j < nx; j++) {
      const x = -W/2 + (j / (nx - 1)) * W;
      rowB.push(vert(x, y, -thickness));
    }
    topIds.push(rowT); botIds.push(rowB);
  }
  const triangles = [];
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = topIds[i][j], b = topIds[i][j+1], c = topIds[i+1][j+1], d = topIds[i+1][j];
    triangles.push(a, b, c, a, c, d);
  }
  for (let i = 0; i < ny - 1; i++) for (let j = 0; j < nx - 1; j++) {
    const a = botIds[i][j], b = botIds[i][j+1], c = botIds[i+1][j+1], d = botIds[i+1][j];
    triangles.push(a, c, b, a, d, c);
  }
  for (let j = 0; j < nx - 1; j++) {
    const t1 = topIds[0][j], t2 = topIds[0][j+1], b1 = botIds[0][j], b2 = botIds[0][j+1];
    triangles.push(t1, b1, b2, t1, b2, t2);
    const ut1 = topIds[ny-1][j], ut2 = topIds[ny-1][j+1], ub1 = botIds[ny-1][j], ub2 = botIds[ny-1][j+1];
    triangles.push(ut1, ub2, ub1, ut1, ut2, ub2);
  }
  for (let i = 0; i < ny - 1; i++) {
    const t1 = topIds[i][0], t2 = topIds[i+1][0], b1 = botIds[i][0], b2 = botIds[i+1][0];
    triangles.push(t1, b2, b1, t1, t2, b2);
    const rt1 = topIds[i][nx-1], rt2 = topIds[i+1][nx-1], rb1 = botIds[i][nx-1], rb2 = botIds[i+1][nx-1];
    triangles.push(rt1, rb1, rb2, rt1, rb2, rt2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(triangles);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, lensMaterial);
}
function doExportSTL(isB) {
  try {
    setStatus(`building high-res solid for export (${isB ? 'B' : 'A'})…`);
    const solid = buildSolidForExport(isB);
    const bin = new STLExporter().parse(solid, { binary: true });
    const blob = new Blob([bin], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    const which = isB ? state.lensTypeB : state.lensType;
    const fname = `prismatica_${which}${isB ? '_B' : ''}_${state.panelWidth}x${state.panelHeight}.stl`;
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    solid.geometry.dispose();
    setStatus(`exported ${fname}`);
  } catch (e) { console.error(e); setStatus('export failed — see console'); }
}

// Generate a fabrication brief markdown for the manufacturer. Walks the lens
// height field, computes peak ridges + narrowest section + bounding box +
// estimated mass in cast PMMA, and writes a one-page summary alongside the STL.
function doExportSpec() {
  try {
    const W = state.panelWidth, H = state.panelHeight;
    const type = LENS_TYPES[state.lensType];
    const heightFn = type.fn(state.params, W, H);
    const wrapped = state.mirrorLens ? (x, y) => heightFn(Math.abs(x), Math.abs(y)) : heightFn;
    // Sample at a fine grid to find peak height + integrated volume estimate.
    const step = 2.0;  // mm
    let maxZ = 0;
    let volRipple = 0;
    const cellArea = step * step;
    for (let y = -H/2; y <= H/2; y += step) {
      for (let x = -W/2; x <= W/2; x += step) {
        const z = wrapped(x, y);
        if (z > maxZ) maxZ = z;
        if (z > 0) volRipple += z * cellArea;
      }
    }
    const baseT = state.thickness;
    const totalH = baseT + maxZ;
    const volBase = W * H * baseT;       // mm³
    const volTotal = volBase + volRipple; // mm³
    const PMMA_DENSITY = 1.18;            // g/cm³
    const massKg = (volTotal / 1000) * PMMA_DENSITY / 1000;
    const lines = [
      `# Prismatica — Fabrication Spec Sheet`,
      ``,
      `Generated: ${new Date().toISOString().slice(0, 10)}`,
      `Project: Custom acrylic refractive lens for light installation`,
      ``,
      `## Part`,
      `- **Material**: Cast PMMA (acrylic), clear, optical grade preferred`,
      `- **Footprint**: ${W} × ${H} mm`,
      `- **Base thickness (flat back)**: ${baseT} mm`,
      `- **Maximum surface height above base**: ${maxZ.toFixed(1)} mm`,
      `- **Overall part height**: ${totalH.toFixed(1)} mm (footprint × peak)`,
      `- **Narrowest section**: ${baseT} mm (at ripple troughs and panel edges)`,
      ``,
      `## Volume + mass`,
      `- Base slab volume: ${(volBase / 1e6).toFixed(2)} L`,
      `- Sculpted ripple volume: ${(volRipple / 1e6).toFixed(2)} L`,
      `- Total volume: ${(volTotal / 1e6).toFixed(2)} L`,
      `- Estimated mass (cast PMMA, ρ = 1.18 g/cm³): **${massKg.toFixed(1)} kg**`,
      ``,
      `## Surface profile — ${type.label}`,
      ...Object.entries(state.params).map(([k, v]) => `- ${k}: ${v}`),
      `- Mirror H+V: ${state.mirrorLens ? 'enabled' : 'disabled'}`,
      ``,
      `## Optical properties (target)`,
      `- IOR: ${state.ior}`,
      `- Dispersion (Abbe-equivalent): ${state.dispersion}`,
      `- Surface roughness: ${state.roughness}`,
      `- Tint: ${state.tint}`,
      ``,
      `## Files supplied`,
      `- High-resolution STL (sealed solid: top + flat back + perimeter walls)`,
      `- This spec sheet`,
      ``,
      `## Manufacturing notes`,
      `- Top sculpted face: diamond-polish or vapour-polish for optical clarity.`,
      `- Bottom flat face: standard machined finish acceptable; fine surface texture is fine since it sits against the LED enclosure.`,
      `- Tolerance on overall dimensions: ±0.5 mm acceptable; surface profile tolerance ±0.2 mm.`,
      `- Side walls: clean cut, can be polished or matte to taste.`,
      `- 5-axis CNC milling on cast PMMA stock is the expected process. Diamond-turning is overkill for this scale.`,
      `- For repeat production runs (5+ pieces), casting from a master mould is more economical than per-piece CNC.`,
      ``,
      `## Contact`,
      `Kit Webster — kit.webster@gmail.com`,
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    const a = document.createElement('a');
    const fname = `prismatica_spec_${state.lensType}_${W}x${H}_${baseT}mmbase.md`;

function doHiResScreenshot(scale = 4) {
  if (offlineInProgress) { setStatus('cannot screenshot during render — wait for it to finish'); return; }
  const W = window.innerWidth;
  const H = window.innerHeight;
  const hiW = Math.round(W * scale);
  const hiH = Math.round(H * scale);
  setStatus(`rendering ${hiW}×${hiH}…`);
  // Upscale everything temporarily
  renderer.setSize(hiW, hiH);
  renderer.setPixelRatio(1);
  camera.aspect = hiW / hiH;
  camera.updateProjectionMatrix();
  composer.setSize(hiW, hiH);
  bloomPass.setSize(hiW, hiH);
  syncLookResolution(hiW, hiH);
  // Render at full res
  renderFrame();
  // Capture before restoring
  renderer.domElement.toBlob((blob) => {

    a.href = URL.createObjectURL(blob);
    a.download = `prismatica_hires_${state.lensType}_${hiW}x${hiH}_${Date.now()}.png`;

  camera.updateProjectionMatrix();
  composer.setSize(W, H);
  bloomPass.setSize(W, H);
  syncLookResolution(W, H);
}

// Needs to be in scope before buildGUI reads it for the dropdown options.
// Aspect ratios (width/height). Combined with REC_RESOLUTIONS to compute final pixel dims.
const REC_ASPECTS = {
  'native':       null,
  '1:1 square':   1,
  '4:5 portrait': 4/5,
  '9:16 reels':   9/16,
  '16:9 wide':    16/9,
};
// Output resolution tiers, measured in px on the short side.
// e.g. 4K at 9:16 = 2160×3840; 4K at 16:9 = 3840×2160; 4K at 1:1 = 2160×2160.
const REC_RESOLUTIONS = {
  '720p (HD)':       720,
  '1080p (Full HD)': 1080,
  '1440p (2K)':      1440,
  '2160p (4K)':      2160,
  '4320p (8K)':      4320,
};
function getRecDims() {
  const ratio = REC_ASPECTS[state.recAspect];
  if (ratio == null) return null;  // native — computed from renderer canvas at render time
  const short = REC_RESOLUTIONS[state.recResolution] || 1080;
  let w, h;
  if (ratio >= 1) { h = short; w = Math.round(short * ratio); }
  else            { w = short; h = Math.round(short / ratio); }
  // Round UP to the nearest multiple of 16 — H.264 macroblocks are 16×16 px.
  // W=1080 is NOT divisible by 16 (1080/16=67.5). If we pass a non-aligned
  // dimension to VideoEncoder, the encoder pads internally (1080→1088) and
  // writes SPS frame_crop parameters telling the decoder to strip those extra
  // pixels. Chrome + mp4-muxer don't always write/honour those crop parameters
  // correctly, producing deterministic grey-square artefacts at consistent
  // frame positions (typically at I-frame boundaries). Rounding UP to 1088 here
  // means the encoder receives an already-aligned frame and never needs to pad.
  // 1920 is already 120×16 so it's unaffected. Aspect-ratio change is <0.4%.
  return [(w + 15) & ~15, (h + 15) & ~15];
}

// =========================================================================
// SHOT SEQUENCE — SketchUp-style ordered scenes with timed transitions
// Each shot = { pose, transitionSec, holdSec }
//   pose = { px,py,pz, tx,ty,tz, zoom }
//   transitionSec = time (s) to fly FROM previous shot TO this one (ignored for first)
//   holdSec       = time (s) to linger on this shot after arriving
// Total clip = sum of (transition + hold) for each shot (first shot's transition = 0)
// =========================================================================
const SEQUENCE_KEY = 'prismatica.shotSequence.v1';
let shotSequence = [];
try {
  const raw = JSON.parse(localStorage.getItem(SEQUENCE_KEY) || '[]');
  if (Array.isArray(raw)) shotSequence = raw;
} catch (_) { shotSequence = []; }
let sequencePlaying = false;   // live preview running (drives camera each frame)
let sequenceStartMs = 0;
let sequenceRenderActive = false;  // true during offline sequence render

function saveShotSequence() {
  try { localStorage.setItem(SEQUENCE_KEY, JSON.stringify(shotSequence)); } catch (_) {}
}
function currentPose() {
  return {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
    zoom: camera.zoom,
  };
}
function applyPose(pose) {
  if (!pose) return;
  if (updateCameraMotion._lastPanDy) {
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
  }
  camera.position.set(pose.px, pose.py, pose.pz);
  controls.target.set(pose.tx, pose.ty, pose.tz);
  if (typeof pose.zoom === 'number') { camera.zoom = pose.zoom; camera.updateProjectionMatrix(); }
  camera.lookAt(controls.target);
}
function addShotToSequence() {
  shotSequence.push({
    pose: currentPose(),
    transitionSec: state.seqDefaultTransition,
    holdSec: state.seqDefaultHold,
  });
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus(`➕ added shot ${shotSequence.length} — sequence now ${sequenceTotalDuration().toFixed(1)}s`);
}
function removeShotFromSequence(i) {

  shotSequence.splice(i, 1);
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus(`removed shot ${i + 1}`);
}
function replaceShotInSequence(i) {
  if (i < 0 || i >= shotSequence.length) return;
  shotSequence[i].pose = currentPose();
  saveShotSequence();
  setStatus(`shot ${i + 1} replaced with current view`);
}
function loadShotPose(i) {
  if (i < 0 || i >= shotSequence.length) return;
  applyPose(shotSequence[i].pose);
  controls.update();
  orbitHomeAzimuth = null;
  orbitHomeElevation = null;
  orbitPhase = 0;
  zoomBaseDist = null;
  zoomPhase = 0;
  panPhase = 0;
  setStatus(`▶ jumped to shot ${i + 1}`);
}
function moveShotInSequence(i, dir) {
  const j = i + dir;
  if (i < 0 || i >= shotSequence.length || j < 0 || j >= shotSequence.length) return;
  const tmp = shotSequence[i];
  shotSequence[i] = shotSequence[j];
  shotSequence[j] = tmp;
  saveShotSequence();
  rebuildSequenceGUI();
}
function clearShotSequence() {
  shotSequence = [];
  saveShotSequence();
  rebuildSequenceGUI();
  setStatus('cleared shot sequence');
}
// Return-leg transition seconds when loopable is on. Eases the camera from the
// last shot's pose back to the first shot's pose at the END of the sequence,
// so the video's final frame sits right next to its first frame and the clip
// loops cleanly when played back-to-back. Disabled for 1-shot sequences (no
// loop possible). Duration borrows state.seqDefaultTransition so the user has
// one knob to tune it.
function sequenceLoopReturnSec() {
  if (!state.recLoop) return 0;
  if (shotSequence.length < 2) return 0;
  return Math.max(0, state.seqDefaultTransition || 0);
}
function sequenceTotalDuration() {
  if (shotSequence.length === 0) return 0;
  let total = shotSequence[0].holdSec || 0;
  for (let i = 1; i < shotSequence.length; i++) {
    total += (shotSequence[i].transitionSec || 0) + (shotSequence[i].holdSec || 0);
  }
  total += sequenceLoopReturnSec();
  return Math.max(0.1, total);
}

// --- Easing curves (t in [0,1] → eased t) ---
const EASINGS = {
  'linear':       t => t,
  'ease-in-out':  t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,   // cubic
  'ease-in':      t => t * t * t,
  'ease-out':     t => 1 - Math.pow(1 - t, 3),
  'smooth (quintic)': t => t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2,
};

// --- Pose interpolation — SLERP of direction around target for orbital arcs ---
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
function lerpPose(A, B, tRaw, ease) {
  const t = ease(Math.max(0, Math.min(1, tRaw)));
  const tx = A.tx + (B.tx - A.tx) * t;
  const ty = A.ty + (B.ty - A.ty) * t;
  const tz = A.tz + (B.tz - A.tz) * t;
  _tmpA.set(A.px - A.tx, A.py - A.ty, A.pz - A.tz);
  _tmpB.set(B.px - B.tx, B.py - B.ty, B.pz - B.tz);
  const la = _tmpA.length(), lb = _tmpB.length();
  const radius = la + (lb - la) * t;
  const ua = _tmpA.clone().normalize();
  const ub = _tmpB.clone().normalize();
  const cosA = Math.max(-1, Math.min(1, ua.dot(ub)));
  let dir;
  if (cosA > 0.9995) {
    dir = ua.lerp(ub, t).normalize();
  } else {
    const omega = Math.acos(cosA);
    const sinO = Math.sin(omega);
    const sa = Math.sin((1 - t) * omega) / sinO;
    const sb = Math.sin(t * omega) / sinO;
    dir = ua.multiplyScalar(sa).add(ub.multiplyScalar(sb));
  }
  return {
    px: tx + dir.x * radius,
    py: ty + dir.y * radius,
    pz: tz + dir.z * radius,
    tx, ty, tz,
    zoom: (A.zoom || 1) + ((B.zoom || 1) - (A.zoom || 1)) * t,
  };
}

// Given elapsed time (s), return the pose the camera should be at.
function evaluateSequenceAt(elapsedSec) {
  if (shotSequence.length === 0) return null;
  if (shotSequence.length === 1) return shotSequence[0].pose;
  let cursor = 0;
  // First shot: hold from 0 to its holdSec
  const firstHold = shotSequence[0].holdSec || 0;
  if (elapsedSec < firstHold) return shotSequence[0].pose;
  cursor = firstHold;
  const easeFn = EASINGS[state.seqEasing] || EASINGS['ease-in-out'];
  for (let i = 1; i < shotSequence.length; i++) {
    const trans = shotSequence[i].transitionSec || 0;
    const hold = shotSequence[i].holdSec || 0;
    if (elapsedSec < cursor + trans) {
      const localT = trans > 0 ? (elapsedSec - cursor) / trans : 1;
      return lerpPose(shotSequence[i - 1].pose, shotSequence[i].pose, localT, easeFn);
    }
    cursor += trans;
    if (elapsedSec < cursor + hold) return shotSequence[i].pose;
    cursor += hold;
  }
  // Loopable: ease from last pose back to first pose so the final frame is
  // right next to the opening frame. Uses the same easing as the main shot
  // transitions so the return arc feels continuous with the rest of the
  // sequence.
  const loopRet = sequenceLoopReturnSec();
  if (loopRet > 0) {
    if (elapsedSec < cursor + loopRet) {
      const localT = (elapsedSec - cursor) / loopRet;
      return lerpPose(shotSequence[shotSequence.length - 1].pose, shotSequence[0].pose, localT, easeFn);
    }
    // After return-leg fully completes we should already be at shot 0's pose;
    // fall through and return it.
    return shotSequence[0].pose;
  }
  return shotSequence[shotSequence.length - 1].pose;
}

function playSequencePreview() {

// ---------------------------------------------------------------------------
// Render Queue — batch multiple render jobs for unattended overnight rendering.
// Each job stores a full preset snapshot + shot sequence. The runner applies
// each job's state in turn, awaits renderOffline(), then advances to the next.
// ---------------------------------------------------------------------------
const QUEUE_KEY = 'prismatica.renderQueue.v1';
let renderQueue = [];

function loadRenderQueue() {
  try {
    const saved = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    // Any job that was 'rendering' when the page closed did not finish — reset to pending.
    renderQueue = saved.map(j => ({ ...j, status: j.status === 'rendering' ? 'pending' : j.status }));
  } catch (_) { renderQueue = []; }
}
loadRenderQueue();

function saveRenderQueue() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(renderQueue)); } catch (_) {}
}

function addToRenderQueue() {
  if (shotSequence.length < 1) { setStatus('add at least 1 shot to the sequence before queuing'); return; }
  const raw  = prompt('Name this render job:', `Job ${renderQueue.length + 1}`);
  const name = (raw || '').trim();
  if (!name) return;
  const job = {
    id: Date.now(),
    name,
    stateSnap: presetSnapshot(),
    sequence:  JSON.parse(JSON.stringify(shotSequence)),
    status:    'pending',
    addedAt:   new Date().toLocaleString()
  };
  renderQueue.push(job);
  saveRenderQueue();
  rebuildQueueGUI();
  const p = renderQueue.filter(j => j.status === 'pending').length;
  setStatus(`queued "${name}" — ${p} pending job${p !== 1 ? 's' : ''}`);
}

let queueRunning = false;
async function runRenderQueue() {
  if (queueRunning) { setStatus('queue is already running'); return; }
  const pending = renderQueue.filter(j => j.status === 'pending');
  if (pending.length === 0) { setStatus('no pending jobs — add some first'); return; }
  queueRunning = true;
  // Snapshot current working state so we can restore it once the queue finishes.
  const restoreSnap = presetSnapshot();
  const restoreSeq  = JSON.parse(JSON.stringify(shotSequence));
  setStatus(`queue started — ${pending.length} job${pending.length !== 1 ? 's' : ''} to render`);
  for (const job of pending) {
    job.status = 'rendering';
    saveRenderQueue();
    rebuildQueueGUI();
    setStatus(`rendering "${job.name}"…`);
    try {
      // Apply the job's saved state + sequence before rendering.
      applyPreset(job.stateSnap);
      shotSequence.length = 0;
      shotSequence.push(...(job.sequence || []));
      saveShotSequence();
      rebuildSequenceGUI();
      guiRefresh();
      // Give Three.js enough time to re-bake the PMREM env map and fully upload
      // all changed textures before starting the render. Two rAF ticks are
      // enough for the PMREM; the 80 ms pause covers GPU texture uploads on
      // slower machines and is imperceptible in an overnight queue.
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      await new Promise(r => setTimeout(r, 80));
      await renderOffline({ sequence: true });
      job.status = 'done';
    } catch (err) {
      job.status = 'error';
      console.error('Render queue job failed:', job.name, err);
    }
    saveRenderQueue();
    rebuildQueueGUI();
  }
  // Restore whatever the user had set up before the queue ran.
  applyPreset(restoreSnap);
  shotSequence.length = 0;
  shotSequence.push(...restoreSeq);
  saveShotSequence();
  rebuildSequenceGUI();
  guiRefresh();
  queueRunning = false;
  const done = renderQueue.filter(j => j.status === 'done').length;
  const errs = renderQueue.filter(j => j.status === 'error').length;
  setStatus(`queue finished — ${done} rendered${errs ? `, ${errs} failed` : ' ✓'}`);
}

function clearDoneJobs() {
  const before = renderQueue.length;
  renderQueue = renderQueue.filter(j => j.status !== 'done' && j.status !== 'error');
  const removed = before - renderQueue.length;
  saveRenderQueue();
  rebuildQueueGUI();
  setStatus(`cleared ${removed} completed job${removed !== 1 ? 's' : ''}`);
}

function removeQueueJob(id) {
  renderQueue = renderQueue.filter(j => j.id !== id);
  saveRenderQueue();
  rebuildQueueGUI();
}

state.queueAddJob      = () => addToRenderQueue();
state.queueRunAll      = () => runRenderQueue();
state.queueClearDone   = () => clearDoneJobs();
state.queueResetAll    = () => {
  renderQueue.forEach(j => { if (j.status === 'done' || j.status === 'error') j.status = 'pending'; });
  saveRenderQueue();
  rebuildQueueGUI();
  setStatus('all completed jobs reset to pending');
};

let fQueue = null;
const queueJobFolders = [];
function rebuildQueueGUI() {
  if (!fQueue) return;
  for (const f of queueJobFolders) { try { f.destroy(); } catch (_) {} }
  queueJobFolders.length = 0;
  // Update the summary readout line at the top of the folder.
  if (fQueue.__qStatusCtrl && fQueue.__qStatusObj) {
    const p = renderQueue.filter(j => j.status === 'pending').length;
    const t = renderQueue.length;
    fQueue.__qStatusObj._info = t === 0
      ? 'empty — add jobs below'
      : `${t} job${t !== 1 ? 's' : ''} · ${p} pending`;
    fQueue.__qStatusCtrl.updateDisplay();
  }
  const ICON = { pending: '⏳', rendering: '🔄', done: '✅', error: '❌' };
  for (const job of renderQueue) {
    const fj = fQueue.addFolder(`${ICON[job.status] || '?'} ${job.name}`);
    fj.close();
    const seqLen = (job.sequence || []).length;
    fj.add({ _info: `${job.status} · ${seqLen} shot${seqLen !== 1 ? 's' : ''} · ${job.addedAt}` }, '_info').name('info').disable();
    if (job.status !== 'rendering') {
      const acts = { remove: () => removeQueueJob(job.id) };
      fj.add(acts, 'remove').name('× remove');
    }
    queueJobFolders.push(fj);
  }
}

// --- Shot sequence GUI section — rebuilt on every add/remove/move ---
let fSeq = null;
// References to the toggle-style action buttons so we can flip their visual
// state (label + colour) when the underlying mode toggles on/off.
let ecoBtnCtrl = null, pauseBtnCtrl = null, recordBtnCtrl = null, seqPlayBtnCtrl = null;
function setBtnActive(ctrl, active, opts = {}) {
  if (!ctrl || !ctrl.domElement) return;
  const labelOn  = opts.labelOn,  labelOff = opts.labelOff;
  if (active && labelOn)  ctrl.name(labelOn);
  if (!active && labelOff) ctrl.name(labelOff);
  ctrl.domElement.classList.toggle('btn-active', !!active);
  if (opts.recColour) ctrl.domElement.classList.toggle('btn-rec', !!active);
}
const seqShotFolders = [];  // sub-folders for each shot
function rebuildSequenceGUI() {
  if (!fSeq) return;
  // Remove old sub-folders
  for (const f of seqShotFolders) { try { f.destroy(); } catch (_) {} }
  seqShotFolders.length = 0;
  // Add one subfolder per shot
  for (let i = 0; i < shotSequence.length; i++) {
    const shot = shotSequence[i];
    const fs = fSeq.addFolder(`Shot ${i + 1}${i === 0 ? ' (start)' : ''}`);
    fs.close();
    const acts = {
      load:    () => loadShotPose(i),
      replace: () => replaceShotInSequence(i),
      del:     () => removeShotFromSequence(i),
      up:      () => moveShotInSequence(i, -1),
      down:    () => moveShotInSequence(i, +1),
    };
    fs.add(acts, 'load').name('▶ jump to this shot');
    fs.add(acts, 'replace').name('⟳ replace with current view');
    if (i > 0) fs.add(shot, 'transitionSec', 0, 30, 0.1).name('transition from prev (s)').onChange(saveShotSequence);
    fs.add(shot, 'holdSec', 0, 10, 0.1).name('hold on this shot (s)').onChange(saveShotSequence);
    if (i > 0) fs.add(acts, 'up').name('↑ move earlier');
    if (i < shotSequence.length - 1) fs.add(acts, 'down').name('↓ move later');
    fs.add(acts, 'del').name('× delete this shot');
    seqShotFolders.push(fs);
  }
  // Update the info controller if it exists. Update BOTH the underlying value
  // (what lil-gui shows on the right) and the label, otherwise the right-side
  // value freezes on whatever was set at construction time.
  if (fSeq.__infoCtrl) {
    const info = shotSequence.length === 0
      ? 'no shots yet — frame a view, hit "save shot"'
      : `${shotSequence.length} shots · total ${sequenceTotalDuration().toFixed(1)}s`;
    if (fSeq.__infoObj) {
      fSeq.__infoObj._info = info;
      fSeq.__infoCtrl.updateDisplay();
    }
    fSeq.__infoCtrl.name('status');
  }
}

// Defensive: ensure every key from defaultStateSnapshot exists on `state` with
// its default value, even if state was loaded from a saved preset that predates
// the key. Without this, lil-gui silently aborts an .add() when the property is
// undefined — and any controls AFTER the failure don't render. This was the
// cause of the "I can't see the new controls" bug after adding eco render.
function normalizeState() {
  const d = defaultStateSnapshot();
  for (const k in d) {
    if (state[k] === undefined) state[k] = d[k];
  }
}
normalizeState();

// --- camera auto-motion state ---
let zoomBaseDist = null;
let zoomPhase = 0;
let orbitHomeAzimuth = null, orbitHomeElevation = null, orbitPhase = 0;
let panPhase = 0;
let loopCameraMode = false;   // set by offline render when recLoop is on
function updateCameraMotion(dt) {
  // In loop mode we force elevation to the same frequency as azimuth and clamp
  // all phases to a single [0..1] cycle per duration so the last frame matches the first.
  const elFreq = loopCameraMode ? 1.0 : 0.63;
  // While the user is dragging the camera — OR a sequence is driving the camera —
  // skip all position-writing auto-motion. Lens spin still runs.
  if (userInteractingWithCamera || sequencePlaying || sequenceRenderActive) {
    if (state.lensSpin) {
      const spinRad = state.lensSpin * Math.PI / 180 * dt;
      if (lensMesh) lensMesh.rotation.z += spinRad;
      if (lensMeshB) lensMeshB.rotation.z += spinRad;
    }
    return;
  }
  if (state.autoOrbit) {
    const rel = camera.position.clone().sub(controls.target);
    const radius = rel.length();
    if (orbitHomeAzimuth === null) {
      orbitHomeAzimuth = Math.atan2(rel.x, rel.z);
      orbitHomeElevation = Math.asin(rel.y / Math.max(0.001, radius));
      orbitPhase = 0;
    }
    orbitPhase += dt * state.orbitSpeed;
    // Sway ±orbitArc° around the starting azimuth, with gentler vertical bob.
    const azArc = (state.orbitArc * Math.PI) / 180;
    const elArc = azArc * 0.28;
    const azimuth = orbitHomeAzimuth + azArc * Math.sin(orbitPhase * Math.PI * 2);
    const elevation = orbitHomeElevation + elArc * Math.sin(orbitPhase * Math.PI * 2 * elFreq);
    const planar = radius * Math.cos(elevation);
    camera.position.x = controls.target.x + planar * Math.sin(azimuth);
    camera.position.z = controls.target.z + planar * Math.cos(azimuth);
    camera.position.y = controls.target.y + radius * Math.sin(elevation);
  } else {
    orbitHomeAzimuth = null;
  }
  if (state.autoZoom) {
    const curDist = camera.position.distanceTo(controls.target);
    if (zoomBaseDist === null) zoomBaseDist = curDist;
    zoomPhase += dt * state.zoomSpeed;
    const target = zoomBaseDist * (1 + state.zoomAmount * Math.sin(zoomPhase * Math.PI * 2));
    const ratio = target / Math.max(0.001, curDist);
    const dir = camera.position.clone().sub(controls.target);
    dir.multiplyScalar(ratio);
    camera.position.copy(controls.target).add(dir);
  } else {
    zoomBaseDist = null;
  }
  if (state.autoPan) {
    // Gentle vertical sway — lifts and drops the camera around its current height.
    // Uses the current camera-to-target distance so the effect scales with framing.
    panPhase += dt * state.panSpeed;
    const dist = camera.position.distanceTo(controls.target);
    const dy = dist * state.panAmount * Math.sin(panPhase * Math.PI * 2);
    // Apply as an offset above the current height — reset each frame so it doesn't drift.
    camera.position.y += dy - (updateCameraMotion._lastPanDy || 0);
    updateCameraMotion._lastPanDy = dy;
  } else if (updateCameraMotion._lastPanDy) {
    // Undo the last pan offset so disabling returns to the natural height.
    camera.position.y -= updateCameraMotion._lastPanDy;
    updateCameraMotion._lastPanDy = 0;
    panPhase = 0;
  }
  if (state.autoOrbit || state.autoZoom || state.autoPan) camera.lookAt(controls.target);

  // Lens spin — rotate the lens mesh (and its B twin) around its Z axis.
  if (state.lensSpin) {
    const spinRad = state.lensSpin * Math.PI / 180 * dt;
    if (lensMesh) lensMesh.rotation.z += spinRad;
    if (lensMeshB) lensMeshB.rotation.z += spinRad;
  }
}

// --- video recording ---
let mediaRecorder = null;
let recordedChunks = [];

let recStartMs = 0;
// Offscreen canvas used when exporting at a non-native aspect ratio (Instagram etc.)
const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');
let recUsesOffscreen = false;

function pickMime() {
  const candidates = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

function drawRecFrame() {
  if (!recUsesOffscreen) return;
  const src = renderer.domElement;
  const sw = src.width, sh = src.height;
  const dw = recCanvas.width, dh = recCanvas.height;
  if (!sw || !sh) return;
  const sAR = sw / sh, dAR = dw / dh;
  let cx, cy, cw, ch;
  if (sAR > dAR) {
    // source wider than target → crop sides
    ch = sh;
    cw = sh * dAR;
    cx = (sw - cw) / 2;
    cy = 0;
  } else {
    // source taller → crop top/bottom
    cw = sw;
    ch = sw / dAR;
    cx = 0;
    cy = (sh - ch) / 2;
  }
  recCtx.drawImage(src, cx, cy, cw, ch, 0, 0, dw, dh);
  drawWatermark(recCtx, dw, dh);
}

function drawWatermark(ctx, w, h) {
  const text = (state.watermarkText || '').trim();
  if (!text) return;
  const pad = Math.max(18, Math.round(Math.min(w, h) * 0.02));
  const fontPx = Math.max(14, Math.round(Math.min(w, h) * 0.022));
  ctx.save();
  ctx.font = `500 ${fontPx}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(text, pad + 1, h - pad + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText(text, pad, h - pad);
  ctx.restore();
}

function startRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') return;
  const dims = getRecDims();
  let streamSource;
  if (dims) {
    recCanvas.width = dims[0];
    recCanvas.height = dims[1];
    recCtx.fillStyle = '#000';
    recCtx.fillRect(0, 0, dims[0], dims[1]);
    recUsesOffscreen = true;
    streamSource = recCanvas;
  } else {
    recUsesOffscreen = false;
    streamSource = renderer.domElement;
  }
  const fps = Math.max(12, Math.min(60, state.recFps | 0 || 30));
  const stream = streamSource.captureStream(fps);
  const mimeType = pickMime();
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16_000_000 });
  } catch (e) {
    try { mediaRecorder = new MediaRecorder(stream); }
    catch (err) { setStatus('recording not supported in this browser'); recUsesOffscreen = false; return; }
  }
  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const tag = state.recAspect.replace(/\s+/g, '_').replace(/[:]/g, 'x');
    a.download = `prismatica_${tag}_${Date.now()}.webm`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    setStatus(`video saved (${(blob.size / 1048576).toFixed(1)} MB · ${state.recAspect})`);
    recUsesOffscreen = false;
    setBtnActive(recordBtnCtrl, false, { labelOn: '■ stop recording', labelOff: '● live record', recColour: true });
  };
  mediaRecorder.start(250);
  recStartMs = performance.now();
  setBtnActive(recordBtnCtrl, true, { labelOn: '■ stop recording', labelOff: '● live record', recColour: true });
  if (recTimer) clearInterval(recTimer);
  recTimer = setInterval(() => {
    const s = ((performance.now() - recStartMs) / 1000).toFixed(1);
    setStatus(`● recording ${state.recAspect} — ${s}s (click again to stop)`);
  }, 250);
}
function stopRecording() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}
function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();

  }
